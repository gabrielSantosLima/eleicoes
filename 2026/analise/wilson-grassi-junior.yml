- area: Educação
  resumo: Reconhece que a União não administra o ensino fundamental e propõe que a Presidência atue financiando, avaliando, induzindo e formando na área de educação.
  texto: PRAZO Fila pública nacional no primeiro ano; metas de cobertura ao longo do mandato. Partido Democrata · Brasil em Primeiro Lugar · Plano de Governo 2027–2030 — 36 — Eixo 8 — Educação e formação A União não administra escola de ensino fundamental. Vale dizer isso de saída, porque metade das promessas de campanha em educação é feita por quem não tem a caneta. O que a Presidência faz é financiar, avaliar, induzir e formar. É a isso que este eixo se limita.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Saúde
  resumo: Adota a abordagem de Saúde Única, prevenindo zoonoses que circulam entre animais e pessoas e que custam mais caro ao SUS quando tratadas no leito hospitalar.
  texto: Todas circulam entre animal e pessoa. E todas custam ao SUS muito mais no leito hospitalar do que custariam no território. O caso mais caro dessa lista não está nela. A pandemia de covid-19 parou o país, matou centenas de milhares de brasileiros e custou ao Estado uma cifra que nenhuma política de vigilância chegaria perto de gastar em um século. Sobre a origem, é preciso precisão em vez de slogan.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Segurança Pública
  resumo: Propõe um cadastro nacional de infratores por maus-tratos a animais, integrado às bases de segurança pública e usado como alerta no risco de violência doméstica.
  texto: 'Mas é sólido o bastante para justificar uma providência barata: registrar quem faz. ▪ Cadastro nacional de infratores por maus-tratos a animais no ar até o fim do primeiro ano de mandato, integrado às bases de segurança pública e usado como fator de alerta na avaliação de risco de violência doméstica. Prazo curto porque a medida é barata, n ão depende de emenda constitucional e dá resposta concreta à sociedade sem esperar o ciclo inteiro do governo. ▪ Protocolo padronizado de comunicação entre serviços de proteção animal, conselhos tutelares e delegacias especializadas em violência doméstica. ▪ Programas territoriais para juventude nas áreas de maior incidência criminal, com avaliação de impacto feita por terceiro.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Meio Ambiente
  resumo: Propõe combater o desmatamento ilegal com inteligência e rastreabilidade da cadeia produtiva e definir prazo ao licenciamento ambiental, com responsável nomeado.
  texto: ▪ Reduzir os encargos setoriais embutidos na tarifa, com transparência sobre o que cada consumidor paga e por quê. 12.3 Meio ambiente e clima ▪ Combater o desmatamento ilegal com inteligência, rastreabilidade da cadeia produtiva e responsabilização patrimonial, com o mesmo instrumental do Pilar 2 do Eixo 3. ▪ Licenciamento ambiental com prazo definido e análise técnica de qualidade. Demora não é rigor; costuma ser falta de gente. ▪ Responsável nomeado para cada processo de licenciamento e para cada marco de obra, com prazo correndo em painel público e apuração automática ao ser descumprido, na mesma regra de ônus adotada no Eixo 2.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
