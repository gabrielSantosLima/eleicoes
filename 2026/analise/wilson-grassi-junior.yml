  resumo: Propõe uma diplomacia sanitária ativa, com presença técnica permanente nos foros internacionais e nas negociações de acesso a mercados para produtos brasileiros.
  texto: ▪ Assistência técnica e crédito em condição melhor para quem adota o padrão. ▪ Diplomacia sanitária ativa, com presença técnica permanente nos foros internacionais e nas negociações de acesso a mercado. 6.4 Quem produz pouco também produz ▪ Crédito simplificado para agricultura familiar, com redução drástica de exigência documental. ▪ Assistência técnica pública com meta de cobertura por região, e não por edital. ▪ Compras públicas de alimentação escolar com prioridade efetiva à produção local e pagamento em prazo curto.
