- area: Direitos Humanos
  resumo: Reafirma o compromisso com a Convenção Americana de Direitos Humanos e a proibição da tortura, lembrando que situações excepcionais seguem o rito constitucional com prazo e controle do Congresso.
  texto: 60, §4º, IV, da Constituição, e nem emenda os suprime. O Brasil é parte da Convenção Americana sobre Direitos Humanos, e a proibição da tortura e do tratamento desumano ou degradante não se submete a urna. Situação excepcional tem rito próprio na Constituição, nos arts. 136 a 141, com prazo, controle do Congresso e responsabilização. Se algum dia for necessário, é por ali.
