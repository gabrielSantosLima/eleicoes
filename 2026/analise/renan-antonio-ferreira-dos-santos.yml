propostas_governo:
- area: Economia e Trabalho
  resumo: Propõe uma PEC de Transição baseada na PEC do Equilíbrio Fiscal, com desindexação de benefícios previdenciários e assistenciais, desvinculação dos pisos de saúde e educação e redução de renúncias fiscais.
  texto: 'PROPOSTAS E SOLUÇÕES DA MISSÃO O primeiro ato de um governo da Missão, na verdade a ser endereçado mesmo antes da posse, será a aprovação de uma PEC de Transição , como a promovida por Lula em 2022. No nosso caso, a PEC de Transição deverá utilizar como base um projeto já protocolado por nosso deputado Kim Kataguiri em 2024, a chamada “PEC do Equilíbrio Fiscal”, que promove a desindexação de benefícios previdenciários e assisten- ciais do salário mínimo (corrigindo-os apenas pela inflação), a desvinculação dos pisos de saúde e educação da receita, a revisão do abono salarial e a redução de renúncias fiscais (gastos tributários), com economia projetada de R$ 1,1 trilhão até 2031. A essa PEC, pretendemos também adicionar uma série de medidas propostas pelo caderno Caminhos do Desenvolvimento: Estabilizar, Crescer, Incluir, publicado pelo CDPP (Centro de Debates de Políticas Públi- cas). O documento que contou com a contribuição de mais de 50 pesquisadores e economistas sistematizou
    de forma coerente uma política econômica baseada em evidências, com disciplina fiscal e racionalidade insti- tucional. Reconhecendo o valor do trabalho técnico e intelectual do CDPP, selecionamos as propostas mais interessantes e as traduzimos à realidade política de hoje e ao nosso entendimento do Brasil: a racionalização do superávit financeiro, a reforma do funcionalismo público com fim dos supersalários, mudanças nas emen- das parlamentares, redução das isenções fiscais e uma nova lei complementar das finanças públicas.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Educação
  resumo: Diagnostica a falta de ordem e a violência nas escolas brasileiras e defende restaurar a disciplina e a transmissão de conteúdos básicos como prioridade da educação.
  texto: A ausência de ordem, somada à falência na transmissão de conteúdos básicos, atesta o desarranjo profundo da educação brasileira. Segundo pesquisa do Observatório Nacional da Violência contra Educadores (ONVE), feita com a Universidade Federal Fluminense, parcela rel- evante dos professores já sofreu agressões físicas ou verbais, e a quase totalidade conhece casos de violência escolar entre colegas. O problema é agudo em todas as regiões do país. Os dados sobre a violência do ambiente escolar reforçam uma percepção intuitiva, que é relatada por educadores, pais e pelos próprios alunos. Não há ordem nas salas de aula brasileiras.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Saúde
  resumo: Parte do diagnóstico de que o SUS é universal e gratuito, mas sofre com falta de médicos, filas de regulação e judicialização, e propõe o programa SUS Fila Zero para ampliar o acesso.
  texto: LIVRO AMARELO - MISSÃO 2026 25 SUS FILA ZERO Saúde O PROBLEMA EM NÚMEROS A RESPOSTA DA MISSÃO O PROBLEMA O Sistema Único de Saúde (SUS) é um sistema que conjuga universalidade e gratuidade. Cerca de 75% da população não tem plano de saúde privado (ANS), embora praticamente 100% da população use o SUS em algum nível (vacinação, vigilância, alta complexidade, transplantes). Como um dos pilares do direito à saúde no Brasil, este sistema, entretanto, padece de graves problemas, como a ausência de médicos em regiões de difícil acesso, a morosidade das filas de regulação e o ônus excessivo decorrente da judicialização da saúde e do desperdício estrutural de recursos. Pesquisas sobre acesso à saúde indicam que grande parte dos brasileiros já relatou enfrentar alguma barreira de acesso ao atendimento. Em enquetes sobre os principais problemas do país, saúde é um dos prob- lemas campeões, especialmente entre as mulheres.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Segurança Pública
  resumo: Propõe tolerância zero contra o crime organizado, tratando o tráfico como questão de segurança nacional e reforçando a integração entre as forças policiais.
  texto: 'A estratégia proposta começa com: 1 Posicionamento do Brasil como Árbitro do Sul Global por meio de uma diplomacia ativa nas três regiões estratégicas: África, onde o país pode mediar conflitos, expandir sua influência em recursos naturais e rotas comerciais; Ásia, onde pode usar Timor-Leste como porta de entrada e estabelecer parcerias com a ASEAN, em particular com as Filipinas e o Vietnã; e América Latina, sua zona natural de influência onde deve consolidar liderança por meio da integração multilateral. 2 Proposta sobre a Guerra contra o Tráfico redefine esse combate como questão de segurança nacional de nível militar, não simplesmente policial, exigindo um Pacto Interamericano contra o crime organizado, liderado pelo Brasil e ancorado na Convenção de Palermo e na OEA, com um Centro de Operações Cen- tral na América Latina e um tribunal internacional especializado em criminalidade transnacional. Essas duas propostas, que visam a projeção externa e recuperação interna, são complementares.
    Como deveria ser claro, o Brasil não pode liderar o Sul Global enquanto narcotraficantes controlam cidades e fronteiras. LIVRO AMARELO - MISSÃO 2026 46 3 Proposta de integração Lusófona reposiciona a comunidade de língua portuguesa como bloco geo - político coeso, com mecanismos de cooperação econômica, defesa coordenada e instituições compar- tilhadas, transformando Portugal, Angola, Moçambique e outros países em parceiros estratégicos de primeira ordem.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Meio Ambiente
  resumo: Propõe conciliar a preservação ambiental com o desenvolvimento econômico, combatendo o desmatamento ilegal e valorizando a matriz energética limpa do país.
  texto: 'No Rio de Janeiro e em Santa Catarina, conseguimos criar uma integração especialmente proveitosa entre pesquisadores e inte- grantes das equipes de governo desses dois estados, e gradativamente o discurso da Missão se tornou mais coeso e orgânico, adquirindo profundidade e sistematicidade. O insight inicial para o Livro Amarelo surgiu da constatação, que vinha amadurecendo havia algum tempo, de que a versão do liberalismo brasileiro, vulgarizada pela nova direita, oferecia soluções simplistas para problemas complexos: bastava privatizar tudo, retirar o Estado de todas as áreas e proferir platitudes sobre meio ambiente, saúde, educação, cultura e segurança, e tudo se resolveria de uma forma quase mágica. Do lado mais conservador do espectro político, teorias da conspiração floresciam sem respaldo na realidade concreta. Esse cenário deprimente nos deu a inspiração para trilhar um caminho próprio, cujos frutos princi- pais foram a Revista Valete e o próprio Livro Amarelo. Do ponto
    de vista de seu enquadramento ideológico, o teor do texto ainda é marcado pela adesão a pilares do pensamento liberal, em especial no aspecto econômico (fala-se de contenção de gastos, de reforma trabalhista para flexibilizar relações de trabalho, de redução de supersalários, de reforma administrativa e de austeridade fiscal), mas rejeitamos a versão vulgarizada que oferecia panaceias e falava vagamente em desburocratização e privatizações, por considerá-la aquém dos problemas brasileiros.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Infraestrutura e Mobilidade
  resumo: O programa Missão Rondon prevê renovação dos modais de transporte, expansão da malha ferroviária, retomada de obras em portos e aeroportos e elevar o investimento em infraestrutura de 2% para 4% do PIB.
  texto: Em seguida, o capítulo “Missão Rondon” descreve os principais projetos de infraestrutura que consider- amos essenciais para a integração regional e superação do famigerado “Custo Brasil”. Esses projetos contem- plam a renovação dos modais de transporte, a expansão da malha ferroviária, a retomada de obras interrom- pidas em portos e aeroportos e um melhor aproveitamento do potencial energético da nossa matriz limpa, com a meta de elevar os investimentos em infraestrutura dos atuais 2% do PIB para, pelo menos, 4%. Em “SUS Fila Zero” propomos uma agenda de inovação na área da saúde, com integração da inteligência artificial para melhoria e democratização dos serviços. A proposta envolve a superação do gargalo de acesso por meio da substituição do atual modelo de fila cronológica por um modelo de prioridade de risco, bem como a adoção de um sistema similar ao DoctorSV, de El Salvador, que representa grande avanço tecnológico na área com sua interface de I.A. O capítulo “Chega de Saudade”
    trata da nossa deformação cultural durante as últimas décadas e de nossos projetos para restaurar a cena artística e jornalística vibrante e criativa que já tivemos na metade do século passado.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Direitos Humanos
  resumo: Propõe garantir segurança e cidadania às populações mais vulneráveis, enfrentando a violência e a ocupação do território pelo crime organizado, com atenção à proteção da mulher e da criança.
  texto: SEGURANÇA PÚBLICA.....................................................................................................11 III QUEM PAGA A BANDA... PACTO FEDERATIVO...............................................................................................14 IV ESCOLHE A MÚSICA LEI DE RESPONSABILIDADE GERENCIAL..............................................................................17 V PRODUTIVIDADE PELA CIDADANIA ECONOMIA E ASSISTENCIALISMO..........................................................20 VI MISSÃO RONDON INFRAESTRUTURA..........................................................................................................23 VII SUS FILA ZERO SAÚDE...............................................................................................................................25 VIII CHEGA DE SAUDADE CULTURA.................................................................................................................27 IX FORMAR ELITES, CULTIVAR O POVO EDUCAÇÃO...................................................................................30
    X O NORDESTE É SOLUÇÃO ZONAS ECONÔMICAS ESPECIAIS..........................................................................34 XI CUM MENTE ET MALLEO TERRAS RARAS E INDÚSTRIA.................................................................................37 XII CELEIRO DO MUNDO AGRICULTURA E TECNOLOGIA ......................................................................................41 XIII BRASIL PODEROSO POLÍTICA EXTERNA.......................................................................................................44 XIV A BATALHA DO BRASIL DESFAVELIZAÇÃO.................................................................................................48 POSFÁCIO .......................................
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Agricultura
  resumo: Apresenta o agro como setor estratégico e propõe consolidar o Brasil como Celeiro do Mundo, com ciência e tecnologia aplicadas à produção de alimentos e insumos.
  texto: 'A comparação com outras nações continentais expõe o atraso brasileiro: enquanto os Estados Unidos possuem cerca de 250 mil km de malha ferroviária e a China cerca de 160 mil km, o Brasil tem apenas 30 mil km. Em rodovias, os corredores de escoamento do agronegócio, a exemplo da BR-163 no eixo do Arco Norte, sofrem com pavimentação precária e concessões arrastadas; já eixos de integração regional, como a BR-319, que liga a Amazônia Ocidental ao restante do país, permanecem inacabados por entraves de licenciamento, e mesmo a BR-101, espinha dorsal do litoral, acumula trechos críticos. O Plano Nacional de Logística (PNL) prevê uma série de melhorias e metas. Historicamente, no entanto, os cenários otimistas desses planos ja- mais são concretizados. Segundo o Acompanhamento de Obras Paralisadas, o país soma mais de 11 mil empreendimentos com verbas federais interrompidas, de um total de 21 mil, assombrosos mais da metade.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Tecnologia e Inovação
  resumo: Propõe integrar o Brasil a cadeias produtivas globais de alto valor a partir das terras raras e articular agro e inteligência artificial, exportando insumos alimentares e computacionais.
  texto: Em seguida, em “Cum Mente et Malleo”, destacamos a oportunidade única das terras raras (as quais o Brasil possui a segunda maior reserva do mun- do) e nosso plano para integrar o Brasil em cadeias produtivas globais com alto valor agregado a partir desses valiosos recursos. O capítulo 12, “Celeiro do Mundo”, trata da ciência e tecnologia a partir dos dois setores mais importantes para o mundo hoje, o agro e a inteligência artificial, articulando um projeto de país expor- tador de insumos tanto alimentares quanto computacionais para o restante do planeta. Essa posição privi - legiada é a base das propostas desenvolvidas no capítulo seguinte, “Brasil Poderoso”, que apresenta nossos planos para a política externa, visando a sentar o Brasil à mesma mesa das grandes potências. Nosso porte nos recomenda a ser o árbitro do Sul Global e a auxiliar nossas nações irmãs da América Latina no combate ao tráfico internacional. Por fim, encerramos a terceira parte com “A Batalha do Brasil”, um
    detalhamento do nosso ambicioso plano de desfavelização, que irá transformar a cultura e a forma de vida de dezenas de milhões de brasileiros, como pré-condição para nossa maturidade civilizacional.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: Defende reforma administrativa com fim dos supersalários, maior transparência e combate à corrupção, reduzindo privilégios do funcionalismo e o gasto público.
  texto: Esse cenário deprimente nos deu a inspiração para trilhar um caminho próprio, cujos frutos princi- pais foram a Revista Valete e o próprio Livro Amarelo. Do ponto de vista de seu enquadramento ideológico, o teor do texto ainda é marcado pela adesão a pilares do pensamento liberal, em especial no aspecto econômico (fala-se de contenção de gastos, de reforma trabalhista para flexibilizar relações de trabalho, de redução de supersalários, de reforma administrativa e de austeridade fiscal), mas rejeitamos a versão vulgarizada que oferecia panaceias e falava vagamente em desburocratização e privatizações, por considerá-la aquém dos problemas brasileiros. O Livro Amarelo não surgiu do nada. Ao longo dos últimos dois anos, contamos com a colaboração de mais de duzentos voluntários, que produziram seis fascículos de pesquisa, debruçando-se sobre todos os te - mas imagináveis, da história econômica do Brasil à política externa, do combate ao crime em El Salvador aos planos de habitação de
    Singapura. Esses estudos iniciais nos ajudaram a construir uma compreensão coesa do Brasil e do mundo e fecundaram as ideias que hoje compõem o coração deste livro.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Política Externa
  resumo: Propõe conter a influência chinesa no BRICS e liderar a América Latina contra o crime organizado, tratando o narcotráfico como ameaça à soberania nacional.
  texto: 'A ameaça do narcotráfico é, por si só, estruturante para a crise geopolítica brasileira. Também são desafios: ▪ o impacto econômico devastador do crime organizado, cuja criminalidade custa à sociedade cerca de 4,2% do PIB, hoje mais de R$ 450 bilhões anuais, minando a capacidade do Estado de investir em defesa, educação e infraestrutura; ▪ a captura de instituições pelo crime organizado, que contamina o aparato judiciário, legislativo e ex- ecutivo, criando um Estado paralelo que não pode ser eliminado por abordagens convencionais de policiamento; CAPÍTULO XIII POLÍTICA EXTERNA LIVRO AMARELO - MISSÃO 2026 45 ▪ a dependência do Brasil de uma resposta internacional contra o tráfico enquanto simultaneamente luta para reconquistar seu próprio território, uma condição que exige tanto força militar interna quanto diplomacia regional, sobrecarregando a capacidade estatal. Essa “narco-corrupção” institucional representa a ameaça mais imediata à soberania brasileira. Externa- mente, o Brasil
    enfrenta múltiplas vulnerabilidades que limitam sua capacidade de liderança regional. São elas: ▪ a subordinação progressiva a potências que não compartilham seus interesses, particularmente por meio da crescente dominação chinesa dentro do BRICS, que ameaça transformar o bloco em instru- mento de expansão geopolítica de Pequim; ▪ a fragmentação da América Latina com o colapso da União de Nações Sul-Americanas (Unasul), deix- ando o Brasil sem uma arquitetura regional capaz de equilibrar influências externas e promover inte- gração genuína; ▪ a presença deficiente do Estado nas fronteiras, criando vulnerabilidades que potências rivais exploram por meio de drogas, armas e ocupação territorial gradual.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Assistência Social
  resumo: Critica o assistencialismo e propõe reformular os programas sociais para estimular a produtividade e a inserção no trabalho, sem abandonar quem realmente precisa.
  texto: De um lado, um partido que governa pela quinta vez e que repete as promessas brejeiras de sempre, como picanha e cerveja, às quais ele acrescenta algumas migalhas em benefícios sociais. Os problemas de grave insegurança, má qualidade na prestação da saúde pública, baixa produtividade e desigualdades sociais brutais não são resolvidos. São problemas estruturais que permaneceram conosco durante os governos desse partido, de forma que apenas a fé cega indicaria alguma esperança de que ele possa resolvê-los. De outro lado, temos um vácuo no lugar da direita, uma massa sem forma e sem qualquer projeto, uma espécie de buraco intelectual e criativo. O que se chama de bolsonarismo é, desde o princípio, um ajuntamen- to duvidoso de pilantras e iludidos, animado por um conjunto de ideias confusas.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
