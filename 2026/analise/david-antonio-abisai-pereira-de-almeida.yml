propostas_governo:
- area: Economia e Trabalho
  resumo: O plano propõe economia solidária com bancos comunitários e apoio do FMPES, um Núcleo Estadual de Competitividade da Zona Franca, o programa Amazonas Fornecedor e estudos para o Distrito Industrial III, além de bioeconomia.
  texto: '- Desenvolver um ecossistema de Startups Sociais: economia solidária, criação de moedas sociais (bancos comunitários) e serviços financeiros solidários, de natureza associativa e cooperativa, com apoio técnico e recursos do FMPES, circulando e distribuindo riquezas sobretudo em áreas isoladas. - Criar o Núcleo Estadual de Competitividade da Zona Franca de Manaus: acompanhamento da implementação da Reforma Tributária; instituição da Mesa Permanente da Zona Franca de Manaus; monitoramento dos fatores que afetem a competitividade do Polo Industrial; elaboração de estudos técnicos; coordenação das ações institucionais de defesa do modelo; articulação das ações voltadas à atração de investimentos, expansão industrial e geração de empregos; implantação do Observatório da Competitividade da Economia Amazonense. - Implantar o Programa Amazonas Fornecedor: fortalecimento das empresas amazonenses que podem integrar a cadeia de suprimentos do Polo Industrial de Manaus, aproximando indústria,
    bioeconomia e economia da floresta, ampliando a participação de fornecedores locais na produção industrial, estimulando novos negócios e aumentando a circulação de riqueza dentro do próprio Estado. - Realizar estudos para a criação do Distrito Industrial III: parceria com a Suframa e a Prefeitura de Manaus para a criação de uma nova área de instalação das indústrias a partir de um projeto que contemple infraestrutura viária, drenagem, corredores ecológicos, tratamento de efluentes, gás natural, energia renovável, condomínios industriais, fornecimento de água, central de valorização de resíduos industriais, mobilidade, segurança e outros, com compartilhamento de custos e responsabilidades. PLANO DE GOVERNO - 2027 • 2030 PRA CIMA AMAZONAS 41 Bioeconomia: Aproveitamento Sustentável da Floresta co'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Educação
  resumo: Partindo do bom desempenho de Manaus no IDEB 2023, o plano quer levar qualidade ao interior, enfrentando limitações estruturais e garantindo transporte escolar a comunidades rurais, ribeirinhas, indígenas e quilombolas.
  texto: 'Manaus ficou entre as 4 capitais com melhor desempenho na avaliação dos anos iniciais do IDEB 2023. Índice de Desenvolvimento da Educação Básica (IDEB) 2023 Esses resultados refletem os investimentos realizados pela Prefeitura de Manaus na modernização da infraestrutura escolar, na ampliação da educação infantil, na valorização dos profissionais da educação, na formação continuada, na melhoria da gestão pedagógica, na alfabetização na idade certa, na inovação tecnológica e no acompanhamento permanente da aprendizagem. A experiência da capital demonstra que políticas públicas consistentes, associadas à gestão eficiente e ao monitoramento de resultados, produzem avanços concretos na qualidade da educação. PLANO DE GOVERNO - 2027 • 2030 PRA CIMA AMAZONAS 20 IDEB Manaus – Anos Iniciais (2023) A realidade é diferente no interior: grande parte dos municípios ainda enfrenta limitações estruturais que dificultam a oferta de ensino de qualidade. Em milhares de comunidades rurais, ribeirinhas,
    indígenas e quilombolas, o deslocamento até a escola depende de longas viagens por rios e estradas, tornando o transporte escolar um componente essencial para garantir o direito à educação.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Saúde
  resumo: O programa Avança Saúde Amazonas pretende reestruturar o SUS no estado, superando a centralização em Manaus, com infraestrutura nos municípios polo e inovação digital para levar consultas, exames e cirurgias perto do cidadão.
  texto: 'Ao cruzar a conectividade digital com a infraestrutura hidroviária e o respeito à cultura local, o Amazonas tem a oportunidade de criar o modelo de saúde pública tropical mais eficiente e inovador do mundo: um sistema que protege a vida com a mesma força com que a floresta protege a biodiversidade. Diretriz Geral: “Reestruturar de forma profunda o Sistema Único de Saúde (SUS) no Amazonas, superando o modelo de centralização na capital e garantindo atendimento médico digno, rápido e de alta qualidade em todo o território estadual. O programa “Avança Saúde Amazonas” une o fortalecimento da infraestrutura física hospitalar nos municípios polo à inovação digital e tecnológica. A meta principal é salvar vidas e reduzir o sofrimento das populações do interior, assegurando que o cidadão encontre consultas Especializadas, exames complexos e cirurgias perto de sua casa, sem a necessidade de deslocamentos forçados e penosos para Manaus. PLANO DE GOVERNO - 2027 • 2030 PRA CIMA AMAZONAS 54
    “AVANÇA SAÚDE AMAZONAS” Mais perto das pessoas, mais cuidado para todos.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Segurança Pública
  resumo: O programa Amazonas Seguro propõe política integrada e preventiva contra o crime organizado, com proteção de fronteiras, combate à pirataria fluvial, inteligência policial, monitoramento das calhas dos rios e modernização do sistema penitenciário.
  texto: Paralelamente, priorizaremos a valorização dos profissionais da área, o combate ao crime organizado em todas as regiões e a prevenção social da violência, assegurando que a presença do Estado, a cidadania e a cultura de paz cheguem com a mesma eficiência a cada canto do nosso extenso território. “AMAZONAS SEGURO” O programa Amazonas Seguro propõe uma política de segurança pública moderna, integrada e preventiva, voltada ao enfrentamento do crime organizado, à proteção das nossas fronteiras, ao combate à pirataria fluvial, à valorização dos profissionais da segurança e ao fortalecimento da inteligência policial. Nosso compromisso é ampliar a capacidade do Estado de prevenir a violência, combater a criminalidade e garantir mais tranquilidade para as famílias amazonenses. Também vamos fortalecer a atuação conjunta com os municípios, investir em tecnologia, ampliar o monitoramento das calhas dos rios, apoiar a modernização do sistema penitenciário e promover ações voltadas à proteção
    das mulheres, crianças, adolescentes e das populações mais vulneráveis. A preservação do patrimônio ambiental e o combate aos crimes ambientais também serão tratados como prioridades para proteger a floresta, os territórios e as comunidades tradicionais.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Meio Ambiente
  resumo: O eixo de meio ambiente, sustentabilidade e transição climática orienta o plano, conciliando desenvolvimento econômico, inovação e conservação da floresta, das águas e dos recursos naturais do Amazonas.
  texto: 'DIRECIONAMENTO ESTRATÉGICO 31 6. EIXOS ESTRATÉGICOS 33 EIXO 1: GESTÃO PÚBLICA EFICIENTE E TRANSPARENTE 35 EIXO 2: DESENVOLVIMENTO ECONÔMICO SUSTENTÁVEL E INOVAÇÃO 39 EIXO 3: INFRAESTRUTURA E LOGÍSTICA PARA A INTEGRAÇÃO REGIONAL 45 EIXO 4: EDUCAÇÃO TRANSFORMADORA 49 EIXO 5: SAÚDE DESCENTRALIZADA E REGONALIZADA – “AVANÇA SAÚDE AMAZONAS” 53 EIXO 6: SEGURANÇA INTEGRADA 57 EIXO 7: DESENVOLVIMENTO SOCIAL, CIDADANIA E DIREITOS HUMANOS 61 EIXO 8: MEIO AMBIENTE, SUSTENTABILIDADE E TRANSIÇÃO CLIMÁTICA 65 EIXO 9: INTERIOR FORTE E SUSTENTÁVEL 69 7 . O AMAZONAS DO FUTURO COMEÇA AGORA 72 PLANO DE GOVERNO - 2027 • 2030 PRA CIMA AMAZONAS 4 1. INTRODUÇÃO O Amazonas chega a um momento decisivo de sua história. Em um cenário de profundas transformações econômicas, sociais, tecnológicas e ambientais, o Estado reúne condições únicas para inaugurar um novo ciclo de desenvolvimento, capaz de transformar suas potencialidades em oportunidades concretas para toda a população.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Infraestrutura e Mobilidade
  resumo: O plano trata a infraestrutura e a logística como base do desenvolvimento, apontando a falta de ligação rodoviária confiável e os cerca de 400 km sem pavimentação no trecho central da BR-319 como gargalo a enfrentar.
  texto: Dados de 2025 PLANO DE GOVERNO - 2027 • 2030 PRA CIMA AMAZONAS 17 INFRAESTRUTURA E LOGÍSTICA A infraestrutura logística é um dos principais fatores para o desenvolvimento econômico e social do Amazonas. Em um Estado de dimensões continentais, onde rios, rodovias, aeroportos e portos desempenham papel estratégico na integração territorial, as limitações da infraestrutura comprometem a mobilidade da população, elevam os custos de produção, dificultam o acesso aos serviços públicos e reduzem a competitividade da economia amazonense. O Amazonas permanece sem uma ligação rodoviária perene e confiável com o restante do país. A BR-319, principal eixo terrestre entre Manaus e Porto Velho, ainda possui aproximadamente 400 quilômetros de seu trecho central sem pavimentação. Durante o período chuvoso, esse segmento torna-se praticamente intransitável, isolando o Estado, aumentando o custo do transporte de pessoas, insumos e mercadorias e reduzindo a competitividade das cadeias produtivas.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Direitos Humanos
  resumo: O eixo de desenvolvimento social, cidadania e direitos humanos combate as desigualdades territoriais e a vulnerabilidade social, ampliando proteção social e segurança alimentar frente à pobreza que atinge grande parte da população.
  texto: Esse posicionamento é reflexo direto de problemas estruturais que persistem fora dos grandes centros, onde a ausência do poder público e o controle de rotas logísticas por grupos armados nas calhas dos rios mantêm os índices criminais agregados em patamares elevados. DESENVOLVIMENTO SOCIAL, CIDADANIA E DIREITOS HUMANOS O Amazonas enfrenta elevados níveis de vulnerabilidade social, marcados por desigualdades territoriais, dificuldades de acesso aos serviços públicos e desafios para a garantia da proteção social e da segurança alimentar. Segundo estimativas do Ministério do Desenvolvimento e Assistência Social (MDS), em 2026 cerca de 53% da população estará em situação de pobreza ou baixa renda. As vulnerabilidades diferem entre os contextos urbano e rural. Nas cidades predominam problemas como precariedade habitacional, informalidade do trabalho, baixa renda e acesso desigual aos serviços públicos.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Agricultura
  resumo: Para a agricultura, o plano incentiva sistemas agroflorestais e o cultivo sustentável de várzeas, cria linhas de crédito ao empreendedor, apoia piscicultura e manejo florestal e fortalece a Agência de Defesa Agropecuária.
  texto: '- Projeto com foco no Incentivo à Agricultura Familiar com técnicas sustentáveis, especialmente para o aproveitamento das áreas de várzea para plantio de arroz, milho, mandioca, melancia e melão com técnicas que garantam maior produtividade e sustentabilidade. PLANO DE GOVERNO - 2027 • 2030 PRA CIMA AMAZONAS 71 EXTRATIVISMO ANIMAL, PECUÁRIA, PISCICULTURA E MANEJO FLORESTAL – RIOS DA RIQUEZA Prospera Amazonas - Incentivar sistemas agroflorestais: modelos produtivos que integrem produção agrícola, recuperação ambiental e geração de renda, ampliando a sustentabilidade da agricultura familiar. - Criar o Crédito do Empreendedor, linhas de créditos e apoio técnico para fortalecer a economia da floresta e para os pequenos negócios. - Incentivar à Piscicultura, Bovinocultura, Ovinocultura e avicultura e o manejo sustentável de pirarucu, jacaré e quelônios. - Fortalecer a Agência de Defesa Agropecuária (ADAF) para aprimorar os mecanismos de vacinação e controle dos rebanhos e animais de
    produção.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Tecnologia e Inovação
  resumo: O programa Acelera Amazonas busca diversificar a economia com ciência, inovação, governo digital, inteligência artificial, robótica e biotecnologia, mantendo o fortalecimento e a competitividade da Zona Franca de Manaus.
  texto: 'Objetivo Geral: impulsionar a transição do Amazonas para uma economia dinâmica, diversificada, competitiva e de baixo carbono, consolidando o Estado como o principal polo de inovação tecnológica e sustentabilidade da Amazônia. “ACELERA AMAZONAS” integrará a cultura amazônica, os conhecimentos tradicionais, as riquezas naturais, a biodiversidade, a educação tecnológica, a ciência, a pesquisa, a inovação, o governo digital, a inteligência artificial, a robótica e a biotecnologia para produzir riquezas, gerar empregos qualificados, distribuir renda e promover a inclusão social, garantindo a proteção do meio-ambiente, águas e floresta, como nosso maior ativo econômico. Fortalecimento da Zona Franca de Manaus (ZFM) A Zona Franca de Manaus continuará sendo o principal motor da economia amazonense. Receberá atenção permanente, preservando a competitividade, impulsionando processos de inovação, atraindo novos investimentos, qualificando a mão de obra, diversificando o modelo econômico,
    garantindo a manutenção dos empregos e das vantagens comparativas asseguradas pela Constituição Federal e promovendo o desenvolvimento sustentável de todas as regiões do Amazonas. O Polo Industrial de Manaus é um patrimônio econômico consolidado.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: O plano foi estruturado em nove eixos com base em diagnóstico técnico e indicadores, orientado por evidências, responsabilidade fiscal, inovação, transparência e avaliação permanente dos resultados da gestão.
  texto: Este Plano foi construído a partir de um diagnóstico técnico da realidade amazonense, fundamentado em indicadores socioeconômicos, estudos setoriais e análise das principais tendências nacionais e internacionais. A partir desse diagnóstico, foram definidos 9 (nove) eixos estratégicos, programas e ações orientados por evidências, responsabilidade fiscal, inovação, transparência e compromisso com resultados, reconhecendo que uma gestão pública eficiente depende de planejamento, boa governança e avaliação permanente das políticas públicas. Nossa visão de governo parte da convicção de que desenvolvimento econômico, proteção ambiental e inclusão social caminham juntos. A preservação da floresta deve gerar oportunidades para quem vive nela; a força da Zona Franca de Manaus deve impulsionar a inovação e ampliar a competitividade do Estado; o crescimento econômico precisa ser acompanhado da melhoria da educação, da saúde, da segurança pública, da infraestrutura, da geração de emprego e
    renda e da qualidade de vida em todos os municípios. O futuro do Amazonas será construído pela capacidade de integrar essas agendas em uma estratégia única de desenvolvimento.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Assistência Social
  resumo: A assistência social integra o eixo de desenvolvimento social, com foco em reduzir a vulnerabilidade, ampliar a segurança alimentar e garantir acesso aos serviços públicos às famílias em situação de pobreza no urbano e no rural.
  texto: Esse posicionamento é reflexo direto de problemas estruturais que persistem fora dos grandes centros, onde a ausência do poder público e o controle de rotas logísticas por grupos armados nas calhas dos rios mantêm os índices criminais agregados em patamares elevados. DESENVOLVIMENTO SOCIAL, CIDADANIA E DIREITOS HUMANOS O Amazonas enfrenta elevados níveis de vulnerabilidade social, marcados por desigualdades territoriais, dificuldades de acesso aos serviços públicos e desafios para a garantia da proteção social e da segurança alimentar. Segundo estimativas do Ministério do Desenvolvimento e Assistência Social (MDS), em 2026 cerca de 53% da população estará em situação de pobreza ou baixa renda. As vulnerabilidades diferem entre os contextos urbano e rural. Nas cidades predominam problemas como precariedade habitacional, informalidade do trabalho, baixa renda e acesso desigual aos serviços públicos.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
