propostas_governo:
- area: Economia e Trabalho
  resumo: Reduzir impostos e simplificar o empreendedorismo, reformar o IRPJ e criar o programa Sócios do Brasil (R$ 1.000 ao nascer) para estimular patrimônio e educação financeira.
  texto: 'Criar uma cultura de educação financeira na sociedade brasileira a partir do programa Sócios do Brasil: Depositar R$1.000 para cada brasileiro ao nascer, com o valor aplicado em fundos de ações e saque permitido apenas aos 18 anos, para estimular desde cedo a formação de patrimônio e a educação financeira. PLANO IMPLACÁVEL ● ROMEU ZEMA | 19 SIMPLIFICAR O EMPREENDEDORISMO E REDUZIR OS IMPOSTOS Reduzir o imposto de renda das empresas para o nível dos países desenvolvidos: Reduzir gradualmente o imposto de renda das empresas para aproximar o Brasil das economias desenvolvidas e permitir que mais recursos fiquem na atividade produti- va impulsinando investimento, expansão e geração de empregos. Assegurar uma implementação eficaz da Reforma Tributária: Evitar que a regulamentação da Reforma Tributária replique a complexidade do sis- tema atual por meio de burocracias desnecessárias, regimes especiais, exceções e tratamentos favorecidos, garantindo monitoramento técnico, transparência
    sobre impactos setoriais e compromisso verificável de neutralidade da carga tributária. Reformar o IRPJ e simplificar de vez o pagamento de impostos das empresas: Reformar a tributação das empresas, em especial os impostos diretos como o IRPJ, partindo do princípio de que é o Estado, e não o contribuinte, que deve calcular o imposto, com a Receita apurando o valor automaticamente a partir da nota fiscal eletrônica e eliminando anexos, faixas e obrigações acessórias, para que o empreen- dedor troque tempo e dinheiro gastos com burocracia por investimento, crescimento e geração de empregos. Facilitar a abertura, operação e o fechamento de empresas: Promover o diálogo com o setor produtivo por meio de mesas executivas com vá- rios atores nas principais cadeias de suprimentos para eliminar todas as'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Educação
  resumo: Modernizar a BNCC, focar o MEC na educação básica, valorizar e formar professores e diretores e ampliar a educação profissional.
  texto: 'Modernizar a Base Nacional Comum Curricular: Revisar e aprimorar a BNCC para torná-la mais clara, objetiva e focada nas apren- dizagens essenciais de cada etapa da educação básica, alinhando o currículo às competências necessárias para o século XXI, com prioridade para a alfabetização, o raciocínio lógico, as ciências e as competências digitais. PLANO IMPLACÁVEL ● ROMEU ZEMA | 52 Dedicar o MEC apenas à educação básica e formação de professores: Transferir as atribuições relacionadas ao ensino superior do atual Ministério da Edu- cação para o Ministério de Ciência e T ecnologia, permitindo que o MEC esteja exclu- sivamente focado na aprendizagem das crianças e jovens e nos desafios inerentes à primeira infância, alfabetização, ensinos fundamental e médio e na educação profis- sional e tecnológica. FORMAR E VALORIZAR PROFESSORES QUE ENSINAM COM EXCELÊNCIA E DIRETORES QUE LIDERAM Aprimorar a formação de professores na graduação: Fortalecer a formação dos professores na graduação para
    aproximá-la da prática em sala de aula e das evidências científicas sobre aprendizagem, com prioridade para alfabetização, matemática e ensino estruturado, fortalecendo os critérios de qualida- de para cursos de licenciatura, ampliando residências pedagógicas e incentivando programas que atraiam e desenvolvam os melhores talentos para a carreira docente. Fortalecer a gestão e liderança escolar: Avançar na adoção de boas práticas de gestão educacional e formação de diretores escolares, condicionando parte dos repasses financeiros ao cumprimento de crité- rios técnicos para a seleção e o desenvolvimento de gestores escolares. Criar diretrizes nacionais para carreiras docentes baseadas em de - senvolvimento e desempenho: Avançar na adoção de modelos mais modernos de valorização docente, para que'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Saúde
  resumo: Melhorar a gestão do SUS, fortalecer a atenção primária e a Estratégia Saúde da Família e reduzir filas de consultas, exames e cirurgias.
  texto: 'Facilitar a entrada de especialistas no Brasil: Simplificar os processos de reconhecimento de qualificações e de concessão de vis- tos para especialistas em setores de fronteira tecnológica, reduzindo os obstáculos à entrada desses profissionais no mercado e nas universidades brasileiras e permi- tindo que o setor privado tenha acesso aos talentos de que necessita para crescer. PLANO IMPLACÁVEL ● ROMEU ZEMA | 57 SAÚDE Três em cada quatro brasileiros dependem exclusivamente do SUS e, muitas vezes, o que encontram é fila: fila para consultas, exames e cirurgias que não podem esperar. O orçamento da saúde já passa de R$230 bilhões por ano e boa parte desse recurso é mal aplicada. O problema é de gestão: o sistema é dividido entre União, estados e municípios, pouco articulado e com poucos mecanismos de incentivo a resultados. A atenção primária, que deveria evitar a doença antes que ela se agrave, promovida pela Estratégia de Saúde da Família, ainda não alcança 72 milhões de brasileiros.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Segurança Pública
  resumo: Dar respaldo legal e estrutura às polícias, integrar as forças e enfrentar o crime organizado, incluindo garimpo ilegal e milícias.
  texto: 'Conhecer o que existe debaixo do solo brasileiro: Retomar o levantamento geológico do território nacional com dados abertos e pa- drão internacional, para que que empresas possam identificar novas jazidas de mi- nerais de alto valor e transformar as descobertas em investimento, emprego qualifi- cado e arrecadação nos municípios mineradores. Acabar com o garimpo ilegal e a mineração do crime organizado: Enfrentar a mineração ilegal como política de segurança pública, integrando forças policiais, órgãos de fiscalização e inteligência financeira, com rastreabilidade da ori- gem do ouro e responsabilização de quem compra minério de origem criminosa, protegendo as comunidades da Amazônia e a reputação da mineração brasileira no exterior. Transformar rejeito parado em minério novo: Destravar o aproveitamento econômico dos rejeitos e das estruturas já existentes, com regras claras sobre titularidade e responsabilidade pelo material, descomissio- nando barragens antigas e gerando produção,
    emprego e arrecadação a partir do que hoje é apenas passivo. PLANO IMPLACÁVEL ● ROMEU ZEMA | 36 POLÍTICA EXTERNA O Brasil já foi uma voz respeitada no mundo, com uma diplomacia reconhecida pelo pragmatismo e pela capacidade de defender os interesses nacionais. Esse patrimô- nio foi dilapidado nos últimos anos.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Meio Ambiente
  resumo: Combater a grilagem e o crime organizado no agro com monitoramento por satélite e desenvolver o mercado de créditos de carbono.
  texto: 'Combater a grilagem e a entrada do crime organizado no agro: Aprimorar o monitoramento do território nacional e o combate à grilagem com uso de sensoriamento remoto por satélite, para enfrentar o avanço do crime organizado e proteger a reputação internacional do agronegócio brasileiro. PLANO IMPLACÁVEL ● ROMEU ZEMA | 47 MEIO AMBIENTE O Brasil é uma potência ambiental: abriga a maior biodiversidade do planeta, con- serva mais de dois terços do seu território com vegetação nativa e é referência mun- dial em energia limpa e produção agropecuária sustentável. Nenhum outro país reú- ne tantos ativos naturais. Contudo, seguimos desperdiçando o potencial de transformar isso em riqueza. O Brasil poderia suprir até 20% da demanda mundial por créditos de carbono e mal participa desse mercado.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Infraestrutura e Mobilidade
  resumo: Ampliar investimentos em infraestrutura e saneamento, com concessões e parcerias para destravar obras e melhorar a logística.
