- area: Política Externa
  resumo: Reaproximar o Brasil das democracias e dos parceiros comerciais, com uma diplomacia pragmática voltada ao desenvolvimento nacional.
  texto: 'Transformar rejeito parado em minério novo: Destravar o aproveitamento econômico dos rejeitos e das estruturas já existentes, com regras claras sobre titularidade e responsabilidade pelo material, descomissio- nando barragens antigas e gerando produção, emprego e arrecadação a partir do que hoje é apenas passivo. PLANO IMPLACÁVEL ● ROMEU ZEMA | 36 POLÍTICA EXTERNA O Brasil já foi uma voz respeitada no mundo, com uma diplomacia reconhecida pelo pragmatismo e pela capacidade de defender os interesses nacionais. Esse patrimô- nio foi dilapidado nos últimos anos. Em vez de servir ao desenvolvimento do país, a política externa passou a ser orientada por afinidades ideológicas, aproximando o Brasil de regimes autoritários e afastando-o das democracias que são seus parceiros naturais e seus maiores mercados. Os números expõem o tamanho do retrocesso.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Assistência Social
  resumo: Criar portas de saída do Bolsa Família via capacitação e trabalho, qualificar o Minha Casa Minha Vida e tratar com dignidade a população em situação de rua.
  texto: 'Esse cenário deixa claro que a saída da pobreza e a conquista da própria autonomia por todos os cidadãos só tem um caminho: a renda do trabalho. Por isso, sem descuidar de quem está em situação de vulnerabilidade, é preciso criar uma porta de saída estruturada, que conecte os beneficiários dos programas sociais a oportunidades de capacitação e trabalho para superarmos a pobreza no Brasil. O país também observa o crescimento rápido da população em situação de rua, que já passa de 388 mil brasileiros. Essas pessoas, que tiveram suas vidas destruídas por questões como ruptura familiar, dependência química, falta de moradia e de desen- volvimento econômico, precisam ser tratadas com dignidade, mas o poder público também não pode aceitar a desordem e a insegurança nas cidades. Além disso, o Brasil convive com um déficit de 5,9 milhões de moradias, e programas como o Minha Casa, Minha Vida não se preocuparam na última década com a quali- dade e localização dos imóveis, afastando famílias
    de empregos e serviços públicos.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
