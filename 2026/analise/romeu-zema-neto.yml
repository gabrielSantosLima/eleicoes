- area: Tecnologia e Inovação
  resumo: Conectar universidades ao mercado, ampliar bolsas em exatas e engenharias, atrair especialistas e dar transparência ao gasto público em inovação.
  texto: 'Ampliar a transparência do gasto público à inovação: Publicar em formato aberto quem recebeu recursos de apoio público à inovação, com nome do beneficiário, valor e resultado alcançado, como os da Lei do Bem, os editais e a subvenção econômica da Finep, os empréstimos do FNDCT, os repasses a orga- nizações sociais e as chamadas do CNPq, permitindo que a sociedade cobre entrega de quem recebe dinheiro do contribuinte. PLANO IMPLACÁVEL ● ROMEU ZEMA | 56 CONECTAR AS UNIVERSIDADES ÀS DEMANDAS DO MERCADO Fortalecer a formação dos brasileiros em ciências, tecnologias, en- genharias e matemáticas: Ampliar as vagas e o financiamento de bolsas de pesquisa para as áreas de ciên- cias, tecnologia, engenharia e matemática, alinhando a oferta do ensino superior às demandas da economia e aos setores com maior potencial de geração de renda e inovação para o Brasil. Eliminar barreiras à criação de centros de inovação e pesquisa de empresas dentro das universidades brasileiras: Criar um ambiente
    regulatório que facilite a instalação de centros de pesquisa e desenvolvimento, com apoio do setor produtivo dentro das universidades públicas, aproximando a produção científica das demandas reais do mercado e gerando o financiamento privado complementar às instituições. ATRAIR E FORMAR AS MELHORES MENTES PARA A ECONOMIA DO FUTURO Formar profissionais para a economia do futuro em parceria com o setor privado: Estruturar programas de formação técnica e superior em setores de fronteira tecno- lógica, em parceria com o setor privado, aproximando os currículos das demandas reais do mercado. Facilitar a entrada de especialistas no Brasil: Simplificar os processos de reconhecimento de qualificações e de concessão de vis- tos para especialistas em setores de fronteira tecnológica, reduzindo os obstácul'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
