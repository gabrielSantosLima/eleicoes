- area: Direitos Humanos
  resumo: Combater a violência contra a mulher (delegacias 24h, Patrulhas Maria da Penha e Salas Lilás) e fortalecer a proteção às vítimas.
  texto: 'Dar respaldo legal e condições materiais e tecnológicas para as polícias poderem agir com firmeza e segurança: Fortalecer a atuação policial, garantindo proteção legal na legítima defesa contra criminosos armados, especialmente com fuzis, e fornecer estrutura para o trabalho policial, integrando em tempo real as informações entre as polícias federal e estadu- ais e ampliando o acesso a equipamentos e tecnologias. REDUZIR A SUBNOTIFICAÇÃO E REINCIDÊNCIA DE CASOS DE VIOLÊNCIA CONTRA A MULHER Fortalecer a porta de entrada da denúncia: Ampliar a rede de delegacias da mulher com atuação 24 horas e equipes preferen- cialmente femininas capacitadas em violência de gênero, e apoiar os estados na construção de sistemas integrados entre Saúde, Segurança Pública e delegacias. Proteger a mulher e monitorar o agressor após a denúncia: Expandir nas redes de segurança pública e saúde de estados e municípios as Pa- trulhas Maria da Penha, que monitoram o cumprimento de medidas protetivas para
    reduzir a reincidência, e as Salas Lilás, com espaços de acolhimento às vítimas em unidades policiais. PLANO IMPLACÁVEL ● ROMEU ZEMA | 8 COMBATE À CORRUPÇÃO E AOS PRIVILÉGIOS O Brasil convive há décadas com um problema estrutural de privilégios, corrupção e baixa responsabilização dos políticos e agentes do Estado que cometem crimes. O país manteve a 107a posição no Índice de Percepção da Corrupção em 2025, mesma colocação de 2024, evidenciando a dificuldade de sustentar avanços consistentes na área.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
