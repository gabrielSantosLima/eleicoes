propostas_governo:
- area: Economia e Trabalho
  resumo: Reduzir a jornada de trabalho para 35 horas semanais sem redução de salários e proibir demissões, revogando a reforma trabalhista e restabelecendo a CLT, com aposentadoria mais cedo e salário-desemprego integral.
  texto: 'Para acabar com o desemprego e gerar milhões de novos postos de trabalho, é preciso conquistar a redução da carga horária sem prejuízo dos salários. • Redução da jornada de trabalho para o máximo de 7 horas por dia, 5 dias por semana (35 horas semanais): trabalhar menos para que todos trabalhem • Proibição das demissões; ocupação e controle dos trabalhadores sobre as empresas que demitam ou ameacem fechar • Salário-desemprego igual ao último salário recebido para todos os trabalhadores demitidos • Proibição de despejos e cortes de serviços essenciais (como água, luz, gás etc.) para todos os desempregados • Passe livre nos transportes para desempregados e trabalhadores da economia informal. PROGRAMA DE LUTA · ELEIÇÕES 2026 03 Revogar todas as "reformas" do golpe de 2016 Não bastam palavras. É preciso uma ampla mobilização que ponha fim à criminosa reforma trabalhista levada a cabo pelos golpistas e imponha o imediato restabelecimento de toda a CLT e o fim da terceirização, com direitos
    iguais para todos os trabalhadores. • Cancelamento da "reforma" trabalhista, retorno e ampliação de toda a legislação de proteção dos trabalhadores • Em defesa das aposentadorias e pensões confiscadas com a reforma da Previdência • Revogar todas as "reformas" contra os trabalhadores da ativa e aposentados, em todos os níveis (federal, estadual e municipal) • Aposentadoria, no máximo, aos 25 anos de trabalho para as mulheres e 30 anos para os homens • Cobrança das dívidas das grandes empresas com a Previdência, se necessário, com a tomada do controle dessas empresas pelo Estado • Imposto sobre as grandes fortunas para garantir os recursos necessários para as aposentadorias e pensões • Reajuste das aposentadorias e pensões, com reposição de 100% das perdas • Fim dos privilégios de oficiais m'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Educação
  resumo: Defender o ensino público e gratuito, com mais verbas, piso salarial nacional dos professores, eleição direta para os postos de gestão e livre ingresso nas universidades, rejeitando a censura.
  texto: 'Para isso, é preciso lutar pelo fim da política de destruição do ensino público levada adiante pelos tubarões do ensino privado e seus lacaios nos governos. • Abaixo a ditadura nas escolas e a perseguição aos professores e estudantes; eleição direta de todos os postos de gestão • Mais verbas para a educação; verbas públicas somente para o ensino público • Revogação de todas as "reformas" do regime golpista contra a educação e o ensino público • Fim dos vestibulares. Livre ingresso nas universidades • Piso salarial nacional dos professores de, pelo menos, R$8,5 mil • Escolas e Universidades sob o controle da comunidade escolar: eleição dos diretores e de todos os postos de direção nas escolas; governo tripartite (estudantes, professores e funcionários) nas Universidades • Jornada de trabalho dos professores de no máximo 30 horas semanais • Estatização do ensino pago • Abaixo a censura; fim da proibição do uso de celulares nas escolas. 09 Fim do lucro com a doença: saúde pública
    e gratuita, sob o controle dos trabalhadores A destruição sistemática do SUS e o avanço da privatização da saúde aumentam o sofrimento e as mortes, enquanto geram gigantescos lucros dos mercadores dos planos de saúde, hospitais e empresas. É preciso lutar pelo fim da política de destruição da saúde pública pelos mercadores da doença e seus governos.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Saúde
  resumo: Defender o SUS público e gratuito sob controle dos trabalhadores, com mais verbas, plano emergencial para hospitais e postos, retorno do Mais Médicos e abertura de cursos de medicina e enfermagem.
  texto: 'Livre ingresso nas universidades • Piso salarial nacional dos professores de, pelo menos, R$8,5 mil • Escolas e Universidades sob o controle da comunidade escolar: eleição dos diretores e de todos os postos de direção nas escolas; governo tripartite (estudantes, professores e funcionários) nas Universidades • Jornada de trabalho dos professores de no máximo 30 horas semanais • Estatização do ensino pago • Abaixo a censura; fim da proibição do uso de celulares nas escolas. 09 Fim do lucro com a doença: saúde pública e gratuita, sob o controle dos trabalhadores A destruição sistemática do SUS e o avanço da privatização da saúde aumentam o sofrimento e as mortes, enquanto geram gigantescos lucros dos mercadores dos planos de saúde, hospitais e empresas. É preciso lutar pelo fim da política de destruição da saúde pública pelos mercadores da doença e seus governos. • Mais verbas para a saúde pública. Não pode haver limite nos gastos para salvar a vida do povo • Plano de emergência para
    construção de hospitais e postos de saúde em todo o País • Volta do programa Mais Médicos e validação imediata de todos os diplomas de médicos brasileiros e estrangeiros residentes no País • Abertura imediata de centenas de cursos de medicina, enfermagem etc.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Segurança Pública
  resumo: Dissolver a polícia militar e todo o aparato repressivo, garantir o direito de autodefesa dos trabalhadores e a liberdade irrestrita de expressão, combatendo o controle dos meios de comunicação.
  texto: 'Liberdade de expressão e direito de autodefesa É preciso acabar com a cassação dos direitos democráticos de todo o povo, com a verdadeira ditadura que é o controle dos meios de comunicação por meia dúzia de famílias e com o massacre do povo negro, dos jovens e trabalhadores, com as mais de seis mil mortes por ano provocadas pela polícia em todo o País, em uma verdadeira guerra contra o povo pobre. • Dissolução da polícia militar e de todo o aparato repressivo • Direito de autodefesa dos trabalhadores da cidade e do campo • Formar comitês de autodefesa dos trabalhadores da cidade, do campo e das comunidades de índios PROGRAMA DE LUTA · ELEIÇÕES 2026 • Acabar com a ditadura do "PIG" ("Partido da Imprensa Golpista"): cancelamento da concessão da Rede Globo (e dos demais grandes meios de comunicação) por crimes contra o País. Estatização das empresas, sob o controle dos trabalhadores • Fim de todo tipo de censura, liberdade irrestrita de expressão, na imprensa, na Internet, nas ruas
    etc. Abaixo a “Lei Felca” • Quebra do monopólio na Internet pelas grandes empresas privadas de telecomunicações. Internet gratuita para toda a população • Liberdade irrestrita de expressão; abaixo a censura.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
