- area: Direitos Humanos
  resumo: Revogar as reformas trabalhista e da Previdência e cancelar as privatizações, reestatizando as empresas entregues ao capital estrangeiro e colocando a riqueza nacional a serviço do povo.
  texto: É preciso uma ampla mobilização que ponha fim à criminosa reforma trabalhista levada a cabo pelos golpistas e imponha o imediato restabelecimento de toda a CLT e o fim da terceirização, com direitos iguais para todos os trabalhadores. • Cancelamento da "reforma" trabalhista, retorno e ampliação de toda a legislação de proteção dos trabalhadores • Em defesa das aposentadorias e pensões confiscadas com a reforma da Previdência • Revogar todas as "reformas" contra os trabalhadores da ativa e aposentados, em todos os níveis (federal, estadual e municipal) • Aposentadoria, no máximo, aos 25 anos de trabalho para as mulheres e 30 anos para os homens • Cobrança das dívidas das grandes empresas com a Previdência, se necessário, com a tomada do controle dessas empresas pelo Estado • Imposto sobre as grandes fortunas para garantir os recursos necessários para as aposentadorias e pensões • Reajuste das aposentadorias e pensões, com reposição de 100% das perdas • Fim dos privilégios de oficiais
    militares, juízes e familiares • Gestão dos trabalhadores sobre os fundos previdenciários. 04 Cancelar as privatizações e a destruição da economia nacional Todo o País sofre horrores por conta da entrega das empresas estatais ou do seu sucateamento, iniciada na famigerada era FHC. É preciso cancelar a venda do patrimônio do povo brasileiro e reestatizar todas as empresas entregues ao capital estrangeiro por verdadeiros lesa-pátria. E colocar toda a riqueza natural do Brasil e tudo o que foi construído com o suor dos trabalhadores a serviço do próprio povo.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Política Externa
  resumo: Combater a ingerência estrangeira e a internacionalização da Amazônia, defender a soberania nacional e apoiar Cuba, Nicarágua e Venezuela contra o imperialismo dos EUA e da OEA.
  texto: PROGRAMA DE LUTA · ELEIÇÕES 2026 13 Fora o imperialismo da Amazônia e da América Latina A ingerência estrangeira na Amazônia deve ser veementemente combatida; é preciso que o próprio País defenda o seu território e o desenvolva. • Não à internacionalização da Amazônia e a toda a política de ingerência do imperialismo na região • Defesa da soberania e da unidade nacional, com o controle das organizações populares e dos índios sobre as riquezas do território amazônico e da sua exploração em benefício do povo • Em defesa de Cuba, Nicarágua e Venezuela. Todo apoio à luta do povo boliviano contra o regime ditatorial. Abaixo a ingerência dos EUA e da OEA; fora o imperialismo da América Latina. 14 Em defesa do futebol, do carnaval e de todas as manifestações da cultura popular Para a burguesia e a direita e seus partidos, o povo não tem direito à festa, não tem direito à confraternização.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Assistência Social
  resumo: Repor integralmente as perdas salariais, com aumento emergencial e reajuste automático pela inflação, salário mínimo vital e Bolsa Família de ao menos um salário mínimo, anulando dívidas com o sistema financeiro.
  texto: 'PROGRAMA DE LUTA · ELEIÇÕES 2026 Pontos centrais do nosso programa de luta 01 Parar o roubo dos salários A inflação, a cassação dos direitos trabalhistas e os juros exorbitantes vêm corroendo ininterruptamente o salário do trabalhador brasileiro, por isso é necessário um reajuste imediato dos salários e uma política de proteção dos vencimentos dos trabalhadores diante da inflação. • Reposição integral de 100% das perdas salariais; aumento emergencial de 50% de todos os salários • Escala móvel dos salários, diante da escalada da inflação: aumento automático toda vez que o custo de vida do trabalhador subir 3% • Salário mínimo vital suficiente para atender às necessidades do trabalhador e de sua família (que hoje não poderia ser menor que R$7.500), deliberado pelas organizações operárias • Auxílio emergencial de verdade, Bolsa Família de pelo menos um salário mínimo, enquanto durar a situação de caos atual • Anulação de todas as dívidas dos trabalhadores com o sistema financeiro.
    02 Reduzir a jornada e acabar com o desemprego A burguesia tem criado mecanismos para que, diante do medo do desemprego, os trabalhadores aceitem a redução de qualquer garantia trabalhista que ainda lhes resta. Para acabar com o desemprego e gerar milhões de novos postos de trabalho, é preciso conquistar a redução da carga horária sem prejuízo dos salários. • Redução da jornada de trabalho para o máximo de 7 horas por dia, 5 dias por semana (35 horas semanais): trabalhar menos para que todos trabalhem • Proibição das demissões; ocupação e controle dos trabalhadores sobre as empresas que demitam ou ameacem fechar • Salário-desemprego igual ao último salário recebido para todos os trabalhadores demitidos • Proibição de despejos e cortes de serviços essenciais (como água, luz, gás etc.) para todos o'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
