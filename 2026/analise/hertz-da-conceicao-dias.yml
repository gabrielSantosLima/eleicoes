propostas_governo:
- area: Economia e Trabalho
  resumo: Critica a desindustrialização e a dependência da exportação de commodities, que geram empregos precários e baixos salários, e defende retomar a indústria e os setores estratégicos sob controle nacional.
  texto: Fora das cadeias de produção de alto valor, resta ao Brasil o papel de fornecer as chamadas commodities ao mercado externo. Sem indústria de ponta, com um peso cada vez maior do grande agronegócio e com uma economia desnacionalizada, dominada por grandes monopólios estrangeiros, restam os empregos de baixos salários, precarizados, e uma brutal superexploração. O resultado é um país, na prática, pobre que se degrada cada vez mais. A voracidade do capital internacional imperialista avança sobre as áreas estratégicas e os serviços públicos. O setor elétrico é um forte exemplo disso, refletindo nas altas contas de luz e em serviços cada vez piores.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Educação
  resumo: Defende educação pública de qualidade, rompendo com a lógica que subordina a formação às necessidades do mercado, com valorização dos profissionais e ampliação dos investimentos.
  texto: Filas extensas, exames e agendamento com especialistas são hoje um verdadeiro calvário para a grande maioria da população. O ensino público segue pelo mesmo caminho, da educação básica às universidades públicas. Como se não bastasse, a violência urbana vem se transformando num dos principais problemas das famílias. Nas periferias e nos grandes centros urbanos, a violência policial por meio, principalmente, da Polícia Militar, submete toda uma população a um estado de exceção permanente, com execuções sumárias, chacinas e o encarceramento em massa, sob a justificativa da “guerra às drogas”. Essa mesma população, muitas vezes, sobrevive sob o domínio do crime organizado, transfigurado hoje em verdadeiras empresas capitalistas que exploram e oprimem populações inteiras.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Saúde
  resumo: Defende o SUS público, universal, gratuito e 100% estatal, com fim das privatizações e das OS, mais investimento na atenção básica e na saúde mental e contratação por concurso público.
  texto: 'A gestão deve ser realizada pelos trabalhadores do serviço público sob controle dos trabalhadores usuários, nos bairros e comunidades SAÚDE A crise do SUS expressa diretamente esse conflito: garantir saúde pública universal implica enfrentar os mecanismos que drenam recursos e subordinam o sistema à lógica privada. Defesa do sus público, universal, gratuito e 100% estatal Fim da privatização e da gestão privada da saúde (OS, Fundações e PPP) Proibição da transferência de leitos públicos para planos privados Ampliação do investimento público em saúde, com prioridade para a atenção básica Cuidado com a saúde mental: ampliação do investimento público nos Centros de Atenção Psicossocial (Caps), no Serviço de Residências Terapêuticas e Centros de Convivência. Nenhum investimento público em Comunidades Terapêuticas! Contratação via concurso público e valorização dos trabalhadores da saúde Produção pública de medicamentos e insumos estratégicos Expansão da rede pública de hospitais, upas
    e Unidades Básicas de Saúde (UBS) Integração entre saúde e saneamento, enfrentando doenças relacionadas à falta de infraestrutura. EDUCAÇÃO Da mesma forma, garantir educação pública de qualidade exige romper com a lógica que subordina a formação e o conhecimento às necessidades do mercado.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Segurança Pública
  resumo: Defende a desmilitarização das polícias e o enfrentamento da violência estrutural, combatendo os abusos do Estado contra as periferias e a atuação de facções, milícias e do crime organizado.
  texto: 'Romper com a subordinação dos pequenos e médios produtores à lógica do agronegócio, garantindo autonomia produtiva e capacidade de decisão sobre o que e como produzir. Segurança pública A população trabalhadora convive diariamente com diferentes formas de violência: desde aquelas que são fruto do desespero social até assaltos, roubos, feminicídios, violência contra as mulheres, atuação de organizações criminosas – tráfico, milícias, facções ou outras organizações –, além da violência praticada pelo próprio Estado contra as periferias, especialmente contra a juventude negra e pobre e os movimentos populares. As instituições que, em tese, deveriam garantir a segurança da população são, dentro do sistema capitalista, organizadas para preservar a ordem social existente. À medida que a crise e a decadência do capitalismo se aprofundam, essas mesmas instituições, justamente para sustentar um sistema cada vez mais em crise, tornam-se também fonte de violência e insegurança, atingindo
    principalmente a população trabalhadora. Por isso, fracassa a política dos governos do sistema, que alternam entre o abandono das comunidades e a repressão indiscriminada da população pobre, sem enfrentar os grandes interesses econômicos, políticos e estatais – muitas vezes também corruptos – que sustentam a criminalidade organizada.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Meio Ambiente
  resumo: Propõe um plano nacional de obras públicas que respeite o meio ambiente, com universalização do saneamento e infraestrutura voltada às necessidades sociais sob controle público.
  texto: Bolsa equivalente a um salário mínimo para trabalhadores desempregados enquanto não houver pleno emprego. Plano nacional de obras públicas voltado à geração de empregos, universalização do saneamento básico, construção de escolas, hospitais, creches, infraestrutura ambiental, entre outras obras necessárias e respeitadoras do meio ambiente. Revogação da reforma trabalhista Revogação da lei das terceirizações. Fim da terceirização, salário igual para trabalho igual e direitos para todos os trabalhadores. Incorporação dos trabalhadores terceirizados no quadro efetivo do serviço público e realização de concurso público para novas contratações.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Infraestrutura e Mobilidade
  resumo: Defende moradia como direito e o fim dos despejos, com construção de moradias populares, urbanização das periferias, universalização do saneamento e transporte público como direito social.
  texto: Enquanto morar for um privilégio, ocupar é um direito! Fim dos despejos de famílias sem alternativa habitacional Construção massiva de moradias populares e infraestrutura por empresa pública de obras Urbanização das periferias e comunidades populares Universalização do saneamento básico Garantia de infraestrutura, transporte, educação e saúde nos bairros populares Expropriação dos imóveis urbanos abandonados, ociosos ou destinados exclusivamente à especulação imobiliária. Plano diretor com garantia de acesso a serviços e direitos IPTU progressivo com isenção para baixa renda Participação popular no planejamento urbano, que deve ser decidido pelo povo organizado. TRANSPORTE PÚBLICO O transporte público é um direito social e condição fundamental para o acesso ao trabalho, à educação, à saúde, à cultura e ao lazer. Mas, ao articular território, trabalho e acesso a direitos, mostra como a organização da cidade está subordinada ao lucro e não às necessidades da população.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Direitos Humanos
  resumo: Defende cotas, acessibilidade e intérprete de libras e o combate às opressões contra negros, mulheres, LGBTQIAPN+ e povos indígenas, com serviços públicos de qualidade.
  texto: 'Mais cotas Garantia de intérprete de libras nas universidades e meios de comunicação Acessibilidade: rampas e elevadores para cadeirantes nos serviços públicos, bancos, supermercados Espaços que abafem ruídos para autistas com sensibilidade auditiva, em especial nas escolas. Assistência médica gratuita e de qualidade no sus Todas essas lutas – por soberania, trabalho, terra, meio ambiente, serviços públicos, segurança, contra as opressões de negros e negras, mulheres, das LGBTQIAPN+, povos indígenas – partem das necessidades imediatas da população. Mas, ao avançarem, entram em conflito com os interesses dos grandes grupos econômicos, do sistema financeiro e da forma como a economia está organizada. É esse processo que coloca a necessidade de ir além das reivindicações imediatas e enfrentar as engrenagens do sistema que bloqueiam sua realização. As medidas de um plano econômico dos trabalhadores REESTATIZAÇÃO DAS EMPRESAS ESTRATÉGICAS: PELO CONTROLE SOCIAL DOS SETORES ESTRATÉGICOS
    Expropriação imediata (em grande parte dos casos, reversão de privatização) das grandes empresas privadas dos setores de mineração, petróleo, energia, siderurgia, celulose e das grandes comercializadoras e centralizadoras do agronegócio, incorporando seus ativos ao patrimônio público nacional.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Agricultura
  resumo: Propõe direcionar o crédito do Banco do Brasil à agricultura familiar, quilombola e indígena, expropriar terras de famílias escravocratas e punir o racismo nos locais de trabalho.
  texto: Desencarceramento em massa PSTU ELEIÇÕES 2026 | COM OS TRABALHADORES CONTRA O SISTEMA 21 Implementação efetiva da Lei 1645/2008, com ensino de história e cultura afro-brasileira e indígena em toda rede de ensino Punição severa (multas de caráter confiscatório ou mesmo expropriação) dos empregadores que estimulam ou toleram racismo nos locais de trabalho. Que o Banco do Brasil destine suas verbas para a agricultura familiar, quilombola e indígena, e não para o agronegócio escravista. Expropriação de todos os bilionários herdeiros de famílias escravocratas MULHERES As mulheres compõem uma parte decisiva da classe trabalhadora brasileira e estão entre as mais atingidas pela decadência econômica e social do país. São maioria nos trabalhos mais precarizados, informais e mal remunerados, concentradas nos setores de serviços, cuidado e reprodução social, recebendo salários inferiores mesmo quando exercem as mesmas funções. A reestruturação produtiva, a terceirização, a plataformização
    e a destruição de direitos aprofundaram essa realidade.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Tecnologia e Inovação
  resumo: Critica a entrega de setores estratégicos ao capital estrangeiro e o sucateamento de universidades e agências de fomento, defendendo investimento público em pesquisa, ciência e tecnologia.
  texto: Até mesmo o saneamento básico está sendo entregue aos grupos estrangeiros, num sentido inverso a diversos países da Europa que hoje estão sendo obrigados a reverterem uma série de privatizações do setor de saneamento. Se neste projeto não cabem investimentos em industrialização, tampouco faz sentido garantir educação, saúde, segurança e desenvolver pesquisa ou tecnologia. Essa é a razão pela qual vemos o sucateamento de universidades, centros e agências de fomento. O que o imperialismo deseja, seus governos aplicam e uma submissa burguesia nacional apoia, é o aprofundamento de uma mão de obra cada vez mais barata, disciplinada, com cada vez menos direitos e dependente do capital, ou seja das grandes empresas e multinacionais, para garantir o mínimo de sobrevivência. Não é por menos que, nos governos estaduais, sejam governadas pelo PT ou a extrema direita, o que chamam de "segurança pública", na verdade, aparatos de repressão policial, sejam priorizados como política pública.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: Propõe controle popular e transparência na gestão pública, combatendo privilégios, corrupção e a influência dos grandes grupos econômicos sobre o Estado.
  texto: 'Milhões de trabalhadores passaram a depender de aplicativos para obter renda. Os aplicativos, porém, transferem todos os riscos da atividade econômica aos trabalhadores, não há transparência em seus algoritmos e não há nenhum controle público. Defendemos aqui as reivindicações atuais dos trabalhadores de aplicativos, surgidas em suas lutas e no tópico seguinte fazemos uma proposta para que possamos realmente garantir transparência nos algoritmos e melhores condições para os trabalhadores de aplicativos. Reconhecimento do vínculo empregatício Garantia de todos os direitos: previdência, férias, 13º, descanso remunerado, seguro contra acidentes, licença-maternidade e proteção social efetiva Regulamentação sem direitos é fraude! Não ao PLP 152, que legaliza a precarização!'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Política Externa
  resumo: Propõe enfrentar o imperialismo em defesa da soberania nacional, rompendo com a submissão às grandes potências e aos interesses do capital internacional.
  texto: É um verdadeiro processo de retrocesso social que tem como raiz o domínio de um pequeno grupo de monopólios e a subserviência às grandes potências capitalistas. PSTU ELEIÇÕES 2026 | COM OS TRABALHADORES CONTRA O SISTEMA 03 Enfrentar os capitalistas e o imperialismo em defesa da soberania nacional As candidaturas do PT, do centrão e da extrema direita prometem, de forma vaga, melhorar a vida da população. Mas isso é simplesmente impossível mantendo o país dominado pelo imperialismo. E enfrentar as grandes potências capitalistas é algo que não vão fazer, seja porque não é seu projeto, seja porque são aliadas a uma burguesia nacional que tem em seu DNA a submissão, e, como projeto, se perpetuar enquanto sócia-menor do imperialismo, satisfazendo-se com as migalhas que caem da mesa dos poderosos. Os sucessivos ataques imperialistas de Trump à América Latina, que no Brasil se concretizaram no tarifaço, apoiado na extrema direita bolsonarista, é um exemplo inconteste disso.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Assistência Social
  resumo: Defende salário igual para trabalho igual, direitos para todas as trabalhadoras, creches e escolas em tempo integral, restaurantes e lavanderias públicas e redução da jornada sem redução salarial.
  texto: 'POR EMPREGO, SALÁRIO DIGNO E DIREITOS PARA AS MULHERES! Salário igual para trabalho igual Combate à desigualdade salarial e à superexploração das mulheres, em especial das mulheres negras Garantia de direitos para todas as trabalhadoras (aposentadoria, licença maternidade, auxílio-doença etc.), independentemente do vínculo empregatício Proteção social (aposentadoria, licença maternidade, auxílio-doença etc.) para todas: formais, informais e desempregadas Prioridade de acesso ao emprego e às políticas públicas para mulheres trabalhadoras, em especial as mais precarizadas CHEGA DE DUPLA JORNADA! PELA SOCIALIZAÇÃO DO TRABALHO DOMÉSTICO! Creches e escolas públicas, gratuitas e em tempo integral para todas as crianças, como condição para a independência das mulheres Restaurantes populares e lavanderias públicas em todos os bairros Ampliação dos serviços públicos de cuidado (idosos, pessoas com necessidades especiais) retirando das mulheres essa sobrecarga. Redução da jornada de trabalho
    sem redução salarial como medida para enfrentar a dupla jornada e garantir qualidade de vida.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
