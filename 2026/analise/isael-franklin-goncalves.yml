propostas_governo:
- area: Economia e Trabalho
  resumo: 'Propõe um Plano Estadual de Desenvolvimento Justo com economia da floresta em pé e Zona Franca estratégica voltada à inovação, descarbonização e geração de trabalho digno.'
  texto: OBJETIVO Transformar conhecimento em autonomia, serviços melhores e renda distribuída nos territórios. AMAZONAS VIVO, JUSTO E FORTE | PROGRAMA DE GOVERNO 2027–2030 FEDERAÇÃO PSOL -REDE SUSTENTABILIDADE – AMAZONAS 14 EIXO 3 · ECONOMIA Economia da floresta em pé e do trabalho digno O Amazonas precisa superar a falsa escolha entre pobreza com floresta e emprego com destruição. A política econômica estadual apoiará quem produz alimento, conhecimento, cultura, serviços e bens com responsabilidade. A Zona Franca continuará estratégica, mas deverá avançar em inovação, descarbonização, conteúdo local e integração com o interior. COMPROMISSOS E MEDIDAS Elaborar Plano Estadual de Desenvolvimento Justo, com metas de emprego, redução de desigualdades e proteção ambiental.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Educação
  resumo: 'Defende educação pública que dialogue com rios, florestas, línguas e conhecimentos tradicionais, garantindo alfabetização na idade certa, infraestrutura, alimentação e valorização profissional.'
  texto: DIRETRIZ Emergência climática será tratada como questão de saúde pública e desigualdad e, não apenas como evento natural. AMAZONAS VIVO, JUSTO E FORTE | PROGRAMA DE GOVERNO 2027–2030 FEDERAÇÃO PSOL -REDE SUSTENTABILIDADE – AMAZONAS 10 EIXO 2 · EDUCAÇÃO Educação pública para o futuro e para o território A escola deve formar para a vida, o trabalho, a ciência, a cultura e a participação social. No Amazonas, ela também precisa dialogar com rios, flores tas, línguas e conhecimentos tradicionais. O governo enfrentará desigualdades de aprendizagem sem reduzir educação a testes, assegurando infraestrutura, permanência, alimentação, inclusão e valorização profissional. COMPROMISSOS E MEDIDAS Garantir alfabetização na idade certa com apoio pedagógico, bibliotecas, materiais contextualizados e cooperação com municípios.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Saúde
  resumo: 'Propõe saúde que chega a todos os territórios, com rede fluvial, aérea e terrestre, atenção básica forte e resposta às emergências climáticas.'
  texto: 'Nenhuma política funcionará isoladamente: saúde depende de água e transporte; educação depende de conectividade e alimentação; segurança depende de oportunidades; proteção florestal depende de direitos territoriais e renda. Saúde que chega a todos os territórios, com rede fluvial, aérea e terrestre, atenção básica forte e resposta às emergências climáticas. Educação pública que respeita identidades, valoriza profissionais e prepara a juventude para ciência, trabalho, cultura e participação democrática. Economia da floresta em pé, com crédito, assistência técnica, cooperativismo, agregação de valor e repartição justa dos benefícios. Clima e proteção da vida, com adaptação, prevenção de incêndios, defesa dos rios e transição para energia limpa.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Segurança Pública
  resumo: 'Defende segurança pública cidadã e territorial baseada em inteligência, com investigação prioritária de homicídios, feminicídios e crimes contra lideranças, e integração contra o crime organizado.'
  texto: CONSULTA NÃO É AUDIÊNCIA É processo de diálogo antes da decisão, orientado a acordo e consentimento quando juridicamente exigido. AMAZONAS VIVO, JUSTO E FORTE | PROGRAMA DE GOVERNO 2027–2030 FEDERAÇÃO PSOL -REDE SUSTENTABILIDADE – AMAZONAS 27 EIXO 6 · SEGURANÇA Segurança pública cidadã, territorial e baseada em inteligência Segurança é direito de viver sem medo da violência, do crime organizado e do abuso estatal. O governo combinará investigação, inteligência, prevenção social, policiamento orientado por dados, controle da atividade policial e presença pública nos territórios. COMPROMISSOS E MEDIDAS Priorizar investigação de homicídios, feminicídios, desaparecimentos, violência sexual e crime s contra lideranças. Integrar inteligência contra tráfico de armas, drogas, ouro, madeira, pescado e lavagem de dinheiro.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Meio Ambiente
  resumo: 'Propõe cidades limpas com economia circular, encerramento seguro de lixões e reconhecimento de catadoras e catadores, além de consórcios regionais para tratamento adequado de resíduos.'
  texto: SEM EXPULSÃO Intervenção urbana deve melhorar a vida de quem mora no lugar, não abrir espaço para especulação. AMAZONAS VIVO, JUSTO E FORTE | PROGRAMA DE GOVERNO 2027–2030 FEDERAÇÃO PSOL -REDE SUSTENTABILIDADE – AMAZONAS 36 EIXO 8 · RESÍDUOS Cidades limpas, reciclagem e trabalho digno Lixões, queima de resíduos e plástico nos rios ameaçam saúde, clima e biodiversidade. A política estadual apoiará municípios, responsabilizará empresas e reconhecerá catadoras e catadores como agentes centrais da economia circular. COMPROMISSOS E MEDIDAS Apoiar encerramento seguro de lixões com inclusão socioprodutiva dos trabalhadores afetados. Criar consórcios regionais para tratamento, logística e destinação adequada, evitando soluções inviáveis para pequenos municípios.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Infraestrutura e Mobilidade
  resumo: 'Propõe plano estadual de habitação e urbanização de assentamentos precários, com moradia popular, regularização e aluguel social, priorizando mulheres chefes de família, idosos e pessoas com deficiência.'
  texto: AMAZONAS VIVO, JUSTO E FORTE | PROGRAMA DE GOVERNO 2027–2030 FEDERAÇÃO PSOL -REDE SUSTENTABILIDADE – AMAZONAS 35 EIXO 8 · MORADIA Casa segura, urbanização e direito à cidade Moradia não é apenas teto. É localização, água, saneamento, transporte, escola, saúde, energia e segurança climática. O governo enfrentará déficit e inadequação habitacional com urbanização de bairros, produção de moradia popular, regularização responsável e aluguel social. COMPROMISSOS E MEDIDAS Criar plano estadual de habitação com diagnóstico municipal e prioridade para mulhere s chefes de família, idosos e pessoas com deficiência. Urbanizar assentamentos precários com participação dos moradores e sem remoções desnecessárias.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Direitos Humanos
  resumo: 'Propõe metas, orçamento e estruturas de promoção de direitos para mulheres, população negra, LGBTQIA+ e pessoas com deficiência, com orçamento sensível a gênero e raça.'
  texto: DIGNIDADE A assistência social não será usada para controlar votos; terá regras, controle social e atendimento respeitoso. AMAZONAS VIVO, JUSTO E FORTE | PROGRAMA DE GOVERNO 2027–2030 FEDERAÇÃO PSOL -REDE SUSTENTABILIDADE – AMAZONAS 41 EIXO 11 · IGUALDADE Mulheres, população negra, LGBTQIA+ e pessoas com deficiência Desigualdades de gênero, raça, orientação sexual, identidade de gênero e deficiência atravessam todas as políticas. O governo terá metas, orçamento e estruturas de promoção de direitos, combatendo discriminação dentro e fora do Estado. COMPROMISSOS E MEDIDAS Adotar orçamento sensível a gênero e raça, com indicadores e avaliação de impacto. Ampliar autonomia econômica de mulheres com crédito, formação, creches e compras públicas.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Agricultura
  resumo: 'Defende agroecologia, pesca artesanal e soberania alimentar, com apoio à produção familiar e tradicional e criação de um Plano Estadual de Agroecologia e Produção Orgânica.'
  texto: Fortalecer educação integral com projeto pedagógico, cultura, ciência, esporte e alimentação, não apenas ampliação de horário. Garantir alimentação escolar saudável, regional e adquirida da agricultura familiar e de comunidades tradicionais. Combater racismo, violência de gênero, capacitismo e discriminação, promovendo convivência democrática. Criar programa de recuperação das aprendizagens com atenção especial aos anos de transição. PRINCÍPIO Nenhuma tecnologia substituirá professor, comunidade escolar ou vínculo humano; ela dev erá ampliar possibilidades de aprendizagem.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Tecnologia e Inovação
  resumo: 'Propõe ensino técnico integrado às vocações locais e inovação a serviço do povo, com expansão de cursos nos polos regionais e bolsas de permanência para jovens do interior.'
  texto: 'DIREITO A escola deve fortalecer a identidade e a auto nomia das comunidades, nunca funcionar como instrumento de apagamento cultural. AMAZONAS VIVO, JUSTO E FORTE | PROGRAMA DE GOVERNO 2027–2030 FEDERAÇÃO PSOL -REDE SUSTENTABILIDADE – AMAZONAS 13 EIXO 2 · JUVENTUDE E CIÊNCIA Ensino técnico, universidade e inovação a serviço do povo A juventude precisa ter direito de estudar, trabalhar e construir futuro sem abandonar sua região. O ensino técnico será integrado às vocações locais e às necessidades públicas: saúde, saneamento, energia solar, manejo florestal, agroecologia, pesca, tecnologia digital, manutenção naval, turismo de base comunitária e gestão cooperativa. COMPROMISSOS E MEDIDAS Expandir ensino médio integrado e formação técnica nos polos regionais, evitando cursos sem infraestrutura ou perspectiva de trabalho. Criar bolsas de permanência, moradia estudantil e transporte para jovens do interior, indígenas, quilombolas e de baixa renda.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: 'Defende um serviço público profissionalizado, com planejamento, concursos e valorização do servidor, e combate à corrupção em contratos, incentivos, obras e compras.'
  texto: ESCOLHA PÚBLICA É melhor financiar oportunidade, convivência e talento do que pagar depois o custo da exclusão e da violência. AMAZONAS VIVO, JUSTO E FORTE | PROGRAMA DE GOVERNO 2027–2030 FEDERAÇÃO PSOL -REDE SUSTENTABILIDADE – AMAZONAS 44 EIXO 13 · GESTÃO PÚBLICA Estado presente, servidor valorizado e corrupção enfrentada Um governo transformador precisa de serviço público competente, estável e respeitado. A administração será profissionalizada, com planejamento, concursos, formação e diálogo. O combate à corrupção alcançará contratos, incentivos, obras, compras e conflitos de interesse. COMPROMISSOS E MEDIDAS Realizar planejamento da força de trabalho e concursos onde houver déficit permanente.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Política Externa
  resumo: 'Propõe a integração regional amazônica e a cooperação para a proteção da floresta, com desenvolvimento sustentável e soberania sobre os bens comuns.'
  texto: VISÃO A Zona Franca do futuro deve produzir tecnologia para resolver problemas amazônicos e gerar bons empregos. AMAZONAS VIVO, JUSTO E FORTE | PROGRAMA DE GOVERNO 2027–2030 FEDERAÇÃO PSOL -REDE SUSTENTABILIDADE – AMAZONAS 17 EIXO 3 · ALIMENTO E TERRITÓRIO Agroecologia, pesca e soberania alimentar Comida saudável e adequada à cultura local é direito. O governo apoiará roças, quintais, pesca artesanal, manejo comunitário, feiras e cozinhas solidárias. A política agrícola deixará de favorecer apenas grandes operações e passará a reconhecer a diversidade da produção familiar e tradicional. COMPROMISSOS E MEDIDAS Criar Plano Estadual de Agroecologia e Produção Orgânica com participação de movimentos e instituições de pesquisa.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Assistência Social
  resumo: 'Propõe fortalecer a assistência social territorializada e integrada a trabalho, habitação, saúde e segurança alimentar, cofinanciando CRAS, CREAS e equipes volantes nos municípios.'
  texto: FEDERALISMO DE VERDADE Cooperação deve chegar com recurso, equipe e respeito à autonomia local. AMAZONAS VIVO, JUSTO E FORTE | PROGRAMA DE GOVERNO 2027–2030 FEDERAÇÃO PSOL -REDE SUSTENTABILIDADE – AMAZONAS 40 EIXO 11 · PROTEÇÃO SOCIAL Combater fome, pobreza e abandono Nenhuma família deve escolher entre comida, remédio, transporte e energia. A política de assistência social será fortalecida, territorializada e integrada a trabalho, habitação, saúde e segurança alimentar. Benefício é direito, não favor político. COMPROMISSOS E MEDIDAS Cofinanciar CRAS, CREAS, equipes volantes e unidades de acolhimento nos municípios.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
