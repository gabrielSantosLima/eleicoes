propostas_governo:
- area: Economia e Trabalho
  resumo: Propõe industrializar o país processando internamente os minerais estratégicos, em vez de apenas exportá-los, para gerar empregos e receita e reduzir a dependência externa.
  texto: 'O mesmo vale pra riqueza mineral: quem processa o próprio mineral estratégico, e não só extrai e exporta, gera muito mais emprego e receita, e deixa de ficar refém de outro país pra fabricar a própria tecnologia e defesa. E o efeito não para na fábrica: cada posto de trabalho industrial gera empregos indiretos em toda a cadeia — transporte, embalagem, comércio, manutenção — fazendo o dinheiro girar muitas vezes dentro da própria economia brasileira, em vez de sair do país junto com a matéria-prima crua. PRA INDUSTRIALIZAR O BRASIL É AVALANCHE NELES Leonardo Avalanche Plano de Governo — Leonardo Avalanche | Partido Renovador Trabalhista Brasileiro (PRTB) Página 3 Pré-Candidato à Presidência do Brasil em 2026 Candidato à Presidência do Brasil Plano de Governo — Leonardo Avalanche | Partido Renovador Trabalhista Brasileiro (PRTB) Página 1 PLANO DE GOVERNO · PROPOSTA 10 O Brasil do Agro: Fertilizantes e Insumos Nacionais O governo do agro: um plano real pra tirar o produtor rural da
    pior crise financeira das últimas décadas O governo do agro, com olhos pra quem produz — porque o agro é quem move o Brasil, e um plano real pra tirar o produtor rural da pior crise financeira das últimas décadas. O Brasil é celeiro do mundo, mas depende de fertilizante importado pra produzir sua própria comida. Isso encarece tudo — do produtor até o preço no supermercado — e deixa o agronegócio brasileiro vulnerável a qualquer crise internacional.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Educação
  resumo: Propõe modernizar a escola pública com inteligência artificial, educação financeira e empreendedorismo, e oferecer ensino técnico profissionalizante a partir dos 14 anos.
  texto: 'Essa proposta é, antes de tudo, um compromisso com o ensino público: modernizar com tecnologia e empreendedorismo justamente a escola de quem hoje corre atrás dos filhos de escola particular numa corrida desleal, já que o aluno da rede privada costuma ter, há muito mais tempo, contato com idioma, tecnologia e preparo pro mercado. Na prática: uso de inteligência artificial para personalizar o ensino no ritmo de cada aluno, currículo com foco em educação financeira, tecnologia e empreendedorismo desde o ensino fundamental — dentro da escola pública. Preparado pro primeiro emprego, não só pro vestibular: hoje o jovem que estuda em escola pública se forma no ensino médio e não sabe fazer nada na prática — não teve ensino técnico, não teve contato com o mercado, chega aos 18 anos sem nenhuma preparação pra conseguir o primeiro emprego, enquanto o aluno de escola particular geralmente já chega mais preparado. Vamos mudar isso: educação financeira desde cedo, e ensino técnico profissionalizante
    em toda escola pública a partir dos 14-15 anos — Plano de Governo — Leonardo Avalanche | Partido Renovador Trabalhista Brasileiro (PRTB) Página 2 seguindo o modelo já consolidado nos Estados Unidos, onde o Career and Technical Education está integrado ao ensino médio público em quase todo o país, com curso técnico paralelo às disciplinas regulares. E esse preparo não pode mirar só as profissões de hoje: o currículo vai incluir domínio prático de inteligência artificial e das ferramentas que vão definir o mercado de trabalho do futuro, preparando o jovem pra empregos que ainda estão sendo criados, não só pra vagas de um modelo que já está em transformação.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Saúde
  resumo: Tem como meta zerar a fila do SUS, ampliando o acesso a consultas, exames e tratamentos e reduzindo o tempo de espera por atendimento na rede pública.
  texto: 'Comprar o carro fica pela metade do preço. O remédio de uso contínuo, a consulta médica, o tratamento de saúde — tudo cai pela metade. Na prática, isso significa que o mesmo salário que hoje compra uma coisa, amanhã Plano de Governo — Leonardo Avalanche | Partido Renovador Trabalhista Brasileiro (PRTB) Página 2 compra o dobro. Viver no Brasil, com o mesmo dinheiro no bolso, dobra o poder de compra de quem mora aqui. Seu salário líquido vai aumentar: pega o exemplo de quem ganha R$ 10 mil por mês hoje: desconta R$ 988 de INSS e cerca de R$ 1.525 de Imposto de Renda — o trabalhador recebe líquido perto de R$ 7.487, quase R$ 2.500 a menos do que o valor cheio combinado com a empresa.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Segurança Pública
  resumo: Defende tolerância zero contra a violência doméstica e o feminicídio, com proteção à mulher e enfrentamento ao crime, unindo segurança física, emocional e de saúde.
  texto: 'A mulher brasileira sofre violência física. E sofre também a violência da inércia do Estado — na pauta de segurança pública que não protege ela no dia a dia, e na pauta de saúde que não olha pra ela com a atenção que merece. Nosso governo entende que segurança física, emocional e de saúde caminham juntas, e nenhuma dessas frentes pode ficar de fora de um plano de governo sério. Violência doméstica e feminicídio: tolerância zero, sem exceção: o Brasil bateu recorde histórico de feminicídio em 2025: 1.568 mulheres assassinadas por razão de gênero, um aumento de 4,7% em relação ao ano anterior — em média, quase 6 mulheres mortas por dia no país, a maioria pelas mãos de parceiro ou ex-parceiro. Só em 2025, o Judiciário recebeu mais de 1 milhão de novos casos de violência doméstica.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Meio Ambiente
  resumo: Propõe instalar uma rede de drones para vigiar a Amazônia em tempo real, coibindo desmatamento ilegal, garimpo clandestino e exploração estrangeira das riquezas naturais.
  texto: 'Nosso governo não vai mais tolerar isso. Vamos instalar rede de drones de vigilância cobrindo a Amazônia inteira, monitorando em tempo real desmatamento ilegal, garimpo clandestino, contaminação de rio e qualquer exploração estrangeira irregular da nossa água, da nossa madeira e da nossa biodiversidade. A Amazônia é uma das maiores riquezas naturais que o Brasil tem, e esse governo vai ser o primeiro a cuidar dela com a seriedade que ela merece — não deixando mais nenhum hectare ser roubado por falta de vigilância. O que está em jogo: nossas riquezas estratégicas: o Brasil está entre os 10 países com mais riqueza natural do mundo — reservas estimadas em mais de US$ 21 trilhões, segundo levantamento internacional. Toda essa riqueza está, hoje, desprotegida: sem capacidade real de defesa, o Brasil depende de que nenhuma outra nação decida explorar ou avançar sobre o que é nosso, porque não temos como responder a essa ameaça se ela vier.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Infraestrutura e Mobilidade
  resumo: Prevê investimentos pesados em rodovias, hidrovias e ferrovias para escoar a produção e integrar o território, barateando o transporte de mercadorias no país.
  texto: 'É esse espírito de unidade, acima de qualquer divisão, que este plano de governo busca representar: um Brasil que se reconstrói junto, sem deixar ninguém pra trás. Leonardo Alves de Araújo Leonardo Avalanche — Candidato à Presidência do Brasil 2026 Presidente Nacional do PRTB Plano de Governo — Leonardo Avalanche | Partido Renovador Trabalhista Brasileiro (PRTB) Página 1 ÍNDICE Sumário 01 Imposto Único de 3,5% 4 02 iPhone para Todo Brasileiro 7 03 Zerar a Fila do SUS 9 04 Valorização do Motorista de Aplicativo 11 05 Tolerância Zero Contra o Crime 13 06 Educação Moderna com IA e Tecnologia, Voltada para Empreendedorismo 15 07 IPVA de R$ 50 por Mês 18 08 Um Polo Tecnológico de Escala Mundial no Brasil 19 09 Industrializar o Brasil: Produzir Aqui o Que É Nosso 21 10 O Brasil do Agro: Fertilizantes e Insumos Nacionais 24 11 Infraestrutura Pesada: Rodovias, Hidrovias e Ferrovias 26 12 Equipar as Forças Armadas 28 13 Indústria Automobilística Nacional 30 14 Segurança Jurídica para Todos
    32 15 Abraço Azul: Apoio Real à Família Atípica 34 16 Segurança da Mulher 36 17 Tolerância Zero à Exploração Sexual Infantil 39 18 Juventude 42 19 Saneamento Básico e Coleta de Lixo 45 Plano de Governo — Leonardo Avalanche | Partido Renovador Trabalhista Brasileiro (PRTB) Página 1 PLANO DE GOVERNO · PROPOSTA 01 Imposto Único de 3,5% Simplicidade tributária e mais poder de compra pra todo brasileiro Chega dessa avalanche de impostos escondidos. Um imposto único de 3,5% pra tudo — simples, transparente, sem letra miúda. Nossa proposta é reduzir toda essa avalanche de impostos que pesa sobre o brasileiro pra uma alíquota única de 3,5%. Nada de ICMS, ISS, PIS, Cofins, IPI, INSS, Imposto de Renda separados — um imposto só, pra tudo.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Direitos Humanos
  resumo: Reúne as dezenove propostas em um projeto de reconstrução nacional que trata com a mesma seriedade segurança, economia, educação, saúde e a proteção à mulher e à criança.
  texto: 'Este Plano de Governo nasce do reconhecimento da distância entre o potencial brasileiro e a realidade vivida por milhões de famílias. Cada proposta aqui reunida faz parte de um mesmo projeto de reconstrução nacional, que trata com a mesma seriedade a segurança pública, a economia, a educação, a saúde, a proteção à mulher e à criança, a defesa nacional e o meio ambiente. As dezenove propostas reunidas neste documento foram construídas a partir de estudo técnico, de experiência internacional já comprovada e da escuta direta das principais demandas da sociedade brasileira. Cada uma delas representa um compromisso concreto: transformar diagnóstico em ação, e ação em resultado mensurável para o povo brasileiro. Governar o Brasil exige mais do que boa intenção — exige método, disciplina, coragem institucional e, acima de tudo, responsabilidade com o mandato que se pretende exercer.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Agricultura
  resumo: Cria o programa Crédito Raiz, que conecta a renegociação de dívidas do produtor rural à garantia de crédito novo para a próxima safra, quebrando o ciclo de endividamento.
  texto: 'O produtor sai do programa sem dívida, mas continua sendo visto pelo banco como cliente de risco — e sem crédito novo pra plantar a próxima safra, o ciclo de endividamento só se repete. Crédito Raiz: o que muda de verdade em relação ao que já existe: o governo atual tem hoje dois programas separados que não conversam entre si: o Desenrola Rural, que limpa dívida atrasada, e um fundo garantidor do agronegócio, anunciado recentemente, de apenas R$ 2 bilhões — valor incompatível com o tamanho do problema num país que depende tanto da agricultura quanto o Brasil. Só a dívida do campo gaúcho, sozinha, já soma dezenas de bilhões de reais: R$ 2 bilhões pra socorrer o agro do país inteiro é um investimento fraco demais. Hoje, o produtor pode até regularizar a dívida antiga, mas continua dependendo da decisão isolada do banco pra conseguir crédito novo — os dois programas não estão conectados. As três diferenças do Crédito Raiz: primeiro, conexão automática entre regularizar a dívida e
    ter acesso a crédito novo — quem quita ou renegocia a dívida antiga passa a ter direito garantido à nova linha, sem depender só do critério do banco.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Tecnologia e Inovação
  resumo: Propõe transformar o Brasil no maior polo tecnológico do mundo, exportando tecnologia e conhecimento e evitando a fuga de talentos para o exterior.
  texto: Para o caminhoneiro, a isenção total reconhece que ele já paga imposto sobre o combustível, sobre a manutenção e sobre tudo que consome pra manter o transporte do país rodando — cobrar IPVA em cima disso é taxar duas vezes quem já está sustentando a logística nacional. PRO IPVA VIRAR FIXO DE R$ 50 POR MÊS É AVALANCHE NELES Leonardo Avalanche Pré-Candidato à Presidência do Brasil em 2026 Candidato à Presidência do Brasil Plano de Governo — Leonardo Avalanche | Partido Renovador Trabalhista Brasileiro (PRTB) Página 1 PLANO DE GOVERNO · PROPOSTA 08 Um Polo Tecnológico de Escala Mundial no Brasil O profissional e o pesquisador brasileiro não precisam mais ir embora pra ter uma carreira de ponta em tecnologia ou ciência O Brasil vai se tornar o maior polo tecnológico do mundo — um exemplo pra outros países, não mais um exportador de talento pra eles. Será nossa meta prioritária tornar o Brasil, ao longo dos próximos anos, o maior polo tecnológico do mundo. Não um polo que só recebe empresa
    de fora, mas um polo que nasce daqui, que exporta tecnologia e conhecimento brasileiro pro resto do planeta — o Brasil deixando de ser plateia da revolução tecnológica mundial pra se tornar protagonista dela. Mas o que significa, na prática, ser um polo tecnológico mundial?
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: Parte da baixa posição do Brasil em índices de competitividade e percepção de corrupção e propõe segurança jurídica e combate à corrupção para atrair investimentos.
  texto: 'Nesse levantamento, o Brasil aparece entre a 78ª e a 83ª posição — atrás de praticamente toda nação desenvolvida, e mesmo atrás de vários países vizinhos na América Latina. O quadro se repete noutro índice internacional respeitado: no Índice de Percepção da Corrupção, da Transparência Internacional, o Brasil está na 107ª posição entre 182 países, com nota bem abaixo da média mundial. Investimento estrangeiro não entra num país onde a regra pode mudar de uma hora pra outra. Empresário brasileiro segura investimento por insegurança do que vem pela frente. E quem menos tem condição de bancar um processo longo — o trabalhador, o pequeno negócio — acaba desistindo de buscar o que é seu por direito, simplesmente porque não aguenta esperar.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Política Externa
  resumo: Defende uma política externa soberana, com reforço das Forças Armadas para proteger fronteiras e riquezas naturais e reduzir a dependência de terceiros na defesa.
  texto: 'Reequilibrar essa matriz é uma questão de competitividade nacional, não só de infraestrutura setorial. PRA VALORIZAR O CAMINHONEIRO COM IPVA ZERO É AVALANCHE NELES Leonardo Avalanche Pré-Candidato à Presidência do Brasil em 2026 Candidato à Presidência do Brasil Plano de Governo — Leonardo Avalanche | Partido Renovador Trabalhista Brasileiro (PRTB) Página 1 PLANO DE GOVERNO · PROPOSTA 12 Equipar as Forças Armadas Soberania nacional não se terceiriza Soberania não se pede emprestada. Um país só decide o próprio destino quando tem capacidade real de se defender. Enquanto outros países aumentaram o investimento em defesa nos últimos anos, o Brasil fez o oposto: em vez de acompanhar essa tendência, reduziu o orçamento das Forças Armadas em quase 35% em termos reais ao longo dos últimos 14 anos. O resultado é um país cada vez menos preparado pra proteger fronteira, riqueza natural e interesse estratégico próprio — e cada vez mais dependente de terceiros pra garantir que ninguém avance
    sobre o que é nosso.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Assistência Social
  resumo: Propõe garantir renda extra a quem consegue trabalho ou assina carteira sem perder o Bolsa Família, incentivando a inserção no mercado formal.
  texto: 'O critério é um só, e vale igual pra todo mundo: quem se qualifica, recebe. Isso inclui tanto quem está no Bolsa Família (sem perder o benefício) quanto quem nunca recebeu nenhum auxílio do governo. Sem medo de perder o benefício: pra quem está no Bolsa Família, essa é a solução perfeita pra finalmente ter uma renda extra. Hoje, muita gente tem medo de perder o benefício assim que assina carteira ou consegue um trabalho, e por isso acaba nem tentando. Aqui não: a renda extra vem garantida pelo nosso governo, sem perder o Bolsa Família.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
