propostas_governo:
- area: Economia e Trabalho
  resumo: Construir uma economia moderna, sustentável e competitiva, recolocando a indústria como protagonista do crescimento, ampliando a produtividade e gerando empregos qualificados e renda.
  texto: O Brasil precisa de um Estado eficiente, capaz de coordenar investimentos, reduzir riscos e criar oportunidades para que o setor privado produza, invista e inove. Nosso compromisso é construir uma economia moderna, sustentável e competitiva, capaz de recolocar a indústria como protagonista do crescimento, ampliar a produtividade, gerar empregos qualificados e elevar a renda das famílias brasileiras. A nova industrialização será o caminho para um Brasil mais forte, mais inovador e preparado para liderar a economia do século XXI. Indicadores de acompanhamento • Investimento industrial, produtividade e participação da indústria de transformação no PIB. • Complexidade econômica, conteúdo tecnológico e participação de manufaturados nas exportações.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Educação
  resumo: Fazer da educação e da qualificação o principal ativo econômico, alfabetizando na idade certa, expandindo o ensino técnico e conectando escolas, institutos e universidades às necessidades produtivas.
  texto: Plano de Governo 2027 a 2030 · PSD · Caiado e Kassab 15 5. Fazer da educação e da qualificação o principal ativo econômico Alfabetizar na idade certa, recompor aprendizagens, expandir educação técnica, reformar a formação de professores e conectar escolas, institutos e universidades às necessidades produtivas de cada território. Integrar ciência, inovação e empresas Dar estabilidade ao FNDCT, modernizar a Lei do Bem, apoiar plantas-piloto, propriedade intelectual, startups e cooperação universidade -empresa, orientando instrumentos à transformação de conhecimento em produtividade e exportação. Reindustrializar a partir das vantagens brasileiras Articular energia limpa, agro, minerais, saúde, defesa, digitalização e bioeconomia para atrair cadeias produtivas, agregar valor no país e gerar empregos qualificados, sem proteção permanente ou escolha arbitrária de empresas. Abrir mercados e integrar o Brasil ao mundo Ampliar acordos comerciais, reduzir barreiras a insumos e tecnologia,
    fortalecer defesa comercial, atrair investimento produtivo e inserir empresas brasileiras em cadeias globais com maior valor agregado.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Saúde
  resumo: Organizar as filas por prioridade clínica e fortalecer a Atenção Primária, integrando redes de cuidado e dados, modernizando hospitais e valorizando os profissionais de saúde.
  texto: 'Isso significa organizar filas por prioridade clínica; fortalecer a Atenção Primária; estruturar redes para câncer, doenças cardiovasculares, acidente vascular cerebral, saúde m ental, infância, envelhecimento, saúde da mulher, população indígena e paciente crítico; integrar dados; modernizar hospitais; valorizar profissionais; e usar o poder do Estado para fortalecer ciência, produção e soberania sanitária. O SUS que iremos construir MODELO A SUPERAR DIREÇÃO 2027–2030 Reativo Preventivo e preditivo Fila cronológica Prioridade clínica e prazo assistencial Serviços fragmentados Redes integradas de cuidado Prontuários isolados Informação interoperável Hospitalocentrismo Atenção primária forte + rede regionalizada Volume de procedimentos Qualidade, desfecho e valor Tecnologia majoritariamente importada Capacidade nacional de inovar e produzir Gestão processual Gestão por resultados Princípios de execução • Prevenção e antecipação de risco: o sistema deve agir antes da doença e da
    complicação, fortalecendo promoção da saúde, vacinação, rastreamento baseado em evidências, diagnóstico precoce, controle de fatores de risco e acompanhamento ativo das populações mais vulneráveis. • Federalismo cooperativo: a União define padrões nacionais, financia prioridades estratégicas, integra informações e induz qualidade; estados e municípios executam de forma regionalizada, respeitando as necessidades de cada território. • Prioridade clínica e equidade: risco, gravidade, vulnerabilidade, tempo de espera e desigualdades territoriais devem orientar o acesso aos serviços, a regulação e a alocação de investimentos. • Responsabilidade fiscal e valor em saúde: incorporar tecnologias com evidência, negociar preços, estimular contratos baseados em desempenho, medir desfechos, reduzir desperdício'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Segurança Pública
  resumo: Integrar segurança, saúde, educação e assistência para proteger crianças e adolescentes e apoiar famílias de dependentes químicos. Endurecer as regras sobre jogos e apostas on-line, combatendo fraudes e lavagem de dinheiro.
  texto: • Implantar uma política nacional de apoio às famílias de dependentes químicos, articulada à rede de saúde mental, à assistência social e aos programas de prevenção, tratamento e reinserção. • Integrar segurança pública, saúde, educação, assistência social, conselhos tutelares e sistema de Justiça em protocolos de prevenção, identificação, atendimento e investigação, com proteção especial às vítimas de violência sexual, exploração, tráfico humano, recrutamento pelo crime e agressões no ambiente digital. • A proteção de crianças e adolescentes será tratada como prioridade absoluta, com integração entre segurança pública, educação, saúde, assistência social, sistema de Justiça e conselhos tutelares. • Nos casos de estupro de vulnerável menor de 13 anos cometido por adulto, propor o agravamento das penas, com pena mínima de 30 anos, progressão somente após o cumprimento de 90% da pena e confisco (perdimento) total dos bens do condenado, destinados à vítima, na forma da lei. Enfrentar
    os jogos e as apostas on-line como ameaça econômica, social e de saúde pública • Regulamentar e endurecer as regras, com máximo rigor, dos jogos e das apostas on-line, atividade inexistente no país até 2018 e hoje associada à lavagem de dinheiro, uso de contas de terceiros, manipulação de identidades, fraudes, evasão fiscal e riscos à integridade esportiva, com proibição da publicidade em veículos de comunicação de massa e em redes sociais.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Meio Ambiente
  resumo: Converter a sustentabilidade em vantagem comercial, com Cadastro Ambiental Rural validado, rastreabilidade da propriedade ao consumidor, pagamento por serviços ambientais e certificação de créditos de carbono.
  texto: Fortalecer o melhoramento genético vegetal e animal, com cultivares adaptadas às mudanças climáticas e resistentes a estresses hídricos, térmicos e fitossanitários, e apoiar a pesquisa em microbioma e aditivos que elevem a eficiência da pecuária e reduzam as emissões de metano entérico, organizando os centros de excelência em polos regionais segundo as vocações produtivas de cada região. Converter sustentabilidade em vantagem comercial Concluir a validação do Cadastro Ambiental Rural e implantar um sistema nacional de rastreabilidade da propriedade ao consumidor. Desenvolver o Selo Brasil Sustentável, ampliar o pagamento por serviços ambientais e estruturar certificação brasileira confiável para créditos de carbono. Reforçar a governança, a defesa sanitária e a inteligência de mercado Estruturar coordenação central da política agrícola, com mandato transversal e articulação permanente entre agricultura, energia, comércio exterior, meio ambiente e indústria. Fortalecer os sistemas
    federal e estaduais de defesa sanitária, integrar a rastreabilidade animal e vegetal e criar um observatório nacional de dados produtivos.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Infraestrutura e Mobilidade
  resumo: Ampliar as concessões e parcerias público-privadas em rodovias, ferrovias, portos, aeroportos, saneamento e energia, com calendário previsível de leilões e financiamento de longo prazo.
  texto: Um Estado que mobiliza capital 9. Ampliação das concessões e parcerias público-privadas Manter um calendário permanente e previsível de leilões (dando continuidade ao Programa de Parcerias em Investimentos, o PPI) em rodovias, ferrovias, portos, aeroportos, saneamento, energia e infraestrutura social, como hospitais, escolas e iluminação públ ica. Atacar o gargalo real da agenda, que é a capacidade de estruturar bons projetos, apoiando tecnicamente estados e municípios a desenvolver suas próprias parcerias, e usar a concessão de ativos públicos maduros para financiar a infraestrutura nova. Asse gurar que as outorgas geradas pelas concessões sejam reinvestidas no próprio setor, reduzindo gargalos e ampliando a eficiência, em vez de dispersar-se no orçamento geral. Financiamento de longo prazo, nacional e estrangeiro Aprofundar os instrumentos de financiamento privado que o país construiu na última década, os títulos incentivados, os fundos de infraestrutura e os demais veículos de
    mercado de capitais, com o BNDES atuando prioritariamente como estruturador de projetos e catalisador de capital privado.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Direitos Humanos
  resumo: Tornar a prioridade absoluta de crianças e adolescentes critério de orçamento, gestão e avaliação, com políticas de autonomia e igualdade para mulheres, pessoas negras, idosos, pessoas com deficiência, indígenas e quilombolas.
  texto: A prioridade absoluta de cr ianças e adolescentes deixará de ser apenas uma declaração constitucional para se tornar critério de orçamento, gestão e avaliação. Mulheres, pessoas negras, idosos, pessoas com deficiência, povos indígenas, comunidades quilombolas e famílias em território s vulneráveis terão políticas que reconheçam barreiras concretas e produzam autonomia, segurança e igualdade de oportunidades. Plano de Governo 2027 a 2030 · PSD · Caiado e Kassab 3 O Brasil voltará a produzir, transformar e inovar. Não aceitaremos continuar exportando minério, grão e conhecimento bruto para importar máquinas, tecnologia e empregos qualificados. O agronegócio, a indústria, a mineração responsável, a energia, a infraestrutura e a ciência serão articulados em uma estratégia nacional de desenvolvimento.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Agricultura
  resumo: Expandir assistência técnica, cooperativismo, regularização fundiária, seguro e irrigação eficiente, fortalecendo a agricultura familiar, a agroindústria e a economia do mar.
  texto: Atrair infraestrutura digital com energia limpa, eficiênci a hídrica, proteção de dados e formação local, evitando enclaves que consumam recursos sem gerar capacidade regional. Agroindústria, agricultura familiar e economia do mar Expandir assistência técnica, cooperativismo, regularização fundiária, seguro, irrigação eficiente, armazenagem e processamento local. Fortalecer fruticultura, grãos, pecuária, apicultura, aquicultura, pesca sustentável e bioeconomia da Caatinga e do litor al, conectando pequenos produtores a compras públicas, indústria, exportação e segurança alimentar. Educação e formação ligadas às vocações do território Priorizar alfabetização, recomposição de aprendizagem, tempo integral e ensino médio com educação profissional. Pactuar com institutos federais, Sistema S, universidades e empresas cursos voltados a energia, tecnologia, ciência da computação + IA, engenharia de software e de computação, logística, saúde, turismo, agroindústria, indústria digital e manutenção.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Tecnologia e Inovação
  resumo: Dar previsibilidade ao financiamento da ciência e modernizar os incentivos à inovação, aproximando pesquisadores e empresas, com conectividade significativa, infraestrutura computacional e cibersegurança.
  texto: 'COMPROMISSO: consolidar o Brasil como potência de alimentos, energia e sustentabilidade, gerando renda no campo, segurança alimentar no país e liderança nos mercados mundiais. Plano de Governo 2027 a 2030 · PSD · Caiado e Kassab 25 TEMA 8 · CIÊNCIA, TECNOLOGIA E INOVAÇÃO Sumário executivo Ciência, tecnologia, inovação e transformação digital serão bases do desenvolvimento, da produtividade e da soberania. O Brasil tem universidades, institutos, empresas e instrumentos relevantes, mas ainda opera com instabilidade, fragmentação e baixa conve rsão de conhecimento em produtos, empresas e empregos. O plano dará previsibilidade ao financiamento, modernizará os incentivos à inovação, aproximará pesquisadores e empresas e organizará missões nacionais em tecnologias críticas. A agenda digital combinará capacidade e regras: conectividade significativa, infraestrutura computacional, dados de qualidade, energia limpa, talentos, cibersegurança e governança coordenada.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: Construir um governo de ordem democrática, responsabilidade e diálogo, implementando desde o primeiro dia o que cabe ao Executivo e encaminhando ao Congresso, com transparência, o que depende de lei.
  texto: O que estiver sob responsabi lidade direta do Executivo começará a ser implementado desde o primeiro dia. O que depender do Congresso será encaminhado com transparência, estimativa de impacto e disposição para o diálogo. O Brasil precisa voltar a confiar em si mesmo. Vamos construir um governo de ordem democrática, segurança, responsabilidade, trabalho e progresso. Um governo que não confunda firmeza com intolerância, nem diálogo com omissão.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Política Externa
  resumo: Integrar a política externa à estratégia de desenvolvimento, com a rede diplomática próxima do setor produtivo e relações simultâneas com todos os polos, sem alinhamento automático nem viés ideológico.
  texto: As prioridades transcenderão ciclos políticos e Plano de Governo 2027 a 2030 · PSD · Caiado e Kassab 73 eleitorais, preservando a tradição profissional da diplomacia brasileira e evitando que a atuação internacional do país seja capturada pela polarização interna. Diplomacia a serviço do desenvolvimento e da competitividade Integrar a política externa à estratégia nacional de desenvolvimento, com articulação permanente entre o Itamaraty e as políticas econômica, industrial, tecnológica, de infraestrutura, energia, agricultura, educação e segurança. A rede diplomática atuará d e forma ainda mais próxima do setor produtivo, identificando oportunidades, removendo barreiras e apoiando a internacionalização das empresas brasileiras. Relações simultâneas com todos os polos, sem alinhamento automático Fortalecer simultaneamente as relações com os Estados Unidos, a União Europeia, a América Latina, a África, a Ásia e o Oriente Médio, sem hierarquias ou preferências determinadas por afinidades
    ideológicas. Não adotaremos alinhamentos automáticos nem aceitaremos falsas escolhas entre polos geopolíticos rivais.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Assistência Social
  resumo: Organizar a proteção social para acolher quem enfrenta pobreza, fome, violência, deficiência ou perda de renda, integrando a transferência de renda a educação, saúde, moradia, qualificação e trabalho.
  texto: 'COMPROMISSO: nenhuma mulher estará sozinha diante da violência; o Estado protegerá sua vida, seus filhos, seu patrimônio, sua saúde e seu direito de construir autonomia. Plano de Governo 2027 a 2030 · PSD · Caiado e Kassab 61 TEMA 20 · POLÍTICA E PROTEÇÃO SOCIAL Sumário executivo A proteção social será organizada para acolher quem enfrenta pobreza, fome, violência, deficiência, velhice desassistida ou perda de renda e, ao mesmo tempo, construir caminhos de autonomia. Transferência de renda continuará sendo direito de quem precisa, mas será integrada a educação, saúde, moradia, cuidado, qualificação, crédito, documentação e trabalho. O objetivo é romper ciclos de pobreza, não administrar vulnerabilidade indefinidamente. Crianças e adolescentes serão prioridade absoluta na prática: orçamento identificado, metas, integração de dados e serviços, prevenção de violências e acompanhamento desde a gestação até a transição para o trabalho.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
