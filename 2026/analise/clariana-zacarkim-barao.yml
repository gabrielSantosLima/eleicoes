- area: Direitos Humanos
  resumo: Coloca a proteção de mulheres e crianças como eixo transversal do plano, com uma rede nacional de enfrentamento à violência e garantia de direitos integrada às demais áreas.
  texto: Página 2 Arquitetura do plano O plano organiza a ação pública em seis capítulos integrados. O primeiro - proteção de mulheres e crianças - funciona como eixo transversal. Os demais tratam dos meios necessários para produzir autonomia, oportunidade, liberdade, saúde e capacidade de entrega. Mulheres e crianças em primeiro lugar 1.1 Rede nacional de proteção e resposta à violência Objetivo. Transformar o eixo em uma agenda executável, com responsabilidades claras, coordenação federativa e acompanhamento público.
