  texto: 'Transformar o eixo em uma agenda executável, com responsabilidades claras, coordenação federativa e acompanhamento público. • Policiamento baseado em evidências • Integração de informações e mapas de risco • Proteção específica a mulheres, escolas e áreas vulneráveis Indicadores sugeridos: homicídios; roubos; violência contra mulheres; tempo de resposta; percepção de segurança. 4.5 Sistema prisional e redução da reincidência Página 10 Objetivo. Transformar o eixo em uma agenda executável, com responsabilidades claras, coordenação federativa e acompanhamento público. • Separação e gestão de lideranças criminosas conforme a lei • Trabalho, educação e qualificação • Inteligência penitenciária e controle de comunicações ilícitas Indicadores sugeridos: reincidência; presos em educação/trabalho; incidentes; apreensões e comunicações ilícitas detectadas.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
