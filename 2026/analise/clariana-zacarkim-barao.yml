- area: Economia e Trabalho
  resumo: Propõe ampliar a participação das mulheres no trabalho, com qualificação e reinserção profissional, crédito para empreendedorismo e uma rede de cuidado que viabilize emprego e renda.
  texto: 'Transformar o eixo em uma agenda executável, com responsabilidades claras, coordenação federativa e acompanhamento público. • Qualificação e reinserção profissional • Empreendedorismo e acesso a crédito responsável • Rede de cuidado para ampliar participação no trabalho Indicadores sugeridos: taxa de participação feminina; formalização; renda média; sobrevivência de negócios liderados por mulheres. 1.4 Proteção de crianças e adolescentes Objetivo. Transformar o eixo em uma agenda executável, com responsabilidades claras, coordenação federativa e acompanhamento público. • Prevenção de abuso e exploração • Ambiente digital seguro e educação para riscos • Busca ativa de crianças fora da escola Indicadores sugeridos: notificações com resposta concluída; evasão escolar; tempo de resposta a denúncias; cobertura de programas preventivos.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
