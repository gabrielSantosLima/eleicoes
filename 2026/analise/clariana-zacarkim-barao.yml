  texto: 'Transformar o eixo em uma agenda executável, com responsabilidades claras, coordenação federativa e acompanhamento público. • Vacinação e rastreamento baseado em evidências • Saúde da mulher e da criança • Promoção de alimentação, sono e hábitos saudáveis Indicadores sugeridos: cobertura vacinal; rastreamento adequado; mortalidade materna/infantil; fatores de risco populacionais. 5.3 Inovação e terapias com avaliação científica Objetivo. Transformar o eixo em uma agenda executável, com responsabilidades claras, coordenação federativa e acompanhamento público. • Via transparente de avaliação de novas tecnologias • Pesquisa clínica e produção nacional • Incorporação ao SUS baseada em segurança, eficácia e custo-efetividade Indicadores sugeridos: tempo de avaliação; estudos nacionais; tecnologias avaliadas; desfechos e custo por benefício.'
