propostas_governo:
- area: Economia e Trabalho
  resumo: Propõe criar a Escola do Empreendedor, aproveitando escolas, universidades, institutos e centros comunitários para ensinar milhões de brasileiros a criar trabalho, renda e empresas.
  texto: 'Queremos transformar patrimônio em segurança, e segurança em liberdade para empreender. ESCOLA DO EMPREENDEDOR O Brasil precisa ensinar milhões de pessoas não apenas a procurar emprego, mas também a criar trabalho, renda e empresas. Será criada a Escola do Empreendedor, com presença nas comunidades participantes do programa. Não construiremos milhares de prédios desnecessariamente. Utilizaremos estruturas existentes: escolas públicas no período noturno e nos finais de semana, universidades, institutos federais, centros comunitários e instituições parceiras.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Educação
  resumo: Prevé um programa nacional de inclusão e combate à evasão, ao bullying e à exclusão nas redes públicas, com formação continuada de professores, protocolos de inclusão e indicadores de bem-estar dos estudantes.
  texto: 'Os dados serão anonimizados e utilizados para planejamento, nunca para discriminar estudantes. META NACIONAL O programa deverá alcançar progressivamente todas as redes públicas de educação básica, estabelecer formação continuada de professores, criar protocolos de inclusão em cada escola e desenvolver indicadores objetivos de redução de evasão, bullying e exclusão, além de acompanhar aprendizagem, participação e bem -estar dos estudantes. A avaliação do projeto não perguntará apenas quantos alunos passaram de ano, mas também: quantos passaram a participar? Quantos deixaram de sofrer silenciosamente? Quantos descobriram habilidades que a escola tradicional jamais enxergaria?'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Saúde
  resumo: Propõe o programa Tele Saúde Brasil para ampliar a telemedicina e desafogar o SUS, além de ações de prevenção e detecção precoce do câncer e do plano de combate mundial à fome.
  texto: '146 PROJETO 12 - PLANO DE COMBATE MUNDIAL DA FOME .............................. 157 PROJETO 13 - TELE SAÚDE BRASIL: TRANSFORMAR O BRASIL NA MAIOR TELE MEDICINA DO MUNDO, DESAFOGANDO O SUS .......................................... 161 PROJETO 14 - PREVENÇÃO E DETECÇÃO PRECOCE DO CÂNCER: SOCIEDADE ESTÁ ABRAÇANDO (SEA) ........................................................................... 166 PROJETO 15 - ENERGIAS RENOVÁVEIS DO BRASIL: PENER-BR ..................... 175 PROJETO 16 - PETRA BR: TERRAS RARAS E MINERAIS ESTRATÉGICOS DO BRASIL ................................................................................................................'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Segurança Pública
  resumo: Propõe o Programa Mulheres Vivas, integrando tecnologia, forças de segurança, apoio psicológico e assistência jurídica às vítimas, além de fortalecer o policiamento comunitário e as Guardas Municipais.
  texto: Implantaremos o Programa Mulheres Vivas, integrando tecnologia, forças de segurança, atendimento psicológico, assistência jurídica e proteção social para oferecer respostas rápidas às vítimas e prevenir novos casos de violência. O programa também fortalecerá o policiamento comunitário e a atuação das Guardas Municipais, com estratégias de acompanhamento preventivo e visitas comunitárias às residências de mulheres em situação de risco, além de promover maior integração com os Juizados Especializados de Violência Doméstica e Familiar contra a Mulher, garantindo atuação coordenada entre segurança pública e Poder Judiciário. b) Resposta rápida às emergências Utilizaremos monitoramento inteligente, aplicativos de emergência (botão do pânico ou de alerta com geolocalização), centrais integradas e protocolos de resposta imediata para proteger mulheres em situação de risco. O tempo de resposta das autoridades poderá significar a diferença entre a vida e a morte. 54 c) Autonomia econômica
    feminina A independência financeira é uma das maiores formas de proteção social.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Meio Ambiente
  resumo: Defende protagonismo do Brasil nas negociações globais de clima, tratando a Amazônia e a biodiversidade como ativos estratégicos e conciliando conservação com desenvolvimento sustentável.
  texto: O objetivo é aumentar exportações, atrair investimentos e fortalecer a competitividade da economia brasileira. d) Diplomacia climática e ambiental O Brasil terá papel central nas negociações globais sobre clima e meio ambiente, defendendo um modelo de desenvolvimento sustentável que reconheça a importância da Amazônia e da biodiversidade como ativos estratégicos do país. 60 e) Cooperação Sul-Sul e multilateralismo Fortaleceremos a cooperação com países em desenvolvimento, promovendo parcerias em tecnologia, energia, educação e infraestrutura, além de defender o multilateralismo como base da ordem internacional. f) Proteção de interesses estratégicos nacionais A política externa brasileira será guiada pela defesa da soberania, da segurança econômica e dos interesses estratégicos do país, com atuação firme em temas como comércio internacional, energia, tecnologia e recursos naturais , com diálogo e sem manifestações agressivas, sem sentido estratégico, que possam aumentar o custo
    de vida dos brasileiros. REFORMA POLÍTICA E INSTITUCIONAL a) Implantação do semipresidencialismo Propomos a adoção de um modelo semipresidencialista, no qual o Presidente da República compartilha a condução do governo com um Primeiro-Ministro escolhido a partir da maioria parlamentar.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Infraestrutura e Mobilidade
  resumo: Prevé infraestrutura básica para as cidades amazônicas, com saneamento, energia limpa e conectividade digital, além de crédito e capacitação para ribeirinhos e pequenos empreendedores.
  texto: 'Portanto, proteger a floresta exige proteger as pessoas. 8.1 DESENVOLVIMENTO DOS RIBEIRINHOS • Criação de microempresas locais: • Bioeconomia (açaí, castanha, óleos naturais) • Pesca sustentável • Artesanato e turismo ecológico • Capacitação técnica e empreendedora 8.2 DESENVOLVIMENTO DAS CIDADES AMAZÔNICAS • Programas de infraestrutura básica: • Saneamento 184 • Energia limpa • Conectividade digital • Criação de polos econômicos sustentáveis 8.3 BANCO EMPREENDEDOR AMAZÔNICO Linha de crédito acessível para pequenos empreendedores, cooperativas, negócios sustentáveis e microcrédito com orientação técnica. 8.4 GERAÇÃO DE RENDA COMO PROTEÇÃO AMBIENTAL • Transformar a população local em guardiã da floresta. • Incentivar economicamente a preservação. 8.5 META SOCIAL E AMBIENTAL • Resgatar milhões de brasileiros de condições sub-humanas.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Direitos Humanos
  resumo: Defende programas educacionais de cultura de paz e igualdade de oportunidades e propõe educação financeira e igualdade na concessão de crédito para mulheres.
  texto: Desenvolveremos programas educacionais que promovam respeito mútuo, cultura de paz, resolução pacífica de conflitos, igualdade de oportunidades e valorização da dignidade humana, contribuindo para uma sociedade mais justa e segura. h) Igualdade na Concessão de Crédito para Mulheres O Banco Central, com a contribuição da Febraban, da FGV , do Sebrae e da Skema Business School, realizou um levantamento de dados sobre o panorama da cidadania financeira no Brasil, apresentando conclusões alarmantes sobre as diferenças nas taxas de juros praticadas para homens e mulheres. O dado levantado é relevante, mas chama atenção a pouca visibilidade dada ao tema e, sobretudo, a ausência de propostas concretas para enfrentar um problema estrutural que pode estar presente nas matrizes de risco utilizadas pelas instituições financeiras para definir as taxas de juros aplicadas aos contratos de financiamento bancário. O relatório concluiu que, “considerando o montante total de crédito utilizado em
    2024 nas duas populações (homens e mulheres), para uma mesma raça, as mulheres contratam créditos mais caros do que os homens” . Vamos investir em políticas públicas voltadas à educação financeira específicas para o público feminino, ampliando ações relevantes do Sebrae e articulando iniciativas em diferentes níveis de atuação do poder público.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Agricultura
  resumo: Destaca a agricultura familiar e a fruticultura como áreas estratégicas e propõe ampliar a competitividade e as exportações do setor, valorizando os estabelecimentos familiares.
  texto: 'Ou seja: não é uma periferia do Brasil; é uma fronteira nacional de segurança hídrica, alimentar, social e exportadora. Também vale confirmar o número da agricultura familiar: o dado mais sólido continua sendo cerca de 3,9 milhões de estabelecimentos, equivalentes a 77% das unidades agropecuárias do país. Eles ocupam cerca de 23% da área agrícola e concentram a maior parte dos postos de trabalho no campo. Na fruticultura, o contraste internacional realmente chama atenção. O Brasil exportou em 2024 pouco mais de US$ 1,287 bilhão em frutas, enquanto o Peru fechou 2024 com algo acima de US$ 7,6 bilhões em frutas e hortaliças, chegando a mais de US$ 8,2 bilhões em algumas consolidações de escopo semelhante.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Tecnologia e Inovação
  resumo: Propõe tornar o Brasil produtor de inovação, com investimento em ciência e tecnologia e uma estratégia nacional de inteligência artificial tratada como infraestrutura estratégica de Estado.
  texto: e) Participação cívica e protagonismo juvenil Incentivaremos a participação dos jovens na vida pública, em conselhos, projetos sociais, iniciativas comunitárias e espaços de decisão, fortalecendo o sentimento de pertencimento e responsabilidade com o futuro do país. CIÊNCIA, TECNOLOGIA E INTELIGÊNCIA ARTIFICIAL a) Brasil como potência científica e tecnológica O Brasil precisa deixar de ser apenas consumidor de tecnologia e se tornar produtor de inovação. Ampliaremos significativamente os investimentos em ciência, pesquisa e desenvolvimento, com foco em áreas estratégicas como biotecnologia, energia, saúde, defesa e inteligência artificial. b) Estratégia nacional de inteligência artificial 58 A inteligência artificial será tratada como infraestrutura estratégica de Estado. Criaremos uma política nacional para desenvolvimento, regulação e aplicação da IA em serviços públicos, educação, saúde, segurança e gestão governamental, garantindo soberania tecnológica e competitividade global.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: Propõe o programa Sociedade Está de Olho para ampliar o controle social e usar inteligência artificial no cruzamento de dados e na fiscalização de gastos públicos e licitações.
  texto: Também incentivaremos programas permanentes de conservação do solo e dos recursos hídricos, bem como a recuperação produtiva de áreas degradadas, promovendo maior sustentabilidade, produtividade e resiliência da agropecuária brasileira. COMBATE À CORRUPÇÃO E TRANSPARÊNCIA a) Programa SEO — Sociedade Está de Olho Implantaremos uma ampla rede nacional de controle social denominada Sociedade Está de Olho (SEO), envolvendo cidadãos, universidades, entidades da sociedade civil, órgãos de controle e tecnologias inteligentes para acompanhar a aplicação dos recursos públicos. A transparência deixará de ser apenas um princípio legal para tornar-se um instrumento permanente de participação da sociedade. b) Inteligência Artificial no controle dos gastos públicos Utilizaremos sistemas avançados de Inteligência Artificial para cruzar milhões de informações, identificar sobrepreços, pagamentos indevidos, fraudes em licitações, conflitos de interesse e outras irregularidades. Quanto mais tecnologia
    houver na fiscalização, menor será o espaço para a corrupção.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Política Externa
  resumo: Defende recuperar a credibilidade internacional do Brasil com uma diplomacia de Estado, ativa, equilibrada e pragmática, baseada no diálogo e na defesa dos interesses nacionais.
  texto: Programas de inclusão digital, capacitação tecnológica e acesso universal a ferramentas digitais serão ampliados em todo o território nacional. RELAÇÕES INTERNACIONAIS E DIPLOMACIA ESTRATÉGICA É necessário enfrentar a perda de credibilidade internacional decorrente da apropriação da diplomacia por sucessivos governos . É necessário recuperar a 59 credibilidade e devolver a serenidade e a capacidade de diálogo que sempre foi um traço marcante da política externa brasileira. A diplomacia deve ser tratada como política de Estado e não de governo. a) Brasil como potência diplomática global O Brasil adotará uma política externa ativa, equilibrada e pragmática, baseada no diálogo, na cooperação internacional e na defesa dos interesses nacionais.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Assistência Social
  resumo: Compromete-se com a proteção social de crianças em extrema pobreza, idosos frágeis e pessoas sem condições de competir economicamente, equilibrando liberdade econômica e dignidade humana.
  texto: Ao mesmo tempo, nenhuma sociedade madura abandona completamente seus vulneráveis. Crianças em extrema pobreza, idosos frágeis e pessoas incapazes de competir economicamente precisam de proteção social. O valor de uma civilização não pode ser medido apenas pelo tamanho do PIB. Deve ser medido também pela forma como trata os mais frágeis. 27 O grande desafio d o país será equilibrar liberdade econômica, eficiência estatal e dignidade humana.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
