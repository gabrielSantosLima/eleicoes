propostas_governo:
- area: Economia e Trabalho
  resumo: Destravar o empreendedorismo com a RedeSim e a Lei de Liberdade Econômica, qualificar trabalhadores com formação técnica e cursos profissionalizantes e atrair investimentos para gerar emprego.
  texto: Garantir que toda escola do interior funcione Assegurar professor em sala, merenda, transporte escolar seguro e as condições essenciais para o aprendizado. Transformar o ensino médio em porta de entrada para o trabalho Oferecer cursos técnicos e profissionalizantes gratuitos, conectados às oportunidades reais de emprego no Amazonas. Ensinar melhor, incluir todos e respeitar culturas Priorizar a alfabetização na idade certa, reconhecer escolas e profissionais que entreguem resultados, ampliar o atendimento a estudantes com deficiência e autismo e fortalecer a educação escolar indígena. Destravar quem quer empreender Integrar todos municípios do Amazonas à RedeSim, ampliar a aplicação da Lei de Liberdade Econômica, simplificar o licenciamento de atividades de baixo risco e reduzir prazos com digitalização e análise simultânea dos processos. 3 Melhorar a qualificação dos amazonenses para o mercado de trabalho Integrar CETAM, Sistema S, universidades, SUFRAMA, empresas e organizações
    parceiras para oferecer formação técnica, bolsas em profissões com falta de trabalhadores, primeiro emprego, idiomas e competências digitais.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Educação
  resumo: Transformar o ensino médio em porta de entrada para o trabalho, garantir o funcionamento das escolas do interior e priorizar a alfabetização na idade certa, a inclusão e a educação indígena.
  texto: Transformar o ensino médio em porta de entrada para o trabalho Oferecer cursos técnicos e profissionalizantes gratuitos, conectados às oportunidades reais de emprego no Amazonas. Ensinar melhor, incluir todos e respeitar culturas Priorizar a alfabetização na idade certa, reconhecer escolas e profissionais que entreguem resultados, ampliar o atendimento a estudantes com deficiência e autismo e fortalecer a educação escolar indígena. Destravar quem quer empreender Integrar todos municípios do Amazonas à RedeSim, ampliar a aplicação da Lei de Liberdade Econômica, simplificar o licenciamento de atividades de baixo risco e reduzir prazos com digitalização e análise simultânea dos processos. 3 Melhorar a qualificação dos amazonenses para o mercado de trabalho Integrar CETAM, Sistema S, universidades, SUFRAMA, empresas e organizações parceiras para oferecer formação técnica, bolsas em profissões com falta de trabalhadores, primeiro emprego, idiomas e competências digitais. Atrair investimentos
    e levar produtos a novos mercados Fortalecer a porta de entrada para investidores e exportadores, ampliar a inteligência comercial, estruturar corredores regionais e captar recursos nacionais e internacionais para projetos estratégicos do Amazonas.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Saúde
  resumo: Fortalecer a saúde da mulher, reduzindo o tempo entre diagnóstico e tratamento do câncer de colo do útero, e ampliar a saúde indígena com atendimento intercultural e logística de medicamentos.
  texto: Cuidar da Saúde da Mulher Amazonense Fortalecer o cuidado integral à mulher no Amazonas, reduzindo o tempo entre diagnóstico e tratamento de doenças graves como o câncer de colo do útero. 8 Fortalecer a saúde indígena Formar profissionais para atendimento intercultural e organizar a logística de medicamentos e transporte, respeitando a língua e a cultura de cada povo. Fazer o dinheiro público render mais Vincular recursos à entrega de resultados concretos, encerrar fundos e programas que não funcionem, revisar gastos correntes e ampliar a transparência sobre contas públicas. Reduzir o peso do Estado sobre quem produz Buscar o equilíbrio fiscal sem a necessidade de aumentar impostos, preparar o Amazonas para a reforma tributária, simplificar os serviços da SEFAZ e ampliar a regularização fiscal com tratamento diferenciado para quem paga em dia. Garantir as aposentadorias com responsabilidade Planejar e regularizar o financiamento da previdência de servidores e militares, auditar
    benefícios e folha de pagamento e evitar que desequilíbrios sejam transferidos às próximas gerações.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Segurança Pública
  resumo: Combater o crime organizado nas fronteiras e presídios, com base fluvial no Alto Rio Negro, valorizar os profissionais da segurança e reforçar a proteção à mulher em todo o estado.
  texto: Combater o crime organizado nas fronteiras e nos presídios Instalar uma base fluvial permanente no Alto Rio Negro e solicitar a transferência de lideranças de facções para unidades do Sistema Penitenciário Federal. Valorizar os profissionais da segurança pública Melhorar as condições de trabalho, formação continuada e o suporte aos policiais que atuam na capital e no interior. 7 Reforçar a Proteção à Mulher em todo o Amazonas Garantir presença policial especializada e resposta ágil às mulheres em situação de violência em todos os municípios do estado, capital e interior. Prevenir a violência nos bairros mais vulneráveis Integrar policiamento comunitário e ações de oportunidade para jovens em risco nos territórios com maior concentração de homicídio e violência doméstica, com apoio de tecnologia de monitoramento para identificar quem já comete crime e evitar reincidência. Levar atenção à saúde básica a todo o interior Ampliar as equipes de saúde fluvial e ribeirinha e a telessaúde,
    priorizando os municípios ainda sem cobertura e requalificar as estruturas já existentes.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Meio Ambiente
  resumo: Modernizar o licenciamento ambiental, impulsionar o mercado de carbono e combater o desmatamento com satélites e dados, conciliando produção sustentável e proteção do território.
  texto: Produzir mais e melhor Ampliar a assistência técnica à produção rural, pesqueira e aquícola, aproximar pesquisa e produtores, fortalecer cooperativas e melhorar o escoamento e o acesso aos mercados, respeitando as vocações de cada região. 9 Proteger quem produz Integrar a regularização fundiária, ambiental e sanitária, ampliar o georreferenciamento, facilitar o crédito e combater grilagem, fraudes, sobreposições e títulos irregulares, protegendo o produtor de boa-fé. Modernizar o licenciamento ambiental para destravar o Amazonas Adequar os procedimentos do estado à nova Lei Geral do Licenciamento Ambiental, com prazos definidos, matriz de risco por porte e potencial poluidor e ritos simplificados para as atividades de menor impacto, destravando setores estratégicos como a mineração legal e fortalecendo a fiscalização da recuperação de áreas degradadas. Agregar valor à produção da floresta Impulsionar o mercado de carbono, apoiar patentes, rastreabilidade e certificações e atrair
    empresas para processar matérias-primas amazônicas no próprio estado, gerando renda, novos postos de trabalho e novos mercados. Combater o desmatamento e proteger o território Usar satélites, drones e análise de dados contra desmatamento e queimadas para estruturar a proteção da fauna e revisar unidades de conservação e zoneamento para que funcionem de fato.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Infraestrutura e Mobilidade
  resumo: Conectar o interior com fibra e satélite, manter os rios navegáveis com dragagem e sinalização, melhorar as estradas e defender a conclusão da BR-319, reduzindo o tempo e o custo dos deslocamentos.
  texto: Plano de Governo 2 Cuidar desde os primeiros anos de vida Apoiar os municípios na ampliação da oferta de vagas em creches e pré-escolas e na orientação às famílias sobre saúde, alimentação e desenvolvimento infantil. Garantir que toda escola do interior funcione Assegurar professor em sala, merenda, transporte escolar seguro e as condições essenciais para o aprendizado. Transformar o ensino médio em porta de entrada para o trabalho Oferecer cursos técnicos e profissionalizantes gratuitos, conectados às oportunidades reais de emprego no Amazonas. Ensinar melhor, incluir todos e respeitar culturas Priorizar a alfabetização na idade certa, reconhecer escolas e profissionais que entreguem resultados, ampliar o atendimento a estudantes com deficiência e autismo e fortalecer a educação escolar indígena. Destravar quem quer empreender Integrar todos municípios do Amazonas à RedeSim, ampliar a aplicação da Lei de Liberdade Econômica, simplificar o licenciamento de atividades de baixo risco
    e reduzir prazos com digitalização e análise simultânea dos processos.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Direitos Humanos
  resumo: Garantir moradia digna com aluguel social temporário e regularização de imóveis, elevar o Auxílio Estadual Permanente e proteger mulheres, crianças, idosos, pessoas com deficiência e povos indígenas.
  texto: 5 Garantir moradia digna e promover a regularização das propriedades Focalizar a construção e o financiamento de moradias populares em áreas com infraestrutura e próximas da oferta de trabalho, oferecer aluguel social temporário e acelerar a regularização de imóveis em ocupações consolidadas. Proteger quem mais precisa Elevar o Auxílio Estadual Permanente para R$ 300,00, fortalecer a proteção de mulheres, crianças, idosos, pessoas com deficiência, povos indígenas e comunidades tradicionais. Conectar o interior e manter os rios navegáveis Trabalhar com a União na dragagem e sinalização dos grandes rios, conservar os trechos estaduais, melhorar as estradas e defender a conclusão da BR-319, reduzindo o tempo e o custo dos deslocamentos. Levar saneamento digno a todo amazonense Ampliar o acesso à água tratada e a coleta e tratamento de esgoto, trabalhar para encerrar os lixões, promover consórcios regionais, e avançar com a logística reversa e a reciclagem. Levar o Governo do Amazonas
    aos 62 municípios Expandir a conectividade por fibra e satélite e construir subsedes em São Gabriel da Cachoeira, Tefé, Tabatinga, Humaitá, Itacoatiara e Eirunepé, com balcões de atendimento nos demais municípios.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
