- area: Assistência Social
  resumo: Compromete-se com a proteção integral da dignidade humana, a manutenção do Bolsa Família, o respeito aos povos indígenas e tradicionais e a ampliação de oportunidades para populações vulneráveis.
  texto: 'Essa diversidade constitui uma riqueza nacional e deve ser protegida e valorizada. Nosso compromisso é garantir: • Proteção integral à vida e à dignidade da pessoa humana, mantendo o Programa Bolsa Família; • Respeito aos direitos constitucionais dos povos indígenas, comunidades quilombolas e povos tradicionais; • Ampliação das oportunidades de educação, qualificação profissional e geração de renda para populações vulneráveis; • Promoção da acessibilidade e inclusão das pessoas com deficiência; • Combate à pobreza por meio da emancipação econômica e não da dependência permanente; • Presença efetiva do Estado onde ele é mais necessário, especialmente nas regiões historicamente menos assistidas. A verdadeira justiça social não consiste em criar dependência, mas em garantir que cada cidadão tenha condições reais de prosperar com liberdade, dignidade e autonomia. RESPONSABILIDADE FISCAL RESPONSABILIDADE FISCAL. COMPROMISSO COM AS FUTURAS GERAÇÕES Não existe prosperidade duradoura sem
    responsabilidade fiscal.'
