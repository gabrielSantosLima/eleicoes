  texto: CAPACIDADE PARA PROSPERAR DIREITOS E GARANTIAS. COMPROMISSO COM A VIDA COMPROMISSO COM A DIGNIDADE, A CIDADANIA E OS DIREITOS CONSTITUCIONAIS. O desenvolvimento econômico somente é legítimo quando alcança todos os brasileiros. O Governo terá como princípio inegociável a proteção dos direitos e garantias fundamentais previstos na Constituição Federal, assegurando igualdade perante a lei, respeito à dignidade humana e ampliação das oportunidades para todos os cidadãos. O Brasil é uma nação diversa, formada por diferentes povos, culturas, tradições e realidades regionais.
