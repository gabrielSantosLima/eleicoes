propostas_governo:
- area: Economia e Trabalho
  resumo: O plano prevê ampliar renda e transformar ocupações precárias em oportunidades, coordenando CETAM, UEA, Sine e programas de formação para qualificação, primeiro emprego e requalificação profissional, com acompanhamento dos resultados no mercado.
  texto: 'Internação será utilizada quando clinicamente indicada, com continuidade do cuidado após a alta e atenção específica a crianças, adolescentes, pessoas em crise e situações de risco de suicídio. EIXO 14 EMPREGO, RENDA, EMPREENDEDORISMO E DESENVOLVIMENTO ECONÔMICO PROGRAMA 23 - TRABALHO, RENDA E EMPREENDEDORISMO O desafio do Amazonas não é apenas reduzir desemprego; é aumentar renda e transformar ocupações precárias em oportunidades produtivas. Qualificação, intermediação de mão de obra, primeiro emprego e requalificação profissional serão planejados de acordo com as cadeias que realmente contratam em cada região. CETAM, UEA, Sine e programas de formação deverão atuar de forma coordenada. Cursos serão acompanhados também pelo que acontece depois: quantos alunos conseguiram trabalho, quanto tempo demoraram e em que setores.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Educação
  resumo: A rede trabalhará com metas de IDEB, diagnóstico por escola, recomposição da aprendizagem e formação continuada de professores, além de criar o programa CNH Jovem Amazonas para custear a primeira habilitação de concluintes do Ensino Médio.
  texto: O Ideb será um dos indicadores utilizados, ao lado de outros dados de permanência, fluxo, aprendizagem e conclusão. A rede trabalhará com metas estaduais e regionais, diagnóstico por escola, reforço e recomposição de aprendizagem, formação continuada de professores, prevenção da evasão, fortalecimento do Ensino Médio e transparência dos resultados. As escolas com maior dificuldade deverão receber apoio prioritário, com acompanhamento frequente e plano de melhoria adequado à sua realidade. PROGRAMA 3 - CNH JOVEM AMAZONAS O Estado instituirá, por lei específica e com planejamento orçamentário, programa para custear a primeira Carteira Nacional de Habilitação de jovens residentes no Amazonas que concluírem o Ensino Médio. A iniciativa manterá todas as exigências nacionais de habilitação, como idade, aptidão, formação, exames e provas.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Saúde
  resumo: Será estruturada uma política permanente de saúde do servidor em rede, com um HSPA Central em Manaus, polos regionais, telemedicina e rede complementar contratada dentro da lei, atendendo ativos, aposentados e pensionistas.
  texto: 'Um atendimento mais amplo dependerá de fonte orçamentária própria e juridicamente disponível. EIXO 2 SAÚDE DO SERVIDOR E FORTALECIMENTO DA CAPACIDADE PÚBLICA PROGRAMA 4 - HSPA - HOSPITAL DO SERVIDOR PÚBLICO DO AMAZONAS O HSPA será o eixo de uma política permanente de assistência à saúde do servidor. Como referência para a formulação da proposta, dados oficiais divulgados pelo Governo do Amazonas em 3 de novembro de 2025 indicavam mais de 120 mil pessoas entre servidores ativos, aposentados e pensionistas, sendo 79.283 servidores ativos. A proposta não se resume a construir um hospital em Manaus. O desenho é de rede: um HSPA Central na capital, polos regionais onde houver demanda, centros integrados por instrumentos jurídicos adequados, unidades satélites para consultas, prevenção, exames, regulação, reabilitação e telemedicina e, quando necessário, uma rede complementar contratada dentro da lei.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Segurança Pública
  resumo: Está prevista a recomposição plurianual dos efetivos das polícias Militar, Civil e Penal e do Corpo de Bombeiros, com concursos conforme a necessidade e capacidade financeira, além de formação, inteligência, tecnologia e equipamentos.
  texto: Não será confundido com dívida bancária vencida nem usado de forma alarmista. EIXO 4 SEGURANÇA PÚBLICA PROGRAMA 8 - RECOMPOSIÇÃO DOS EFETIVOS A Polícia Militar, a Polícia Civil, o Corpo de Bombeiros Militar e a Polícia Penal terão planejamento plurianual de recomposição de efetivos. Serão observados o direito subjetivo à nomeação quando existente, a utilização juridicamente possível de concursos vigentes e a realização de novos concursos conforme necessidade e capacidade financeira. O dimensionamento de pessoal levará em conta município, região, fronteira e vulnerabilidade operacional. Formação, inteligência, tecnologia, equipamentos, infraestrutura e meios de atuação fluvial também farão parte dessa recomposição; aumentar o número de profissionais sem melhorar a capacidade de trabalho não resolve o problema de segurança do Amazonas.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Meio Ambiente
  resumo: O plano adota visão integrada de proteção ambiental e resiliência climática junto às demais políticas, organizada em doze polos regionais, e prevê que programas com benefícios individualizáveis observem as restrições da legislação eleitoral.
  texto: 'Programas que envolvam concessão, distribuição ou subsídio individualizável de bens, valores ou benefícios observarão também as restrições da legislação eleitoral, especialmente nos anos de eleição. VISÃO INTEGRADA Os doze polos deste Plano servirão de referência para aproximar políticas de Governo: PACs, esporte, educação, segurança, proteção ambiental, HSPA, saúde regionalizada, emprego e qualificação, empreendedorismo, cultura e turismo, infraestrutura e logística, habitação e saneamento, proteção social, povos indígenas e comunidades tradicionais e resiliência climática. Isso não significa obrigar todas as secretarias a usar exatamente o mesmo polo ou a mesma infraestrutura. Quando estudo técnico demonstrar solução melhor, a política setorial poderá adotar outra organização territorial. A regionalização é um instrumento para reduzir distância e coordenar o Estado, não uma camisa de força burocrática.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Infraestrutura e Mobilidade
  resumo: A infraestrutura será planejada de forma multimodal, combinando rios, portos, embarcações, aeroportos, rodovias, vicinais, pontes e conectividade, com prioridades definidas por população, produção, acesso a serviços e vulnerabilidade climática.
  texto: 'A estratégia será usar essa experiência como referência de escala, sem copiar o mesmo modelo, e desenvolver outros destinos e calendários nos doze polos ao longo do ano. EIXO 16 INFRAESTRUTURA, LOGÍSTICA, HABITAÇÃO E SANEAMENTO PROGRAMA 27 - AMAZONAS LOGÍSTICA INTEGRADA No Amazonas, infraestrutura não pode ser pensada apenas como rodovia. O planejamento estadual será multimodal: rios, portos e terminais, embarcações, aeroportos e aeródromos regionais, rodovias, vicinais, pontes e conectividade precisam ser combinados conforme a realidade de cada região. As prioridades serão definidas considerando população, produção, acesso a saúde e educação, turismo, segurança e vulnerabilidade climática. Obras de competência federal ou municipal serão buscadas por cooperação, convênios e articulação.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Direitos Humanos
  resumo: Nas comunidades indígenas, do campo, das águas e das florestas, a política garantirá alimentação, permanência escolar e expansão do ensino, respeitando especificidades educacionais, culturais e territoriais, com diálogo e consulta quando exigido.
  texto: Alimentação, permanência escolar, recomposição da aprendizagem, prevenção da evasão e uso complementar do Centro de Mídias farão parte do desenho da política. Nas comunidades indígenas, do campo, das águas e das florestas, a expansão respeitará as especificidades educacionais, culturais e territoriais, com diálogo e consulta sempre que o ordenamento jurídico exigir. PROGRAMA 2 - META IDEB AMAZONAS Melhorar a aprendizagem exige olhar para cada escola e não apenas para a média estadual. O Ideb será um dos indicadores utilizados, ao lado de outros dados de permanência, fluxo, aprendizagem e conclusão. A rede trabalhará com metas estaduais e regionais, diagnóstico por escola, reforço e recomposição de aprendizagem, formação continuada de professores, prevenção da evasão, fortalecimento do Ensino Médio e transparência dos resultados.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Agricultura
  resumo: O programa Agro Forte apoia agricultura familiar, pesca, piscicultura, agroextrativismo, pecuária e bioeconomia, com fomento para produzir, agregar valor e vender mais, com critérios públicos e respeito às regras ambientais, sanitárias e fundiárias.
  texto: 5 O que ficará para o Amazonas depois que a dívida estiver paga? EIXO 12 AGRO FORTE - O AMAZONAS TAMBÉM É AGRO PROGRAMA 20 - AGRO FORTE O setor primário amazonense reúne agricultura familiar, pesca, piscicultura, agroextrativismo, pecuária, manejo sustentável, bioeconomia, agroindústria e turismo rural. O AGRO FORTE parte da diversidade regional para organizar uma política que ajude o produtor a produzir, beneficiar e vender mais, sem tratar preservação e desenvolvimento como objetivos incompatíveis. PRODUZIR MAIS, AGREGAR VALOR E GERAR RENDA COM BAIXO IMPACTO AMBIENTAL. Os instrumentos de fomento terão critérios públicos e impessoais, transparência, previsão orçamentária e respeito às regras ambientais, sanitárias, fundiárias, eleitorais e de contratação pública.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Tecnologia e Inovação
  resumo: O Estado tratará Manaus como centro industrial, tecnológico e logístico, aproximando o Polo Industrial de fornecedores locais, universidades, centros de pesquisa e startups e incentivando inovação, digitalização e novos negócios com o interior.
  texto: MANAUS INDUSTRIAL, TECNOLÓGICA E EMPREENDEDORA Manaus será tratada como centro industrial, tecnológico e logístico estratégico para todo o Estado. O Governo buscará ampliar a competitividade do ambiente produtivo, aproximar empresas do Polo Industrial de fornecedores locais, universidades, centros de pesquisa, startups e formação profissional e incentivar inovação, digitalização e novos negócios que também criem encadeamentos econômicos com o interior. EIXO 15 CULTURA, ECONOMIA CRIATIVA E TURISMO PROGRAMA 25 - CULTURA VIVA AMAZONAS A cultura será tratada como direito, identidade e trabalho. O Amazonas já possui uma produção cultural reconhecida; o desafio é garantir formação, circulação, equipamentos, financiamento e mercado para que artistas e produtores consigam transformar talento em atividade sustentável. A política deverá alcançar música, boi-bumbá, artes cênicas, dança, literatura, audiovisual, artesanato, patrimônio, gastronomia, design, moda e produção digital, sem concentrar
    oportunidades apenas em Manaus ou nos grandes eventos.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: A gestão pública priorizará planejamento, governança, transparência e avaliação permanente das políticas, com responsabilidade fiscal, critérios impessoais e combate à corrupção na aplicação dos recursos estaduais.
  texto: O Ideb será um dos indicadores utilizados, ao lado de outros dados de permanência, fluxo, aprendizagem e conclusão. A rede trabalhará com metas estaduais e regionais, diagnóstico por escola, reforço e recomposição de aprendizagem, formação continuada de professores, prevenção da evasão, fortalecimento do Ensino Médio e transparência dos resultados. As escolas com maior dificuldade deverão receber apoio prioritário, com acompanhamento frequente e plano de melhoria adequado à sua realidade. PROGRAMA 3 - CNH JOVEM AMAZONAS O Estado instituirá, por lei específica e com planejamento orçamentário, programa para custear a primeira Carteira Nacional de Habilitação de jovens residentes no Amazonas que concluírem o Ensino Médio. A iniciativa manterá todas as exigências nacionais de habilitação, como idade, aptidão, formação, exames e provas.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Assistência Social
  resumo: A assistência social será conectada a documentação, segurança alimentar, qualificação, emprego, moradia e demais serviços, com porta de saída para a autonomia, e enfrentará a violência contra a mulher no interior via estruturas regionais e cooperação.
  texto: Intervenções em igarapés deverão integrar habitação, saneamento, mobilidade, recuperação ambiental e prevenção de novas ocupações de risco. EIXO 17 PROTEÇÃO SOCIAL E INCLUSÃO PROGRAMA 29 - PROTEÇÃO SOCIAL COM PORTA DE SAÍDA A assistência social protegerá quem precisa, mas também será conectada a documentação, segurança alimentar, qualificação, emprego, empreendedorismo, moradia e acesso aos demais serviços. Para famílias que têm condições de alcançar autonomia econômica, o Estado deve ajudar a construir esse caminho em vez de manter políticas isoladas que não conversam entre si. PROGRAMA 30 - MULHER PROTEGIDA E INDEPENDENTE O enfrentamento à violência contra a mulher será combinado com acolhimento, orientação, articulação da rede de proteção e autonomia econômica. No interior, a política utilizará estruturas regionais, atendimento remoto quando adequado e cooperação com municípios, segurança pública, Justiça e demais instituições competentes.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
