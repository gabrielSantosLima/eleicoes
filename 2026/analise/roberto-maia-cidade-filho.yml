propostas_governo:
- area: Economia e Trabalho
  resumo: O compromisso é aproveitar de forma sustentável o gás natural e os minerais estratégicos, como o potássio de Autazes e as terras raras de Apuí, agregando valor, reduzindo custos para a indústria e gerando emprego e renda.
  texto: É desenvolvimento que se paga preservando — e que traz recurso de fora para dentro do Amazonas. COMPROMISSO 35 O DESAFIO O Amazonas possui grandes reservas de gás natural e minerais estratégicos, mas precisa transformar esse potencial em desenvolvimento, atraindo investimentos, agregando valor à produção, reduzindo custos para a indústria e gerando emprego e renda, sempre com responsabilidade ambiental. NOSSO COMPROMISSO Promover o aproveitamento sustentável do gás natural e dos recursos minerais, como potássio, em Autazes, e as terras raras, em Apuí, por exemplo, fortalecendo as matrizes econômicas do Amazonas, estimulando novas cadeias produtivas, a geração de energia, a industrialização, a inovação e o desenvolvimento regional, com respeito ao meio ambiente e às comunidades. O QUE VAI MUDAR Mais investimentos e novas oportunidades de negócios, com empregos e geração de renda. Energia mais competitiva para impulsionar a indústria.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Educação
  resumo: O plano prevê modernizar as escolas com conectividade, laboratórios e recursos tecnológicos, incluindo educação financeira e ensino de idiomas, com financiamento pelo Fundeb, receitas constitucionais e emendas parlamentares.
  texto: O DESAFIO A educação precisa acompanhar IA, robótica, programação e idiomas. NOSSO COMPROMISSO Modernizar escolas com conectividade, laboratórios, tecnologia, educação financeira e ensino de idiomas. O QUE VAI MUDAR Escolas conectadas. O futuro começa dentro da sala de aula. COMO VAMOS PAGAR ESSA CONTA A modernização se apoia em fontes vinculadas à educação (Fundeb e receitas constitucionais), no Tesouro Estadual, em programas federais de conectividade e tecnologia nas escolas e em emendas parlamentares para laboratórios.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Saúde
  resumo: A saúde prevê a implantação de um hospital universitário integrado a ensino, pesquisa e assistência, viabilizado pelo Novo PAC, Ministério da Saúde, Tesouro Estadual, crédito para infraestrutura e emendas parlamentares.
  texto: COMO VAMOS PAGAR ESSA CONTA Saúde é prioridade e tem parceiro certo. A obra será viabilizada pelo Novo PAC, pelo Ministério da Saúde e pelo SUS, com apoio do Tesouro Estadual, operações de crédito para infraestrutura hospitalar e emendas parlamentares. COMPROMISSO 12 Salvar vidas, formar profissionais e produzir conhecimento. O DESAFIO O Estado precisa ampliar atendimento especializado e formação prática. NOSSO COMPROMISSO Implantar hospital universitário integrado a ensino, pesquisa, inovação e assistência.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Segurança Pública
  resumo: A segurança atuará contra a receptação, desmontando o incentivo econômico do roubo com tecnologia e integração de dados, e criará o programa Jovem Longe do Crime como alternativa ao recrutamento criminoso.
  texto: 'Cada aparelho devolvido enfraquece o crime. COMO VAMOS PAGAR ESSA CONTA O programa é de baixo custo e alto impacto: usa tecnologia e integração de dados da própria polícia, financiadas pelo Tesouro Estadual e pelo Fundo Nacional de Segurança Pública. Atacar a receptação desmonta o incentivo econômico do roubo — segurança que se paga atacando a raiz do crime. COMPROMISSO 08 COMPROMISSO 09 JOVEM LONGE DO CRIME A melhor arma contra o crime é a oportunidade. O DESAFIO Jovens vulneráveis precisam de alternativas reais ao recrutamento criminoso.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Meio Ambiente
  resumo: A preservação ambiental contará com captação de recursos nacionais e internacionais, fortalecimento do Fundo Estadual de Meio Ambiente, pagamento por serviços ambientais e parcerias para adaptação climática.
  texto: O maior aliado da preservação é o povo que conhece, protege e vive da floresta. COMO VAMOS PAGAR ESSA CONTA Ampliação da captação de recursos nacionais e internacionais destinados à preservação ambiental e ao enfrentamento das mudanças climáticas. Fortalecimento do Fundo Estadual de Meio Ambiente e dos mecanismos de pagamento por serviços ambientais. Parcerias com o Governo Federal, organismos multilaterais, setor privado e instituições de pesquisa para financiar projetos de adaptação climática e desenvolvimento sustentável. COMPROMISSO 42 amazonas COMPROMISSO 43 EM OBRAS O maior programa de infraestrutura municipal da história do Estado.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Infraestrutura e Mobilidade
  resumo: O plano prevê construir dois complexos prisionais regionais em áreas estratégicas do interior, reduzindo o uso de delegacias como cadeias improvisadas e descentralizando o cumprimento de penas.
  texto: Cada jovem afastado do crime economiza ao Estado um custo futuro enorme em segurança e justiça. COMPROMISSO 09 O DESAFIO O Amazonas enfrenta um grave déficit de infraestrutura prisional no interior. Sem unidades adequadas para o cumprimento de penas, as delegacias acabam funcionando como cadeias improvisadas, comprometendo a segurança, favorecendo fugas, dificultando a ressocialização e desviando policiais da atividade de policiamento para exercer funções de carcereiros. Essa realidade enfraquece o combate à criminalidade e sobrecarrega os municípios. NOSSO COMPROMISSO Construir dois complexos prisionais regionais em áreas estratégicas do interior do Amazonas, ampliando a capacidade do sistema prisional e descentralizando o cumprimento de penas.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Direitos Humanos
  resumo: O plano apresenta uma visão de governo voltada às pessoas, valorizando idosos, povos indígenas, ribeirinhos, agricultores e trabalhadores, sob o Projeto Amazonas 2035 e a ideia de governar para transformar vidas.
  texto: Grande na sabedoria dos nossos idosos. Grande na força dos nossos povos indígenas, ribeirinhos, agricultores, pescadores, empreendedores, professores, profissionais da saúde, servidores públicos e trabalhadores que fazem este Estado acontecer todos os dias. É por essas pessoas que vale a pena governar. O AMAZONAS DO FUTURO JÁ COMEÇOU • PROJETO AMAZONAS 2035 APRESENTAÇÃO Porque governar nunca foi apenas construir estradas, levantar hospitais ou entregar obras. Governar é transformar a vida das pessoas.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Agricultura
  resumo: Para enfrentar a insegurança alimentar, o plano prevê expandir restaurantes populares, cozinhas comunitárias, bancos de alimentos e compras da agricultura familiar nos 62 municípios do estado.
  texto: O DESAFIO A insegurança alimentar ainda faz parte da rotina de muitas famílias. NOSSO COMPROMISSO Expandir restaurantes populares, cozinhas comunitárias, bancos de alimentos e compras da agricultura familiar para os 62 municípios. O QUE VAI MUDAR Alimentação mais acessível para as famílias Bancos de alimentos fortalecidos. Mais compras da agricultura familiar. Combate à fome e ao desperdício.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Tecnologia e Inovação
  resumo: O programa Muralha Digital do Amazonas ampliará câmeras inteligentes, leitura de placas, drones e análise de imagens integradas às polícias, aproveitando o efetivo e a estrutura existentes para ganhar eficiência com baixo custo.
  texto: Boa parte usa o efetivo e a estrutura que já existem — o ganho vem da integração e da presença permanente, não só de nova despesa. COMPROMISSO 01 COMPROMISSO 02 MURALHA DIGITAL DO AMAZONAS Tecnologia protegendo vidas. O DESAFIO O crime utiliza tecnologia; o Estado precisa responder com inteligência. NOSSO COMPROMISSO Expandir câmeras inteligentes, leitura de placas, drones, análise de imagens e integração policial. O QUE VAI MUDAR Mais inteligência.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: O plano se apresenta como um conjunto de compromissos com metas, resultados, responsabilidade fiscal e transparência, defendendo crescer preservando, desenvolver incluindo e modernizar sem perder a identidade.
  texto: 'E para isso que este plano existe: não para fazer promessas, mas para assumir compromissos. Compromissos com metas, resultados, responsabilidade, transparência e, acima de tudo, com as pessoas. Acreditamos que é possível crescer preservando, desenvolver incluindo, modernizar sem perder nossa identidade e gerar riqueza sem deixar ninguém para trás. Ele será construído pelas mãos de milhões de amazonenses. E essa construção começa agora.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Assistência Social
  resumo: A proteção social terá fonte própria no orçamento e reajuste gradual dentro da capacidade fiscal, com destaque para o Compromisso 25, de cuidado a quem cuida de pessoas com deficiência ou TEA.
  texto: COMO VAMOS PAGAR ESSA CONTA Proteção social tem fonte própria e prioridade no orçamento. A ampliação será sustentada pelo Tesouro Estadual e por fundos estaduais de combate à pobreza e de assistência social, com o pagamento acompanhando o crescimento da arrecadação do Estado. O reajuste será implantado de forma gradual e responsável, dentro da capacidade fiscal, para que o benefício seja permanente — e não uma promessa de um só ano. COMPROMISSO 25 Mais cuidado para quem dedica a vida a cuidar. O DESAFIO Mães, pais e responsáveis reorganizam suas vidas para cuidar de pessoas com deficiência ou TEA, muitas vezes deixando o mercado de trabalho.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
