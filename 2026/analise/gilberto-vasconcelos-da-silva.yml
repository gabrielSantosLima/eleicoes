propostas_governo:
- area: Economia e Trabalho
  resumo: 'Defende o aumento de 100% do salário mínimo rumo ao mínimo necessário, a revogação da Reforma Trabalhista e o fim da terceirização, com salário igual para trabalho igual e geração de empregos por obras públicas.'
  texto: 'Basta de feminicídio e violência contra as mulheres! 19 • Proteção real para as mulheres: delegacias especializadas 24h, casas-abrigo e rede de atendimento conforme a demanda, com recursos garantidos pelo Estado e sob controle das trabalhadoras e da população; • Punição efetiva aos agressores, com garantia de proteção às vítimas; • Campanhas massivas de combate à violência nas escolas, locais de trabalho e meios de comunicação; • Organização de comissões de mulheres nos locais de trabalho, estudo e moradia para prevenir e enfrentar a violência; • Emprego, renda e moradia como condição concreta para romper ciclos de violência; • Combate às ideologias misóginas e responsabilização das plataformas que lucram com a disseminação do ódio contra as mulheres. • Por emprego, salário digno e direitos para as mulheres! • Salário igual para trabalho igual; • Combate à desigualdade salarial e à superexploração das mulheres, especialmente das mulheres negras; • Garantia de direitos para todas
    as trabalhadoras (aposentadoria, licença maternidade, auxílio- doença, etc.), independentemente do vínculo empregatício; • Proteção social (aposentadoria, licença maternidade, auxílio-doença, etc.) para todas: formais, informais e desempregadas; LGBTIs No capitalismo, a sexualidade é moldada pela necessidade da reprodução da força de trabalho e da família tradicional. O gênero é aprisionado nesse modelo dominante de organização da sexualidade e da família , em que o desconforto entre o sexo/fenótipo biológico e o gênero social é taxado como doença e pessoas trans e não-binárias são tratadas como pessoas de segunda categoria, desumanizadas.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Educação
  resumo: 'Propõe auditoria na Secretaria de Educação e ampliação do investimento público, com formação integral, valorização dos professores e fortalecimento da educação indígena, ribeirinha e neurodiversa.'
  texto: No Amazonas, essa realidade assume características próprias, pois a precarização educacional5 se articula com a condição histórica de dependência da região e com um modelo de desenvolvimento que não transforma a riqueza produzida na Amazônia em direitos sociais para sua população. Enfrentar a crise do ensino médio exige uma política estadual comprometida com a formação integral da juventude, com escolas estruturadas, valorização dos professores, fortalecimento da educação indígena, ribeirinha e neurodiversa, ampliação da educação científica, técnica e cultural, garantindo que os jovens se tornem sujeitos críticos capazes de vislumbrar um novo projeto de sociedade, e não apenas força de trabalho submetida às necessidades do mercado. • Realizar auditória na Secretaria de Educação • Ampliação do investimento público estadual. 5 “O Amazonas aparece entre os estados com pior desempenho do país em duas áreas diretamente ligadas à atuação do governo estadual. O Ranking de Competitividade
    dos Estados 2025 coloca o Amazonas na 24ª posição em Educação e aparece na última colocação nacional em Infraestrutura, no 27ª lugar” (Cf.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Saúde
  resumo: 'Defende a universalização do SUS no Amazonas, enfrentando a concentração de atendimento na capital e ampliando a rede de média e alta complexidade, profissionais especializados e serviços no interior.'
  texto: 'É resultado de um modelo que subordina tudo aos interesses do capital. Saúde A crise do SUS expressa diretamente esse conflito: garantir saúde pública universal implica enfrentar os mecanismos que drenam recursos e subordinam o sistema à lógica privada. No Amazonas a universalização do atendimento à saúde é ainda muito mais comple xa. A grande extensão territorial, a fragmentação populacional, as precárias condições de infraestrutura na maioria dos seus municípios e a concentração de atendimento de média e alta complexidade na Capital impõe um imenso desafio ao poder público. Por is so se tem superlotação em hospitais, concentração de atendimento na Capital, falta de profissionais especializados e hospitais no interior e indicadores de saúde frágeis.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Segurança Pública
  resumo: 'Propõe a descriminalização das drogas e a revogação da Lei de Drogas, com prevenção, tratamento e redução de danos, além de combate à violência policial e controle social das polícias.'
  texto: EMBRAPA, 2023 16 • Implementar políticas estaduais de tratamento e atenção integral à saúde, com ampliação da rede pública de tratamento para dependência química (CAPS AD, equipes territoriais, acolhimento) • Apoiar a luta pela descriminalização das drogas e revogação da Lei de Drogas, para efetivamente combater e acabar com o narcotráfico, juntamente com políticas públicas de prevenção, tratamento e redução de danos. Enfrentamento à violência armada e proteção das comunidades • Estimular a população a se auto-organizar para garantir sua própria segurança, seja diante do crime organizado e da criminalidade em geral, seja diante da violência do Estado através de suas polícias. • Criar mecanismos independentes de investigação de violência policial, com participação social e transparência • Punição a todos os envolvidos em crimes de ódio. Agravamento nos casos em que estes crimes forem praticados por agentes de estados • Punição exemplar para tortura, execuções, desaparecimentos forçados,
    chacinas e demais crimes praticados por agentes do Estado, responsabilizando também seus comandantes militares e civis. • Combater o tâfico e seus braços armados, as milicias e os grupos paramilitares • Fortalecer políticas de proteção a testemunhas e lideranças comunitárias ameaçadas Democratização e controle social da segurança pública • Regulamentar e garantir instâncias de participação popular no controle das polícias – conselhos populares com poder deliberativo.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Meio Ambiente
  resumo: 'Defende o uso sustentável da biodiversidade e o combate à exploração predatória dos recursos naturais, subordinando a riqueza amazônica aos interesses sociais e à preservação ambiental.'
  texto: • Fortalecer a luta pelo aumento de 100% no salário mínimo, rumo ao salário mínimo necessário, calculado pelo DIEESE • Bolsa equivalente a um salário mínimo para trabalhadores desempregados enquanto não houver pleno emprego. • Apoiar Plano nacional de obras públicas voltado à geração de empregos, universalização do saneamento básico, construção de escolas, hospitais, creches, infra estrutura ambiental, entre outras obras necessárias e respeitadoras do meio ambiente. • Fortalecer a luta pela revogação da Reforma Trabalhista. • Apoiar a luta pela revogação da lei das terceirizações. Fim da terceirização, salário igual para trabalho igual e direitos para todos os trabalhadores.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Infraestrutura e Mobilidade
  resumo: 'Propõe uma política de infraestrutura voltada às necessidades sociais e ambientais, com saneamento, obras públicas e mobilidade, rejeitando grandes empreendimentos predatórios na Amazônia.'
  texto: '• Acabar com as cooperativas – todos os cargos devem ser supridos por concursos públicos; • Eleições diretas para diretores de Unidades de Saúde e hospitais • Controle social, a partir das organizações dos trabalhadores e segmentos profissionais de profissionais de saúde Pessoas com Deficiências (PCD) A situação das pessoas com deficiência no Brasil — e de forma ainda mais acentuada no Amazonas — evidencia uma contradição central: embora exista um arcabouço legal relativamente amplo, os direitos permanecem parcialmente efetivados e desigualmente distrib uídos no território 4. No Amazonas, em particular, fatores como grandes distâncias, concentração de serviços em Manaus e limitações de infraestrutura aprofundam essa realidade, fazendo com que o acesso à educação, saúde, mobilidade e trabalho seja restrito, sobretudo para quem vive no interior e nas perif erias urbanas. Assim, a deficiência não pode ser compreendida isoladamente, mas como parte de um quadro mais amplo de desigualdade
    social e territorial. 3 A título de exemplo: “Entre os anos de 2019 e 2022 foram realizados os pagamentos dos contratos da Parceria Público-Privada (PPP) com investimento total de R$ 407,2 milhões para o Hospital Delphina Aziz e da Central de Material Esterilizado (CME)” . Mensagem Governamental – Relatório de Atividades, 2023) 4 O marco legal dos direitos das pessoas com deficiência no Brasil compreende a Constituição Federal de 1988, a Convenção sobre os Direitos das Pessoas com Deficiência (com status constitucional) e a Lei Brasileira de Inclusão da Pessoa com Deficiência (Lei nº 13.146/2015), complementadas pela Lei nº 8.213/1991 e pela Lei Orgânica da Assistência Social (Lei nº 8.742/1993).'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Direitos Humanos
  resumo: 'Defende igualdade salarial e proteção social para as mulheres, combate à LGBTIfobia e garantia de direitos básicos à população LGBTI+, com responsabilização de agressores.'
  texto: '• Por emprego, salário digno e direitos para as mulheres! • Salário igual para trabalho igual; • Combate à desigualdade salarial e à superexploração das mulheres, especialmente das mulheres negras; • Garantia de direitos para todas as trabalhadoras (aposentadoria, licença maternidade, auxílio- doença, etc.), independentemente do vínculo empregatício; • Proteção social (aposentadoria, licença maternidade, auxílio-doença, etc.) para todas: formais, informais e desempregadas; LGBTIs No capitalismo, a sexualidade é moldada pela necessidade da reprodução da força de trabalho e da família tradicional. O gênero é aprisionado nesse modelo dominante de organização da sexualidade e da família , em que o desconforto entre o sexo/fenótipo biológico e o gênero social é taxado como doença e pessoas trans e não-binárias são tratadas como pessoas de segunda categoria, desumanizadas. O Estado nega direitos básicos à população LGBTI+ e é cúmplice da brutal violência que as LGBTI+ sofrem cotidianamente.
    A burguesia se aproveita da LGBTIfobia para relegá -los aos postos de trabalho mais precários e com menores salários, quando não estão compondo as fileiras do exército industrial de reserva no subemprego ou na prostituição.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Agricultura
  resumo: 'Propõe proteção aos territórios indígenas e quilombolas e apoio à agricultura familiar, quilombola e indígena, com assistência técnica, compras públicas e crédito direcionado às comunidades tradicionais.'
  texto: • Fortalecer políticas estaduais de proteção aos territórios indígenas e quilombolas, combatendo invasões, crimes ambientais e atividades econômicas ilegais que ameaçam essas populações. • Ampliar programas estaduais de apoio à agricultura familiar, quilombola e indígena, com assistência técnica, compras públicas, incentivo à produção sustentável e articulação para que o crédito público seja direcionado às comunidades tradicionais, e não prioritariamente ao agronegócio. No mundo do trabalho e na geração de direitos • Implementar políticas estaduais de valorização do trabalho e combate à precarização, especialmente no serviço público estadual, garantindo igualdade salarial, condições dignas de trabalho e enfrentamento às desigualdades raciais. • Atuar politicamente pela redução da jornada de trabalho, pelo fim da escala 6x1 e das terceirizações, medidas que dependem de legislação nacional, mas que podem ser defendidas e impulsionadas pelo Estado. • Fortalecer a fiscalização das relações
    de trabalho em parceria com órgãos competentes, combatendo práticas discriminatórias e situações de exploração que atingem majoritariamente trabalhadores negros.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Tecnologia e Inovação
  resumo: 'Defende condicionar os incentivos da Zona Franca a empregos dignos e transferência tecnológica, além de ampliar investimentos públicos em pesquisa e inovação com base nos conhecimentos amazônicos.'
  texto: • Condicionar os incentivos públicos às empresas da ZFM à geração de empregos dignos, transferência tecnológica, formação profissional e integração com cadeias produtivas regionais. Ciência, tecnologia e desenvolvimento regional • Ampliar investimentos públicos em pesquisa e inovação, fortalecendo a articulação entre universidades, institutos de pesquisa e setores produtivos estratégicos. • Desenvolver formas produtivas baseadas nos conhecimentos amazônicos e no uso sustentável da biodiversidade, evitando sua apropriação privada. • Promover a interiorização do desenvolvimento econômico, reduzindo a concentração produtiva em Manaus. Energia, recursos naturais e soberania ambiental • Defender a retomada do controle público dos setores estratégicos — energia, petróleo, gás e mineração — como parte de um projeto nacional, com medidas como a reestatização da Refinaria 8 do Amazonas (REMAN), da distribuição de energia e dos serviços de abastecimento de água, garantindo gestão pública
    com controle operário e voltada às necessidades da população.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: 'Propõe gestão pública com controle social e transparência, combate à corrupção e rejeição às privatizações, defendendo o controle público dos setores estratégicos e dos bens comuns.'
  texto: • Promover a interiorização do desenvolvimento econômico, reduzindo a concentração produtiva em Manaus. Energia, recursos naturais e soberania ambiental • Defender a retomada do controle público dos setores estratégicos — energia, petróleo, gás e mineração — como parte de um projeto nacional, com medidas como a reestatização da Refinaria 8 do Amazonas (REMAN), da distribuição de energia e dos serviços de abastecimento de água, garantindo gestão pública com controle operário e voltada às necessidades da população. • Combater a exploração predatória dos recursos naturais, assegurando que a riqueza amazônica esteja subordinada aos interesses sociais e à preservação ambiental. • Rejeitar a privatização dos bens comuns, como rios e florestas. Integração regional e preservação da Amazônia • Construir uma política de infraestrutura voltada às necessidades sociais e ambientais, e não aos interesses de grandes empreendimentos predatórios.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
