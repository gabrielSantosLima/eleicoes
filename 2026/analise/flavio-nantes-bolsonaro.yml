propostas_governo:
- area: Economia e Trabalho
  resumo: Cursos, presenciais ou online, terão certificado e conexão com vagas de emprego e trilhas para abrir o próprio negócio. O plano integra vagas, qualificação e abertura simplificada de empresas, com foco na inserção de mulheres no mercado de trabalho.
  texto: Todos os cursos, online ou presenciais, terão certificado ao final e conexão com vagas de emprego e trilhas para quem deseja abrir o próprio negócio. Mais Trabalho para Elas mais emprego, mais renda, mais independência Vamos criar um sistema que integre vagas de emprego, qualificação, abertura simplificada de empresa, apoio ao pequeno negócio e intermediação de mão de obra. E vamos montar um grande banco de dados conectado ao RH de empresas de todo o país, para impulsionar de forma mais segura a colocação de mais mulheres no mercado de trabalho. 21 Creche garantida para toda criança o cuidado como parte da economia As mulheres dedicam quase o dobro de horas dos homens ao trabalho doméstico, um cuidado não remunerado que equivale a cerca de 8,5% do PIB brasileiro. Vamos ampliar a oferta de creches para as crianças desde a primeira infância, em período integral, com alimentação digna e foco no desenvolvimento infantil.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Educação
  resumo: Ampliar a oferta de ensino técnico no ensino médio, em parceria com o setor produtivo, para que o jovem conclua a escola já com uma profissão. O setor produtivo poderá custear bolsas de formação técnica.
  texto: Há anos, setores organizados resistem a um ensino técnico voltado às necessidades reais do mercado, como se preparar o jovem para trabalhar fosse algo menor. Vamos ampliar a oferta de educação técnica para os alunos do ensino médio, para que o jovem saia da escola já com uma profissão na mão, e não apenas com um diploma. E vamos fazer essa formação técnica em parceria com o setor produtivo, com foco na inovação, de modo que quem forma o profissional converse diretamente com quem vai contratá-lo. Nessa parceria, o setor produtivo poderá custear bolsas de formação técnica , financiando a qualificação dos profissionais de que precisa. A escola também precisa preparar para a economia que vem chegando.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Saúde
  resumo: Cuidar da saúde da mulher de forma preventiva, com atendimento perto de casa, telemedicina e prontuário eletrônico integrado. Ampliar exames preventivos, saúde bucal e Unidades Móveis de Saúde da Mulher.
  texto: 'Nosso compromisso é devolver às mulheres aquilo que hoje lhes falta: tempo, inclusive para cuidar de si mesmas. Saúde para Elas mais prevenção, menos filas Vamos cuidar da saúde da mulher de forma preventiva, sem fila longa, com atendimento perto de casa e também pelo celular, por telemedicina ou em postos de saúde que vamos ampliar e construir. O prontuário eletrônico integrado garantirá rastreamento e acompanhamento ao longo da vida, através de um banco de dados da saúde que conectará médicos de diferentes especialidades, e a mulher não perderá mais o dia inteiro de trabalho para cuidar da própria saúde. Vamos ampliar o acesso a exames preventivos, cuidando da mulher com câncer, na menopausa, na gestação ou que sofre de endometriose, por exemplo, e dar acesso também à saúde bucal. E teremos Unidades Móveis de Saúde da Mulher, ônibus ou caminhões adaptados que percorrerão o país, além de barcos adaptados para atender a população ribeirinha.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Segurança Pública
  resumo: Combater facções e o crime organizado, com castração química para estupradores, auxílio às famílias das vítimas e canais de denúncia de feminicídio.
  texto: 69 Terras indígenas e quilombolas ...................................... 50 SEGURANÇA PÚBLICA Auxílio às famílias das vítimas ......................................... 15 Castração química para estupradores .......................... 14 Facções e crime organizado .............................................. 13 Feminicídio - Canais de denúncia ...................................
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Meio Ambiente
  resumo: Tratar quem produz conforme a lei como parceiro na proteção ambiental e separar com clareza quem produz legalmente de quem destrói o meio ambiente para lucrar. Defender a Amazônia com soberania e presença do Estado.
  texto: 'Quem produz respeitando a legislação deve ser tratado como parceiro na proteção ambiental, e não submetido à presunção de irregularidade. Combater o crime ambiental é separar com clareza quem produz legalmente de quem se apropria do patrimônio público e destrói o meio ambiente para lucrar. Amazônia: soberania e oportunidade. A Amazônia ocupa posição estratégica para o Brasil e para o mundo, mas pertence, antes de tudo, aos brasileiros. Sua proteção será conduzida com soberania, presença do Estado e oportunidade para quem vive na região.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Infraestrutura e Mobilidade
  resumo: Reduzir o tempo de deslocamento com o transporte coletivo como base da mobilidade e parcerias que conciliem moradia e infraestrutura. Bancos públicos priorizarão metrô, transporte sobre trilhos e ônibus elétricos ou a biocombustível.
  texto: É tempo roubado da família, do descanso e do estudo. Vamos pensar o desenvolvimento das cidades para reduzir o deslocamento da população, com o transporte coletivo como base da mobilidade e parcerias que diminuam o tempo de viagem do trabalhador, valorizando os contratos que conciliam moradia e infraestrutura no mesmo projeto. Os bancos públicos priorizarão o financiamento de linhas de metrô, transporte sobre trilhos e ônibus movidos a eletricidade e biocombustíveis. Menos tempo no trânsito é mais tempo em casa, e uma cidade que se atravessa rápido é uma cidade que trabalha melhor e polui menos. 52 Segurança hídrica água que chega, e enchente que não destrói Para milhões de brasileiros, sobretudo no Nordeste, a água ainda é uma incerteza diária, e a cada temporada de chuva outras tantas famílias perdem tudo em enchentes e deslizamentos.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
