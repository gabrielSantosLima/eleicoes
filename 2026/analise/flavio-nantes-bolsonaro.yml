- area: Tecnologia e Inovação
  resumo: Digitalizar 100% dos serviços públicos, ampliar a conectividade e o bônus de internet e digitalizar o SUS, promovendo um Estado digital e o desenvolvimento tecnológico.
  texto: 16 Tráfico e cocaína nos portos ............................................. 15 TECNOLOGIA, INOVAÇÃO E ESTADO DIGITAL 100% dos serviços públicos digitalizados .................. 25 Bônus de internet .................................................................. 18 Conectividade - expansão .................................................. 24 Digitalização do SUS .............................................................
