- area: Gestão Pública e Combate à Corrupção
  resumo: Promover um amplo corte de gastos, o tesouraço, para enxugar a máquina, equilibrar as contas e reduzir impostos. Um Estado com transparência, mérito e regras claras para prevenir a corrupção.
  texto: 'Nossa bandeira é um grande TESOURAÇO: um corte profundo e por todos os lados, que enxuga a máquina, coloca as contas em ordem e reduz os impostos que pesam sobre quem produz. E é também um Estado organizado para prevenir a corrupção: com transparência, mérito e regras claras, fecha -se o espaço para o desvio. É o que detalham as próximas páginas. Mais Brasil e menos Brasília "Mais Brasil, menos Brasília" não é uma frase nova para nós: é um jeito de governar que já praticamos. No nosso governo, o município deixou de ser um subordinado que pede favor em Brasília e passou a ser tratado como parceiro, com mais autonomia e mais protagonismo para o prefeito resolver a vida da sua cidade.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Política Externa
  resumo: Conduzir uma política externa de soberania com profissionalismo, sem viés ideológico, priorizando o desenvolvimento regional e a inserção competitiva do Brasil no mundo.
