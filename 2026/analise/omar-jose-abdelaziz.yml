- area: Segurança Pública
  resumo: Combater o crime organizado e as pressões sobre terras indígenas e unidades de conservação, enfrentando garimpo ilegal, grilagem, desmatamento e lavagem de dinheiro.
  texto: 'Apesar disso, persistem pressões estruturais sobre esses territórios: avanço do garimpo ilegal, expansão desordenada de atividades agropecuárias em áreas limítrofes, insuficiência de serviços públicos essenciais e intensifi- cação dos eventos climáticos extremos, que ampliam a vulnerabilidade dessas populações, sobretudo nas regiões de difícil acesso. O segundo volume do Plano Estratégico de Desenvolvimento, que, dentre outros temas, trata da Segurança Pública do Amazonas, demonstrou, a partir de um robusto levantamento de dados e estatísticas, que as Terras Indígenas e as Unidades de Conservação têm sofrido pressões diversas em razão do interesse mineral e madeireiro, mas também da atuação do crime organizado nesses territórios: • Conflitos fundiários, grilagem de terras e sobreposição com o Cadastro Ambiental Rural (CAR); • Crimes ambientais, como garimpo ilegal, desmatamento e tráfico de animais; • Desenvolvimento de atividades voltadas à lavagem de dinheiro. Lançado em junho
    de 2026, este mesmo volume do Plano Estratégico de Desenvol - vimento, no capítulo dedicado às ações da Cultura, reconhece a centralidade dos povos originários e das comunidades tradicionais como guardiões da floresta e de seus recursos naturais, detentores de saberes ancestrais e protagonistas de práticas sustentáveis. A cul- tura constitui, portanto, patrimônio vivo e importante ferramenta para o desenvolvimento sustentável, perspectiva que se alinha diretamente às políticas ambientais ao valorizar conhecimentos tradicionais, promover ações de educação ambiental, fortalecer economias criativas de base comunitária e ampliar o protagonismo desses povos na gestão territorial. Esse protagonismo, contudo, somente pode ser plenamente exercido quando amparado pela garantia dos direitos territoriais,'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Meio Ambiente
  resumo: Desenvolver a piscicultura e a aquicultura sustentáveis como vetores econômicos compatíveis com a floresta, integrando conservação ambiental, bioeconomia e inclusão social.
  texto: 'Ao demonstrar que a aquicultura pode impulsionar a economia regional, gerar renda no interior, fortalecer a segurança alimentar e se consolidar como uma atividade sustentável, o Plano Estratégico de Desenvolvimento do Meio Ambiente reforça a visão de que a pis - cicultura e a aquicultura sustentáveis constituem vetores de desenvolvimento compatíveis com a floresta, capazes de integrar conservação ambiental, bioeconomia e inclusão social. Plano Estratégico de Desenvolvimento Potenciais econômicos e ambientais da aquicultura • Condições naturais excepcionais para produção sustentável: Deten - tor da maior bacia hidrográfica do planeta, o Amazonas reúne condi - ções naturais singulares para o desenvolvimento da aquicultura em bases ambientalmente responsáveis; • Biodiversidade como ativo econômico e ecológico: Espécies nativas como tambaqui, pirarucu e matrinxã possuem alto valor comercial e são adaptadas ao ambiente amazônico, reduzindo riscos ecológicos e custos produtivos; • Redução
    da pressão sobre estoques naturais: A expansão da aquicultura diminui a dependência da pesca extrativa, contribuindo para a conservação dos ecossistemas aquáticos; • Mercado interno forte e preços elevados: A demanda local por pescado e a escassez de algumas espécies elevam os preços, criando oportunidades de renda para produtores; • Potencial de exportação interestadual e internacional: A abundância hídrica e a variedade de espécies com aptidão produtiva permitem que o Amazonas se torne um polo exportador de proteína sustentável; • Cadeias produtivas estratégicas para a bioeconomia: Atividades relaciona- das à criação e ao manejo de peixes ornamentais, quelônios, jacarés, camarões e algas combinam alto valor agregado com oportunidades de conservação e geração de renda no interior; • Vulnera'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Infraestrutura e Mobilidade
  resumo: Criar um fundo de investimento público para financiar infraestrutura econômica e social, logística, energia, saneamento, mobilidade e turismo, interiorizando o desenvolvimento.
  texto: 'Isto é, o fundo tem uma lógica de uso voltada para desenvolvimento regional e estrutural. Neste contexto, pode financiar: infraestrutura econômica e social (obras, equipamentos, logística, energia, saneamento, mobilidade), turismo (promoção, infraestrutura turística, serviços), serviços essenciais em áreas estratégicas, interiorização do desenvolvimento, levando investimentos para municí- pios fora da capital, e projetos estruturantes que ampliem a capacidade produtiva do Estado. As múltiplas formas de aplicação do FTI O FTI constitui um fundo de investimento público, não um fundo de crédito. Sua natureza jurídica permite que os recursos sejam aplicados por diferentes moda - lidades operacionais, conforme a estratégia de desenvolvimento definida pelo Estado. Alguns exemplos: • Investimentos diretos do Estado.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Direitos Humanos
  resumo: Ampliar o acesso à formação artística e cultural e implementar políticas de inclusão e diversidade para indígenas, negros, mulheres, LGBTQIA+, pessoas com deficiência e comunidades periféricas, valorizando o patrimônio cultural.
  texto: • Ampliar o acesso à formação técnica e artística profissionalizante, transformando o Liceu de Artes e Ofícios Claudio Santoro (LAOCS) em um polo de educação a distância e descentralizando suas unidades físicas para municípios e calhas de rios. • Implementar políticas transversais de inclusão e diversidade, assegurando editais permanentes com cotas e ações afirmativas para artistas indígenas, população negra, mulheres, LGBTQIA+, pessoas com deficiência e comunidades periféricas. • Preservar e valorizar o patrimônio cultural material e imaterial, por meio da atualização da legislação estadual, da restauração de bens públicos e do reconhecimento oficial das línguas indígenas e da memória dos mestres da cultura amazonense. Plano Estratégico de Desenvolvimento Estratégias para uma travessia de sucesso Os objetivos apresentados neste capítulo não se realizam por simples enunciação. Eles dependem da capacidade de compreender o terreno em que a política cultural será imple- mentada e de
    agir estrategicamente sobre ele.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Agricultura
  resumo: Implantar um agronegócio de baixo impacto, valorizando a floresta como ativo estratégico, a intensificação sustentável e a recuperação de áreas degradadas, conciliando produção, renda e conservação.
  texto: 'Fonte: Elaborado pelos autores (2026) 178 Parte 02. Plano Estratégico de Desenvolvimento  Eixo Estruturante 11 – Agronegócio de Baixo Impacto O Eixo Estruturante 11 busca iniciar a construção de um novo paradigma para a agro- pecuária amazonense e promover uma mudança estrutural na forma como produzimos, orientando o setor para um modelo que valorize a floresta como ativo estratégico e utilize de forma inteligente as áreas já abertas. Ao priorizar a intensificação sustentável, a recuperação de áreas degradadas e a adoção de sistemas produtivos compatíveis com a realidade da região, o Amazonas se posicionará para liderar um caminho que concilia produção, geração de renda e floresta em pé. Este caminho responde às exigências dos mercados modernos e fortalece a segurança ambiental e socioeconômica de longo prazo. Vozes e subsídios técnicos convergentes “O Brasil tem muito mais a oferecer do que os 13.235 km² de desmatamento ilegal no último ano [2023].'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Tecnologia e Inovação
  resumo: Integrar cultura, universidade e comunidade por meio de pesquisa, inovação e tecnologia, criando laboratórios, editais e soluções digitais para democratizar o acesso ao conhecimento.
  texto: 'Projetos integrados: cultura, universidade e comunidade: a integração entre a cultura, a Universidade e a comunidade forma um eixo prioritário fundamental para o desenvolvimento sustentável do Amazonas. Essa sinergia pode não apenas democra- tizar o acesso à cultura e ao conhecimento, mas também fortalecer a identidade local, capacitar profissionais e gerar impacto social e econômico direto (14 ações): • Realizar mapeamento dos empreendedores, criadores em geral e artesãos locais, para banco de dados de talentos que podem ser apoiados pelo Estado; • Realizar estudos de impacto social e econômico dos eventos por observatório que possa fornecer dados para gerar projetos e propostas; • Estimular, por edital, a pesquisa acadêmica na análise da receita gerada pela cultura, no aumento do fluxo de turistas e no retorno social para as comunidades, fornecendo indicadores e dados concretos para a formulação de políticas públicas; • Incentivar a contratação de serviços e a compra de produtos
    das comunidades locais, criando um ciclo de produção e consumo sustentável; • Criar um modelo de gestão que inclua a participação de representantes da comu - nidade e da Universidade nas decisões sobre a programação e o uso dos espaços, estimulando o sentido de pertencimento; • Transformar salas subutilizadas de espaços públicos em oficinas, laboratórios ou salas de ensaio para artistas e estudantes, em parceria com universidades, ofere - cendo cursos e workshops práticos em cenografia, iluminação, produção musical e conservação de obras; • Criar edital para laboratórios de pesquisa com a Universidade a fim de mapear e documentar o patrimônio imaterial, envolvendo estudantes e professores para, junto com a comunidade, registrar tradições, lendas e saberes ancestrais, transformando o conhecimen'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: Promover transparência e governança com gestão pública baseada em dados e participação social, além de estimular a inovação por meio de hackathons e soluções digitais para a cultura.
  texto: 'Plano Estratégico de Desenvolvimento • Promover maratonas de desenvolvimento voltadas à solução de desafios do setor cultural, como hackathons destinados à criação de soluções digitais para a pre - servação do patrimônio cultural ou ao desenvolvimento de aplicativos de turismo interativo, estimulando a inovação, o empreendedorismo e a conexão entre dife - rentes áreas do conhecimento; • Aprimorar a proposta de passaporte cultural único, para acesso a museus, galerias e eventos, oferecendo experiência digital gamificada, com oferta de pontos ao visitar locais, completar missões e interagir com obras de arte digital, incentivando a explora- ção cultural, o acesso a informações sobre artistas locais e canal direto de promoção; • Lançar editais para residências que unam artistas visuais e audiovisuais com pesquisadores e desenvolvedores, com a finalidade de criarem projetos colabo - rativos para ocupar espaços públicos, galerias ou o ambiente virtual, tornando a arte inovadora acessível
    a todos; • Lançar programa de capacitação para que líderes comunitários e artistas locais atuem como “embaixadores da cultura”, com treinamento em comunicação digital e marketing para divulgar os eventos, garantindo que a informação chegue de maneira orgânica e confiável às comunidades; • Fortalecer a relação com rádios comunitárias, TVs locais, jornais de bairro e veículos de comunicação universitários, produzindo conteúdos exclusivos (como podcasts e pequenos vídeos documentais) para esses canais, que têm alcance direcionado e maior credibilidade junto à população local. Transparência e governança: têm como objetivo criar uma cultura de gestão pública baseada em dados, participação social e consolidação institucional. As ações propostas garantem transparência e continuidade administrativa'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Política Externa
  resumo: Fortalecer a soberania e a gestão ambiental com conectividade por satélites LEO, drones e monitoramento remoto, ampliando a cooperação internacional e a formação de capital humano.
  texto: 'Plano Estratégico de Desenvolvimento OPORTUNIDADES • Implantar conectividade via satélites LEO ( starlink ) e modo offline-first que permita trabalho de campo sem conexão permanente; • Utilizar drones e satélites no monitoramento; • Intensificar a formação de capital humano junto a universidades locais (UFAM, INPA, IFAM e UEA) e innstituições internacionais, priorizando os povos originários e tradicionais e o conhecimento das equipes técnicas do IPAAM/SEMA; • Apoiar a criação de incubadoras e startups que desenvolvam tecnologias para produtos, processos e monitoramento da sociobiodiversidade amazônica e malha de movimentação de cargas e pessoas (rios e estradas), impulsionando o cresci - mento da bioeconomia e a segurança ambiental no estado. AMEAÇAS • Defasagem tecnológica crítica por falta de investimentos, o que pode impedir a expansão de tecnologias de monitoramento remoto, deixando o Estado atrás do aparato tecnológico usado por atores ilegais; • Apagão digital do interior,
    pela ausência de conectividade; • Ataques cibernéticos que podem expor dados sensíveis, diante do fato de a Ama - zônia ser estratégica para o mundo; • Dependência tecnológica externa, de plataformas e equipamentos estrangeiros, fragilizando a autonomia do Estado em monitoramento e gestão ambiental, em tempos de tensão geopolítica, representa risco direto à soberania e à continui - dade das operações. Dimensão: Ecológica FORÇAS • Maior território preservado do país (mais de 1,5 milhão de km²), abrigando a maior bacia hidrográfica navegável, reserva hídrica potável e reserva florestal do planeta; • Existência de 42 Unidades de Conservação; • Reservatório global de megabiodiversidade e carbono. FRAQUEZAS • Eventos climáticos extremos causados pelos fenômenos El Niño e La Niña (Secas - 2023/2024; C'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
- area: Assistência Social
  resumo: Articular políticas de saneamento, segurança alimentar e geração de renda à preservação ambiental, reduzindo desigualdades regionais e integrando assistência social e sustentabilidade.
  texto: '• Forte demanda reprimida por melhores condições de vida facilita a adesão a pro - gramas públicos: há uma importante janela de receptividade para ações governa - mentais, pois populações vulneráveis tendem a aderir a programas de bioeconomia e conservação que gerem benefícios sociais e econômicos para as comunidades. Fatores desfavoráveis • Profunda desigualdade regional, com Índice de Desenvolvimento Humano (IDH) muito baixo em diversos municípios do interior: a pobreza estrutural aumenta a pressão sobre os recursos naturais; sem alternativas econômicas viáveis, a floresta frequen - temente se converte em fonte imediata de sobrevivência. • Urbanização caótica em Manaus e nas sedes urbanas do interior: a expansão de ocu- pações irregulares em áreas de várzea e de preservação permanente criam conflitos entre a política ambiental e o direito à moradia. Implicações para a gestão • Integrar políticas de saneamento, abastecimento de água, segurança alimentar e gera- ção de renda às
    estratégias de preservação ambiental: a sustentabilidade ambiental é inalcançável sem sustentabilidade social. Os eixos de atuação devem ser articu - lados, pois não há política ambiental completa quando parcela da população ainda carece de condições básicas de dignidade, saúde, segurança alimentar e acesso aos serviços essenciais.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
