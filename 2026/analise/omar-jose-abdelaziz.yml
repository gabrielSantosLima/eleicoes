- area: Saúde
  resumo: Fortalecer a saúde pública no Amazonas, ampliando o atendimento no interior e a telessaúde e integrando saúde e educação, com atenção às populações ribeirinhas e indígenas.
  texto: '32 programas executados em 2023 — ano comemorativo dos 20 anos da FAPEAM, marcado pelo lançamento do Programa Universal FAPEAM 20 anos e pelo crescimento de 44% da produção científica do Amazonas (de 0,9% em 2018 para 1,3% em 2024 do total nacional). 1 PAIC — Iniciação Científica do Amazonas 17 PRODEB/INTER — Inovação para Educação Básica + Mulheres na Ciência 2 POSGRAD — Apoio à Pós-Graduação Stricto Sensu 18 Programa Sintec — Iniciação Tecnológica 3 PCE — Ciência na Escola 19 Programa Lidera Cientista — Liderança Feminina na Ciência 4 POSGFE — Apoio a Pós-Graduandos Fora do AM 20 PROIN-INFRA CT&I — Infraestrutura de Pesquisa 5 PRODOC/FAPEAM — Formação e Qualifica - ção de Doutores 21 PAPAQ — Apoio a Aquicultura e Pesca 6 PROGRADUAR — Amparo à Graduação 22 Programa de Apoio à Inovação na Indústria — PAII 7 PROMOB 1 — Mobilidade Técnico-Científica 23 PEX-CT&I/FAPEAM — Pesquisa e Extensão em Áreas Estratégicas 8 Programa Universal — FAPEAM 20 anos 24 PRÓ-ESTADO — Consolidação Institucional
    9 PRONEM — Apoio a Núcleos Emergentes 25 PROEMEND — Emendas Parlamentares Impositivas 10 PROCLIMA-AMAZÔNIA 1 — Fenômenos Climáticos Extremos 26 Programa Universal CONFAP–CONICET (Argentina) 11 PAINTER INFRA CT&I 1 — Interiorização 27 Chamada CONFAP–Itália 2023 — Mobilidade 12 PRÓ-INCUBADORAS — Apoio a Incubadoras 28 Iniciativa Amazônia +10 — 2ª Chamada 13 Coleções Biológicas/Museus — Preserva - ção e Divulgação 29 Chamada Biodiversa+ 2023 — Biodiversi - dade Sustentável 14 POP CT&I — Popularização da CT&I 30 Chamada CHIST-ERA 2023 — IA e Compu - tação Confiável 15 PAREV — Realização de Eventos Científicos 31 Chamada NIH/Fogarty — Saúde Global 16 Prêmio FAPEAM CT&I — Edição 2023 32 Chamada ERA PerMed 2023 — Medicina de Precisão Fonte: Relatório de Atividades FAPEAM (2023). Plano Estraté'
