- area: Economia e Trabalho
  resumo: Plano estratégico para diversificar a economia do Amazonas, reduzindo a dependência da Zona Franca de Manaus e das commodities por meio da bioeconomia, do crédito verde e de infraestrutura no interior.
  texto: FRAQUEZAS • Dependência fiscal da Zona Franca de Manaus e de poucas commodities deriva- das da biodiversidade amazônica; • Custo Amazônia (logístico) proibitivo, encarecendo o custo dos serviços públicos e os investimentos privados; • Escassez de crédito verde acessível aos pequenos agricultores e familiares, diante da irregularidade fundiária; • Lentidão cartorial no Licenciamento Ambiental, impedindo expansão econômica de empreendimentos em todo o estado. Plano Estratégico de Desenvolvimento OPORTUNIDADES • Escalar bioeconomia e sociobiodiversidade; • Fortalecer mecanismos de Pagamento por Serviços Ambientais (PSA) e bioeco - nomia com protagonismo das comunidades, atraindo capital ESG e cooperação internacional (GEF, Fundo Amazônia/REDD+) para gerar renda e incentivar a conservação voluntária; • Incentivar a criação de empregos verdes; • Acesso aos mercados de superalimentos, fármacos e demais princípios ativos amazônicos; • Investir em infraestrutura no interior para estimular
    a economia local de base sustentável, gerar renda e aumentar a arrecadação dos municípios, especialmente diante das novas regras da reforma tributária; • Mobilizar apoio político e propor ao Governo Federal a criação de fundos de sus - tentabilidade e desenvolvimento econômico para o Amazonas e para os estados da Amazônia Ocidental e Amapá, definidos na Constituição Federal, a fim de financiar infraestrutura e impulsionar atividades sustentáveis no estado. AMEAÇAS • Perda de arrecadação do estado do Amazonas diante das mudanças impostas pela Reforma Tributária, o que pode implicar em redução de recursos destinados às políticas de meio ambiente (ações de fiscalização e fomento de atividades sustentáveis); • Volatilidade dos mercados de commodities amazônicas; • Choques financeiros nos créditos
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_AM.zip
