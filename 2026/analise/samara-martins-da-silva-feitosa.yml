- area: Direitos Humanos
  resumo: Propõe combater a exploração e todas as formas de opressão, como racismo, machismo, LGBTfobia e capacitismo, e defender os povos indígenas, quilombolas e comunidades tradicionais.
  texto: 'Defendemos que a riqueza produzida pelo povo brasileiro esteja a serviço do próprio povo e que o planejamento da economia seja democrático e popular. Vamos combater todas as formas de exploração, racismo, machismo, LGBTfobia, capacitismo e opressão; defender os povos indígenas, quilombolas e comunidades tradicionais; e garantir soberania diante dos interesses do grande capital nacional estrangeiro. Dessa forma, o objetivo não é administrar as desigualdades produzidas pelo capitalismo, mas criar condições políticas, econômicas e sociais para superá-las. Não é possível ter um país justo com arrocho salarial, jornadas exaustivas de trabalho, juros abusivos e uma minoria de ricos morando em mansões e possuindo centenas de prédios, enquanto os pobres moram em áreas de risco e pagam aluguéis altíssimos. Para lutar contra essa situação, Samara Martins é candidata da UP à Presidência do Brasil: “Nós queremos m país sem injustiças sociais e sem exploração dos trabalhadores por uma minoria
    de bilionários.'
