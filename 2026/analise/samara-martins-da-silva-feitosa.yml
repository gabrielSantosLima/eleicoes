  texto: Um Governo Popular dos T rabalhadores, baseado na participação permanente do povo, no controle público dos setores estratégicos, na soberania nacional, na planificação democrática da economia e na prioridade absoluta às necessidades sociais. Defendemos que saúde, educação, água, energia, saneamento, moradia, transporte, cultura e comunicação sejam direitos, e não mercadorias. Defendemos o fim da escala 6x1, a redução da jornada com aumento salarial, a elevação em 100% do salário mínimo, a reindustrialização, a reforma agrária, a soberania nacional, o fortalecimento da ciência e a recuperação do controle público dos setores estratégicos. Defendemos que a riqueza produzida pelo povo brasileiro esteja a serviço do próprio povo e que o planejamento da economia seja democrático e popular. Vamos combater todas as formas de exploração, racismo, machismo, LGBTfobia, capacitismo e opressão; defender os povos indígenas, quilombolas e comunidades tradicionais; e garantir soberania diante dos
