propostas_governo:
- area: Economia e Trabalho
  resumo: Propõe transformações estruturais, com a instituição do Orçamento Popular 100% deliberativo, em que os trabalhadores decidem a aplicação dos recursos públicos, e a valorização do trabalho.
  texto: 'Todas as transformações revolucionárias realizadas no Século XX se deram em países agrárias, partindo de um patamar de baixo desenvolvimento das forças produtivas, o que dificultou acentuadamente o processo de mudanças. O Brasil pelo contrário, é uma nação industrializada, com terra e água em abundância, força de trabalho jovem, matérias- primas e terra raras necessárias para o desenvolvimento econômico e social calcado no atendimento às necessidades da população e não nos interesses e lucros da burguesia interna e do imperialismo. Um Programa de transformações estruturais e radicais 1. NA POLÍTICA: A primeira grande transformação consiste na reconstrução radical do sistema político brasileiro. Instituiremos o Orçamento Popular 100% deliberativo, ou seja, os trabalhadores decidirão onde o governo aplicará os recursos.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Educação
  resumo: Defende a implementação do Piso Salarial Profissional Nacional como vencimento básico da carreira docente e uma política cultural que valorize a criatividade e a cultura popular.
  texto: A educação básica pública brasileira constitui o maior sistema educacional da América Latina e um dos maiores do mundo. Segundo os dados mais recentes do Censo Escolar, o país conta com aproximadamente 2,4 milhões de professores e professoras atuando na educação básica, distribuídos entre a educação infantil, os anos iniciais e finais do ensino fundamental e o ensino médio. Esses profissionais atendem mais de 46 milhões de estudantes em todo o território nacional. É preciso implantar em definitivo o Piso Salarial Profissional Nacional como vencimento básico do primeiro nível da carreira, produzindo reflexos em toda a estrutura remuneratória da categoria, preservando assim os planos de carreira, valorizando a formação, reconhecendo o tempo de serviço e impedindo o achatamento salarial. Na cultura, será desenvolvida uma política que estimule a criatividade, experimentação e as mais diversas expressões da juventude e dos artistas brasileiros; resgate da cultura popular e de massas,
    buscando romper com os interesses dos monopólios dominantes nacionais e internacionais e com a mercantilização da cultura e das artes.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Saúde
  resumo: Propõe tornar público todo o sistema de saúde, fortalecer a atenção básica e ampliar o Complexo Econômico-Industrial da Saúde via BNDES para produzir medicamentos, vacinas e equipamentos.
  texto: 'NOS SERVIÇOS PÚBLICOS E NO MEIO AMBIENTE: A quarta das grandes transformações do governo do poder popular universaliza os direitos essenciais e busca garantir serviços públicos de qualidade para o povo trabalhador. Na saúde o governo do poder popular tornará público todo o sistema de saúde, integrado com assistência (hospitais, serviços ambulatoriais, de apoio diagnóstico e terapêutico), pesquisa, produção de medicamentos, vacinas e equipamentos, com fortalecimento da atenção básica em todos os bairros, visando garantir atendimento à saúde a todas as pessoas o mais próximo possível de seus locais de moradia ou trabalho. Usaremos o BNDES e demais ferramentas públicas de financiamento para ampliação dos investimentos no Complexo Econômico-Industrial da Saúde (CEIS), vetor importante para a criação de empregos qualificados, para a produção de medicamentos, insumos, material médico-hospitalar e equipamentos, contribuindo para o desenvolvimento de ciência e tecnologia públicas e soberanas.
    Um SUS forte, público, gratuito e de qualidade só será possível com um CEIS planejado, forte e soberano. A integração do SUS se dará a partir da atenção primária à saúde, evoluindo até os níveis de maior complexidade, processo que deverá ser conjugado com ações de promoção, prevenção, cura e reabilitação dos pacientes.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Segurança Pública
  resumo: Defende a desmilitarização da segurança pública, a unificação das polícias, o fim da política de guerra às drogas e uma atuação baseada nos direitos humanos.
  texto: 'Nas cidades, imóveis ociosos serão reformados e destinados à moradia popular, para ocupação imediata das famílias sem teto e vivendo de aluguel, processo que se complementará com a realização de um amplo programa de habitações populares até acabar com o déficit habitacional existente no Brasil. O governo do Poder Popular agirá com rigor no combate ao genocídio da população negra, pondo fim à política de “guerra às drogas”, para o que se faz necessária a completa desmilitarização da segurança pública, com unificação das polícias e instituição do ciclo completo junto com a desvinculação das forças de segurança do exército, sob bases curriculares e formativas completamente reestruturadas numa lógica democrática. Será desenvolvida uma política de segurança dos direitos humanos, no lugar da segurança pública baseada na repressão à classe trabalhadora, à população pobre e aos moradores das periferias, com a criação de um ministério voltado à aplicação das medidas necessárias à garantia
    desses direitos e a revogação completa da lei antiterrorismo (12.850/2013). Serão adotadas políticas públicas de combate radical ao machismo, à misoginia, ao racismo, à lgbtfobia, ao capacitismo, em defesa dos direitos das mulheres, da juventude, do povo negro, dos povos originários, quilombolas e das pessoas com deficiência. NOS SERVIÇOS PÚBLICOS E NO MEIO AMBIENTE: A quarta das grandes transformações do governo do poder popular universaliza os direitos essenciais e busca garantir serviços públicos de qualidade para o povo trabalhador.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Meio Ambiente
  resumo: Propõe política radical de combate à destruição da natureza, entendida como luta anticapitalista, com cumprimento da Política Nacional de Resíduos Sólidos, apoio a catadores e ampliação das Unidades de Conservação.
  texto: No meio ambiente, o governo do Poder Popular desenvolverá uma política radical de combate à destruição da natureza promovida pelo capitalismo. O PCB entende que a luta pela sustentabilidade ambiental é uma luta anticapitalista, pois os padrões de produção industrial e agrícola em escalas cada vez mais elevadas por grandes conglomerados nacionais e internacionais, com o uso intensivo de agrotóxicos e fertilizantes químicos em grandes plantações com monocultura e mecanização, promovem um processo de esgotamento dos recursos naturais, contaminação dos solos, emissões de gases do efeito estufa e geração de efluentes líquidos contaminantes do meio ambiente. Dadas a gravidade e a intensidade dos efeitos da degradação ambiental em geral e das mudanças climáticas faz-se necessária a adoção de ações emergenciais voltadas à preservação ambiental, como a emissão de alertas de tempestades e temperaturas elevadas; a obrigatoriedade da oferta de água potável em toda a cidade e de refrigeração
    no transporte público, nas redes públicas e privadas de saúde e educação; a verificação da adequação das condições ambientais de trabalho na indústria e no comércio à legislação brasileira e a realização de intervenções imediatas quando necessário. Outros pontos são a luta pelo cumprimento da Política Nacional de Resíduos Sólidos; a promoção do trabalho dos catadores e catadoras, com garantias sociais, com o incentivo à formação de cooperativas e associações e a ampliação das Unidades de Conservação em todos os biomas brasileiros. Será promovida a integração das políticas ambientais com as políticas industrial, de energia, de ciência e tecnologia, de educação, de agropecuária, de comércio exterior, de cidades e outras.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Infraestrutura e Mobilidade
  resumo: Prevé estatização de setores estratégicos como água, energia e saneamento, amplo programa de moradia popular e transporte coletivo 100% público e de qualidade.
  texto: Dentre eles, desenvolvemos a luta permanente contra o imperialismo e a solidariedade militante a Cuba, à Palestina, ao povo do Irã, da Venezuela e todos os povos que enfrentam a velha ordem imperial e defendem sua soberania e autodeterminação. Defendemos o fim dos monopólios nas comunicações; a estatização das áreas estratégicas da economia e dos setores produtores de bens necessários à vida, como água, energia, saneamento etc.; a proteção ao meio ambiente; um amplo programa de moradia popular digna; o combate às opressões e a todo e qualquer tipo de discriminação e preconceito. C) Propomos reformas estruturais nas áreas sociais e do mundo do trabalho, com a implantação da jornada de 30 horas semanais sem redução salarial e o fim da escala 6x1; a revogação das contrarreformas que tanto prejuízos trazem à vida do povo trabalhador brasileiro; a reforma agrária popular; a recomposição do poder de compra de trabalhadores e trabalhadoras através do salário-mínimo necessário (de acordo
    com dados do Dieese); o fim do arcabouço fiscal; saúde, transporte coletivo e educação 100% públicos e de qualidade para todos e todas; adoção de uma lei de responsabilidade social para garantir recursos à implementação de políticas sociais voltadas a atender as reais necessidades da população. No Brasil, milhões de famílias enfrentam diariamente os baixos salários, moram em habitações precárias, em favelas e cortiços, enfrentam um transporte caótico, saneamento precário, saúde degradante e serviços públicos que não chegam para todos. Enquanto isso, os banqueiros e grandes empresários continuam acumulando lucros gigantescos às custas do povo trabalhador.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Direitos Humanos
  resumo: Propõe criar um ministério de direitos humanos, revogar a lei antiterrorismo e combater o machismo, o racismo, a lgbtfobia e o capacitismo, defendendo povos originários e quilombolas.
  texto: 'Será desenvolvida uma política de segurança dos direitos humanos, no lugar da segurança pública baseada na repressão à classe trabalhadora, à população pobre e aos moradores das periferias, com a criação de um ministério voltado à aplicação das medidas necessárias à garantia desses direitos e a revogação completa da lei antiterrorismo (12.850/2013). Serão adotadas políticas públicas de combate radical ao machismo, à misoginia, ao racismo, à lgbtfobia, ao capacitismo, em defesa dos direitos das mulheres, da juventude, do povo negro, dos povos originários, quilombolas e das pessoas com deficiência. NOS SERVIÇOS PÚBLICOS E NO MEIO AMBIENTE: A quarta das grandes transformações do governo do poder popular universaliza os direitos essenciais e busca garantir serviços públicos de qualidade para o povo trabalhador. Na saúde o governo do poder popular tornará público todo o sistema de saúde, integrado com assistência (hospitais, serviços ambulatoriais, de apoio diagnóstico e terapêutico),
    pesquisa, produção de medicamentos, vacinas e equipamentos, com fortalecimento da atenção básica em todos os bairros, visando garantir atendimento à saúde a todas as pessoas o mais próximo possível de seus locais de moradia ou trabalho. Usaremos o BNDES e demais ferramentas públicas de financiamento para ampliação dos investimentos no Complexo Econômico-Industrial da Saúde (CEIS), vetor importante para a criação de empregos qualificados, para a produção de medicamentos, insumos, material médico-hospitalar e equipamentos, contribuindo para o desenvolvimento de ciência e tecnologia públicas e soberanas.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Agricultura
  resumo: Critica os latifundiários e os grandes proprietários do agronegócio e defende a reforma agrária popular e a soberania alimentar como enfrentamento à superexploração no campo.
  texto: 'Todos os problemas que o nosso país está vivendo têm responsáveis: os milionários e poderosos nacionais e internacionais. Esses milionários e poderosos têm nome: são empresários industriais, comerciais e de serviços, os banqueiros, especuladores, os latifundiários, os grandes proprietários do agronegócio, do ensino e da saúde privada, as multinacionais, enfim, as classes dominantes que saqueiam o fundo público e aprofundam a superexploração dos trabalhadores e das trabalhadoras. Mesmo diante da crise social que o país vive, esses ricos e poderosos querem avançar ainda mais sobre os direitos da classe trabalhadora, mediante a desumana política neoliberal, o arcabouço fiscal e corte nos gastos públicos para privilegiar os grupos dominantes e isolar a esquerda da disputa política. Por isso, é hora de mudar de verdade. Esse tipo de democracia viciada, onde a maioria social é transformada em minoria parlamentar, não nos interessa, porque é a democracia dos milionários e poderosos, onde
    as decisões tomadas pelos governos representam um ataque aos interesses populares.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Tecnologia e Inovação
  resumo: Defende ciência e tecnologia públicas e soberanas e a ampliação dos investimentos no Complexo Econômico-Industrial da Saúde, com controle social dos serviços públicos.
  texto: Na saúde o governo do poder popular tornará público todo o sistema de saúde, integrado com assistência (hospitais, serviços ambulatoriais, de apoio diagnóstico e terapêutico), pesquisa, produção de medicamentos, vacinas e equipamentos, com fortalecimento da atenção básica em todos os bairros, visando garantir atendimento à saúde a todas as pessoas o mais próximo possível de seus locais de moradia ou trabalho. Usaremos o BNDES e demais ferramentas públicas de financiamento para ampliação dos investimentos no Complexo Econômico-Industrial da Saúde (CEIS), vetor importante para a criação de empregos qualificados, para a produção de medicamentos, insumos, material médico-hospitalar e equipamentos, contribuindo para o desenvolvimento de ciência e tecnologia públicas e soberanas. Um SUS forte, público, gratuito e de qualidade só será possível com um CEIS planejado, forte e soberano. A integração do SUS se dará a partir da atenção primária à saúde, evoluindo até os níveis de maior complexidade,
    processo que deverá ser conjugado com ações de promoção, prevenção, cura e reabilitação dos pacientes. Criaremos os Conselhos Populares de Saúde, eleitos pelos trabalhadores, para o controle do sistema de saúde em todos os níveis.
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Gestão Pública e Combate à Corrupção
  resumo: Propõe reforma estrutural do Judiciário e do Ministério Público, com controle social e transparência, mandatos fixos e revogáveis para tribunais superiores e fim de verbas acima do teto constitucional.
  texto: 'Proibição das BETs com a expropriação dos seus ativos. 14 – Democratização do Judiciário O Judiciário brasileiro tem sido, ao longo dos tempos, um instrumento das classes dominantes para punir os pobres e proteger os ricos, adotando uma lógica de atuação reacionária e antipopular e um funcionamento corporativo sob o qual viceja a corrupção, e no qual os magistrados que cometem crimes raramente são punidos. Os membros dos tribunais superiores são nomeados por governantes de plantão, com mandato vitalício, o que consolida os interesses corporativos, antidemocráticos e antipopulares na instituição judiciária. Para reverter essa situação propomos uma reforma estrutural profunda de todo o judiciário brasileiro (incluindo necessariamente o Ministério Público), tanto do ponto de vista da legislação, quanto do controle social e transparência sobre a atividade da justiça e, especialmente, que os juízes nomeados para os tribunais regionais e superiores tenham mandato fixo sob controle social:
    mandatos de 10 anos elegíveis e revogáveis pelo Poder Popular em sua respectiva jurisdição. Fim de todas as verbas e penduricalhos que ultrapassarem o teto constitucional.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Política Externa
  resumo: Defende o enfrentamento ao imperialismo e a solidariedade aos povos em luta por soberania e autodeterminação, tratando a política externa como parte das transformações estruturais.
  texto: 'Edmilson Costa esteve sempre junto às lutas de nosso povo: foi dirigente estudantil e perseguido no período da ditadura e esteve presente em todas as lutas em defesa das liberdades democráticas e pelo socialismo no Brasil. A candidatura de Edmilson Costa vem para qualificar o debate sobre o Brasil e apresentar soluções para um conjunto de problemas que as outras candidaturas não têm coragem de discutir, como a dramática crise social, as precárias condições de vida dos trabalhadores e trabalhadoras, o enfrentamento ao imperialismo, além de reafirmar a solidariedade com todos os povos em luta por sua soberania e autodeterminação. Cleusa Santos é professora titular aposentada da Escola de Serviço Social da Universidade Federal do Rio de Janeiro, doutora em Serviço Social pela Pontifícia Universidade Católica de São Paulo. Atuou em diferentes funções na Associação Brasileira de Ensino e Pesquisa em Serviço Social, contribuindo para a defesa de uma formação profissional crítica, pública,
    laica e comprometida com a realidade brasileira. Também participou ativamente do movimento docente desde 1989, primeiro na UEPG, no Paraná, e depois na UFRJ, onde integrou três diretorias da ADUFRJ-SSind, seção sindical do ANDES-SN, tendo presidido a entidade entre 2002 e 2003.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
- area: Assistência Social
  resumo: Propõe reforma tributária progressiva sobre lucros, dividendos e grandes fortunas, expansão da previdência pública universal e ampliação da assistência à infância, creches e conselhos tutelares.
  texto: 'Reforma tributária: redução da tributação sobre o consumo, com cobrança progressiva de impostos, de acordo com o rendimento de cada contribuinte, além da criação de um imposto especial sobre lucros e dividendos, grandes fortunas, transações financeiras e heranças. 17 – Direitos Sociais e Trabalhistas, Previdência e Assistência Social Recuperação gradual do poder de compra dos salários, especialmente do salário-mínimo, visando alcançar o piso do salário-mínimo do Dieese. Garantia do direito ao trabalho para todos, com redução da jornada de trabalho para 30 horas sem redução de salário e o fim da escala 6x1. Expansão da previdência pública para a universalidade, com a garantia da cobertura de aposentadorias, pensões e benefícios para todos e todas. Ampliação dos serviços de assistência para a infância, com o fortalecimento e a expansão dos conselhos tutelares, creches e orfanatos, o incentivo à adoção e o combate à exploração do trabalho infantil.'
  fonte: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
